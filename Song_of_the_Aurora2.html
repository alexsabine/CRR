  A Coherence-Rupture-Regeneration composition
  Alexander Sabine · temporalgrammar.ai · cohere.org.uk · March 2026

  CRR (Sabine 2026) — three equations:
    C(x,t) = ∫ L(x,τ) dτ       coherence accumulates
    δ(now)  when  C · Ω = 1     rupture at the Cramer-Rao bound
    R = ∫ φ · exp(C/Ω) · Θ dτ  regeneration from weighted memory

  §CRR CV predictions: Z₂ → CV = 1/(2π) ≈ 0.159. SO(2) → CV = 1/(4π) ≈ 0.080.

  CRR-SOLVED SYSTEMS:
  · Aurora: §NIST O(¹S→¹D) 557.7nm, A=1.26s⁻¹. O(¹D→³P) 630.0nm, A=6.478e-3s⁻¹.
    Ω is a living CRR process (three incommensurate cycles); slider biases it.
    Beauty function B(C/Ω) = exp(C/Ω)·(1-C/Ωπ) drives colour swirl.
  · Stars: Z₂ scintillation (atmospheric turbulence cells). CV ≈ 0.159.
    Brighter stars = larger Ω = less twinkle. Spectral class colouring.
  · Water: exp(-α·Ω·d) CRR absorption kernel (Pope & Fry 1997).
    Fresnel R₀ = 0.02037. SO(2) swell. Ω_water = 0.10.
  · Flame: w(y) = 0.35·(1-C·Ω)^(1/φ). I = B(r)·exp(-r²/2Ω). Ω = 1/π (Z₂).
  · Fish: body = exp(-r²/Ω²). Speed ∝ 1/Ω. Tail freq ∝ 1/Ω. Three Ω-classes.
  · Voice: Z₂ sawtooth glottal → F1/F2/F3 formants. Beauty traces vowel space.
    Fjord echo = exp(-t/τ) regeneration kernel. Entrains to aurora at 4×1.26Hz.
  · Torch: exp(-r²/Ω_beam) spotlight, CRR absorption through water column.
-->

<div class="h" id="b">§NIST O(¹S→¹D) 557.7 nm · τ=0.74 s<br>§NIST O(¹D→³P) 630.0 nm · τ=154 s<br>§CRR exp(−α·Ω·d) — the colour of water</div>

<script>
const PI=Math.PI;
const{sin,cos,min,max,exp,abs,sqrt,random:rnd}=Math;
let ac,mg,t=0,go=false,omAurora=.8;

// ═══════════════════════════════════════════════════
// §CRR AUDIO
// ═══════════════════════════════════════════════════
function audio(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();
  const c=ac.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;c.connect(ac.destination);
  mg=ac.createGain();mg.gain.value=0;mg.connect(c);mg.gain.linearRampToValueAtTime(.25,ac.currentTime+5);
  // Reverb: exp(-t/τ) regeneration kernel
  const rl=ac.sampleRate*4,rb=ac.createBuffer(2,rl,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=rb.getChannelData(ch);for(let i=0;i<rl;i++)d[i]=(rnd()*2-1)*exp(-i/ac.sampleRate/.8)*.3;}
  const rv=ac.createConvolver();rv.buffer=rb;
  const rw=ac.createGain(),rd2=ac.createGain();rw.gain.value=.4;rd2.gain.value=.6;
  mg.connect(rd2);rd2.connect(c);mg.connect(rv);rv.connect(rw);rw.connect(c);
  // §NIST Green 557.7nm: 220Hz AM at A=1.26Hz
  const g=ac.createOscillator();g.type='sine';g.frequency.value=220;
  const gg=ac.createGain();gg.gain.value=.035;g.connect(gg);gg.connect(mg);g.start();
  const gl=ac.createOscillator();gl.frequency.value=1.26;
  const glg=ac.createGain();glg.gain.value=.011;gl.connect(glg);glg.connect(gg.gain);gl.start();
  // §NIST Red 630.0nm: 220×(557.73/630.03) = 194.7Hz
  const r=ac.createOscillator();r.type='sine';r.frequency.value=220*(557.73/630.03);
  const rg=ac.createGain();rg.gain.value=.018;r.connect(rg);rg.connect(mg);r.start();
  // Sub-bass, fifth, ocean, infragravity
  const f=ac.createOscillator();f.type='triangle';f.frequency.value=55;
  const fg=ac.createGain();fg.gain.value=.015;f.connect(fg);fg.connect(mg);f.start();
  const h=ac.createOscillator();h.type='sine';h.frequency.value=330;
  const hg=ac.createGain();hg.gain.value=.004;h.connect(hg);hg.connect(mg);h.start();
  const nb=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;
  const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
  const nf=ac.createBiquadFilter();nf.type='lowpass';nf.frequency.value=100;nf.Q.value=1.5;
  const ng=ac.createGain();ng.gain.value=.06;ns.connect(nf);nf.connect(ng);ng.connect(mg);ns.start();
  const s1=ac.createOscillator(),s2=ac.createOscillator();
  s1.type='sine';s1.frequency.value=26;s2.type='sine';s2.frequency.value=31;
  const sg=ac.createGain();sg.gain.value=.02;s1.connect(sg);s2.connect(sg);sg.connect(mg);s1.start();s2.start();
  window._aG=gg;window._rOsc=rg;

  // §CRR VOICES — Song of the Voice formant engine
  function makeVoice(pitch,vol){
    const v={};
    v.src=ac.createOscillator();v.src.type='sawtooth';v.src.frequency.value=pitch;
    v.vib=ac.createOscillator();v.vib.type='sine';v.vib.frequency.value=5.3;
    v.vibG=ac.createGain();v.vibG.gain.value=14;
    v.vib.connect(v.vibG);v.vibG.connect(v.src.detune);
    v.f1=ac.createBiquadFilter();v.f1.type='bandpass';v.f1.frequency.value=400;v.f1.Q.value=7;
    v.f2=ac.createBiquadFilter();v.f2.type='bandpass';v.f2.frequency.value=1200;v.f2.Q.value=9;
    v.f3=ac.createBiquadFilter();v.f3.type='bandpass';v.f3.frequency.value=2800;v.f3.Q.value=11;
    const g1=ac.createGain(),g2=ac.createGain(),g3=ac.createGain();
    g1.gain.value=.50;g2.gain.value=.35;g3.gain.value=.12;
    v.src.connect(v.f1);v.src.connect(v.f2);v.src.connect(v.f3);
    v.f1.connect(g1);v.f2.connect(g2);v.f3.connect(g3);
    v.gain=ac.createGain();v.gain.gain.value=0;
    g1.connect(v.gain);g2.connect(v.gain);g3.connect(v.gain);
    v.src.start();v.vib.start();v.basePitch=pitch;v.vol=vol;return v;}
  // §CRR Fjord echo
  const elen=ac.sampleRate*4,ebuf=ac.createBuffer(2,elen,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ebuf.getChannelData(ch);for(let i=0;i<elen;i++){const et=i/ac.sampleRate;
    d[i]=((et>.4&&et<.42?.25:0)+(et>.9&&et<.93?.15:0)+(et>1.5&&et<1.54?.08:0))*(rnd()*2-1)*.5+(rnd()*2-1)*exp(-et/.9)*.10;}}
  const echoN=ac.createConvolver();echoN.buffer=ebuf;
  const eW=ac.createGain(),eD=ac.createGain();eW.gain.value=.45;eD.gain.value=.6;
  echoN.connect(eW);eW.connect(mg);eD.connect(mg);
  const father=makeVoice(120,.055),son=makeVoice(250,.044);
  father.gain.connect(eD);father.gain.connect(echoN);
  son.gain.connect(eD);son.gain.connect(echoN);
  window._father=father;window._son=son;
  const VW={mm:[280,800],oo:[320,900],oh:[500,950],ah:[700,1200],eh:[550,1800],ee:[320,2300]};
  function utter(voice,dur,pitchMul,joyful){const now=ac.currentTime;
    const vol=voice.vol*(1.+omAurora*.4);
    voice.gain.gain.cancelScheduledValues(now);
    voice.gain.gain.setValueAtTime(0,now);
    voice.gain.gain.linearRampToValueAtTime(vol,now+.06);
    voice.gain.gain.setValueAtTime(vol,now+dur-.1);
    voice.gain.gain.linearRampToValueAtTime(0,now+dur);
    const p=voice.basePitch*(pitchMul||1);
    voice.src.frequency.cancelScheduledValues(now);
    voice.src.frequency.setValueAtTime(p,now);
    if(joyful){voice.src.frequency.linearRampToValueAtTime(p*1.25,now+dur*.3);
      voice.src.frequency.linearRampToValueAtTime(p*.9,now+dur);
    }else{voice.src.frequency.linearRampToValueAtTime(p*1.04,now+dur*.2);
      voice.src.frequency.linearRampToValueAtTime(p*.92,now+dur);}
    const path=joyful?[VW.oh,VW.ah,VW.eh,VW.ah,VW.oh]:[VW.mm,VW.oo,VW.ah,VW.oo,VW.mm];
    for(let i=0;i<path.length;i++){const st=now+(i/path.length)*dur;
      voice.f1.frequency.setTargetAtTime(path[i][0],st,.04);
      voice.f2.frequency.setTargetAtTime(path[i][1],st,.04);}}
  function sing(voice,notes,noteLen){let delay=0;
    const vol=voice.vol*(1.+omAurora*.4),vibD=22+omAurora*4;
    for(let i=0;i<notes.length;i++){const now=ac.currentTime+delay;
      const p=voice.basePitch*notes[i],dur=noteLen*(.9+rnd()*.2);
      voice.gain.gain.setValueAtTime(0,now);
      voice.gain.gain.linearRampToValueAtTime(vol,now+.04);
      voice.gain.gain.setValueAtTime(vol,now+dur-.08);
      voice.gain.gain.linearRampToValueAtTime(0,now+dur);
      voice.src.frequency.setValueAtTime(p,now);
      const v=i%2===0?VW.ah:VW.oh;
      voice.f1.frequency.setTargetAtTime(v[0],now,.03);
      voice.f2.frequency.setTargetAtTime(v[1],now,.03);
      voice.vibG.gain.setValueAtTime(vibD,now);delay+=dur+.03;}
    voice.vibG.gain.setTargetAtTime(14,ac.currentTime+delay,.1);}
  window._sing=sing;window._utter=utter;
  const melodies=[[1,1.125,1.25,1.125,1],[1,1.25,1.5,1.25,1.125,1],[1.5,1.25,1,1.125,1.25]];
  let nextUtt=8+rnd()*10,lastSpoke=0,prevHigh=false;
  window._voiceTick=function(t){if(t-lastSpoke<7)return;
    const entrain=min(1.,omAurora*.3);
    const fVib=5.3*(1.-entrain*.15)+1.26*4*entrain*.15;
    father.vib.frequency.setTargetAtTime(fVib,ac.currentTime,.5);
    son.vib.frequency.setTargetAtTime(fVib+.2,ac.currentTime,.5);
    if(omAurora>1.2&&!prevHigh&&t>10){prevHigh=true;
      utter(son,.6+rnd()*.3,1.15,true);
      setTimeout(()=>utter(father,.5+rnd()*.3,.95,false),1800+rnd()*1200);
      lastSpoke=t;nextUtt=t+15+rnd()*18;return;}
    if(omAurora<=1.2)prevHigh=false;
    if(t<nextUtt)return;
    const roll=rnd();
    if(roll<.2){utter(son,.4+rnd()*.3,1.1+rnd()*.1,true);
      if(rnd()>.4)setTimeout(()=>utter(father,.4+rnd()*.2,.9,false),1200+rnd()*800);
    }else if(roll<.35){utter(father,.5+rnd()*.4,.92+rnd()*.08,false);
    }else if(roll<.5){utter(son,.35+rnd()*.2,1.1,true);
      setTimeout(()=>utter(father,.4+rnd()*.3,.95,rnd()>.6),1000+rnd()*800);
    }else if(roll<.65){sing(son,melodies[Math.floor(rnd()*melodies.length)],.35+rnd()*.15);
    }else if(roll<.78){sing(father,melodies[Math.floor(rnd()*melodies.length)],.45+rnd()*.15);
    }else if(roll<.9){const mel=melodies[Math.floor(rnd()*melodies.length)];
      sing(son,mel,.35);setTimeout(()=>sing(father,mel,.45),mel.length*.38*500+rnd()*400);
    }else{utter(father,.8+rnd()*.4,.88,false);}
    lastSpoke=t;nextUtt=t+12+rnd()*22;};}

// ═══════════════════════════════════════════════════
// §GLSL SHADER
// ═══════════════════════════════════════════════════
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const FS=`precision highp float;
uniform vec2 R;uniform float T,OMA;
const float PI=3.14159265;
const float PHI=1.618034;
const float R0=0.02037;
const vec3 AL=vec3(.50,.045,.005);
const float WOM=0.10;

// Noise: all aurora structure uses fb() (5-octave fbm) to avoid cell-edge artefacts
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n2(p);p*=2.03;a*=.49;}return v;}

// §CRR Stars — Z₂ scintillation, CV ≈ 0.159
float starField(vec2 sp,float t){
  float s=0.;
  vec2 id=floor(sp*400.);float r1=h2(id);
  if(r1>.994){vec2 ctr=(id+vec2(h2(id+.1),h2(id+.2))*.6+.2)/400.;
    float d=length(sp-ctr)*400.,mag=(r1-.994)*166.;
    float scint=.84+.08*sin(t*(1.2+r1*4.)+r1*60.)+.05*sin(t*(.3+r1*1.5)+r1*30.)+.03*sin(t*(.08+r1*.4)+r1*15.);
    s+=exp(-d*d*3.)*mag*mix(scint,1.,mag*.3)*.25;}
  vec2 id2=floor(sp*100.);float r2=h2(id2+77.);
  if(r2>.998){vec2 ctr2=(id2+vec2(h2(id2+.3),h2(id2+.4))*.5+.25)/100.;
    float d2=length(sp-ctr2)*100.,mag2=(r2-.998)*500.;
    float scint2=.88+.06*sin(t*(.9+r2*3.)+r2*50.)+.04*sin(t*(.25+r2)+r2*25.)+.02*sin(t*(.06+r2*.3)+r2*10.);
    s+=exp(-d2*d2*2.)*mag2*scint2*.35;}
  return s;}

// §PHYS Fjord mountains
float fjord(float az){float h=.04;
  h+=fb(vec2(az*2.8,.5))*.045+n2(vec2(az*10.,1.5))*.022+n2(vec2(az*24.,3.))*.009;
  h+=.04*exp(-12.*(az-.3)*(az-.3))+.035*exp(-18.*(az+.35)*(az+.35));
  h+=.02*exp(-9.*(az-.75)*(az-.75))+.025*exp(-14.*(az+.1)*(az+.1))+.015*exp(-20.*(az-.55)*(az-.55));
  return h;}

// ─── §CRR AURORA ───
vec3 sky(vec3 rd,float t,float aom){
  float elev=rd.y,az=atan(rd.x,rd.z),ae=max(0.,elev);
  // Night sky base
  vec3 c=mix(vec3(.010,.015,.030),vec3(.004,.005,.014),smoothstep(0.,.6,ae));
  c+=vec3(.006,.012,.010)*smoothstep(0.,.25,ae);
  // Stars
  vec2 sp=vec2(az*3.,ae*5.);float s=starField(sp,t);
  float cSeed=h2(floor(sp*100.)+77.);
  c+=mix(vec3(.6,.65,.85),vec3(.85,.7,.5),step(.7,cSeed))*s*smoothstep(.03,.12,ae);

  // §CRR Living Ω — aurora breathes autonomously
  // Three incommensurate C→δ→R cycles; slider biases the centre
  float omAuto=(.5+.5*sin(t*.025))*.4+(.5+.5*sin(t*.07+1.3))*.35+(.5+.5*sin(t*.18+2.7))*.25;
  float aomL=clamp(aom*(.5+omAuto*.7),.05,3.5);

  // §CRR Structural parameters — only swirlStrength scales strongly with Ω
  float omN=clamp(aomL/2.5,0.,1.);
  float foldAmp=.30+omN*.15;
  float foldSpd=.04+omN*.08;
  float swirlStr=.25+omN*1.2;
  float turbSpd=.03+omN*.03;

  float intScale=.08+aomL*.75;
  float substorm=(.45+.55*(.5+.5*sin(t*.08)))*intScale;
  float pulse=.94+.06*sin(t*1.26*6.2832);
  float turb=.8+aomL*.4;

  vec3 aur=vec3(0.);
  for(int ci=0;ci<3;ci++){
    float cid=float(ci);
    float caz=az+cid*.45-.4;

    // §CRR Curtain folding — all fbm, no sharp sines for structure
    float fold1=fb(vec2(caz*1.2+cid*7.,t*foldSpd*2.+cid))-.5;
    float fold2=fb(vec2(caz*2.5+cid*13.,t*foldSpd*3.+cid*3.))-.5;
    float ps=fold1*foldAmp+fold2*(foldAmp*.4)
            +(fb(vec2(caz*1.4+cid*8.,t*turbSpd*turb+cid))-.5)*.28*turb;

    // Curtain envelope — fixed width, gentle breathing
    float cw=.55+.15*sin(t*.10+cid*3.);
    float hI=exp(-(caz+ps)*(caz+ps)/(2.*cw*cw));

    // §CRR Ray structure — ALL fbm, no n2 anywhere (eliminates line artefacts)
    // Two fbm fields at different scales, blended. Organic curvature from noise offset.
    float rayCurve=(fb(vec2(az*2.+cid*5.,ae*1.5+t*.02+cid*2.))-.5)*.15*ae;
    float rayAz=az+rayCurve;
    float ray1=fb(vec2(rayAz*14.+cid*11.,t*.06+cid*3.));
    float ray2=fb(vec2(rayAz*7.+cid*6.+5.,ae*2.+t*.03+cid));
    float ray=.35+.65*mix(ray1,ray2,.35);

    // Fine shimmer — fbm with gentle elevation coupling
    float fine=.4+.6*fb(vec2(az*20.+cid*14.,ae*1.2+t*.025));

    // Vertical extent — fixed height, soft edges
    float base=.035+.012*sin(az*2.+t*.12+cid*4.);
    float top=.75+.15*min(1.,aomL*.5)+.08*sin(az*1.1-t*.07+cid*2.);
    float vert=smoothstep(base,base+.10,ae)*smoothstep(top,top-.20,ae);

    // Brightness patches — continuous fbm, no smoothstep thresholds
    float patch=.3+.7*fb(vec2(az*2.8+cid*5.5,t*.04+cid*2.));

    float I=hI*(.3+.7*ray)*fine*patch*substorm*pulse*(1.-cid*.18);
    float alt=smoothstep(base,top,ae);

    // §CRR Beauty-driven colour swirl — THE main Ω effect
    // B(C/Ω) traces a phase that shifts the colour mapping laterally.
    // At high Ω the colours pour through each other; at low Ω they stay in bands.
    float beautyPh=fb(vec2(az*2.+cid*4.+t*.035,ae*2.+t*.02+cid))*.6
                  +fb(vec2(az*4.+cid*9.-t*.025,ae*1.+t*.015+cid*2.))*.25;
    float altSwirl=clamp(alt+(beautyPh-.4)*swirlStr,0.,1.);

    // §NIST Emission colours — ALL continuous functions, no hard thresholds
    float gw=exp(-12.*(altSwirl-.18)*(altSwirl-.18));
    float cyw=exp(-7.*(altSwirl-.32)*(altSwirl-.32))*.5;
    float pw=.9*altSwirl*altSwirl;
    float pkw=.5*altSwirl*altSwirl*altSwirl;
    float dbw=.3*(1.-altSwirl)*(1.-altSwirl);
    float ww=gw*I*.25;
    aur+=(vec3(.35,1.,.48)*gw+vec3(.25,.70,.62)*cyw+vec3(.55,.15,.55)*pw
         +vec3(.65,.25,.55)*pkw+vec3(.18,.12,.55)*dbw+vec3(.7,1.,.75)*ww)*I;
  }
  c+=aur;
  float aI=length(aur);
  c+=vec3(.008,.016,.012)*aI*.25+vec3(.020,.006,.018)*smoothstep(.25,.65,ae)*aI*.12;

  // Mountains
  float mh=fjord(az);
  if(elev<mh&&elev>-.02)c=mix(c,vec3(.004,.006,.010)+aur*.008,smoothstep(mh,mh-.004,elev));
  return c;
}

// §CRR Ocean
float sea(vec2 p,float t,float lod){float h=0.,om=WOM,sk=om*.4;
  h+=.30*om*(sin(p.y*.32+t*.40+p.x*.03)+sk*.22*sin(2.*(p.y*.32+t*.40+p.x*.03)));
  h+=.15*om*(sin(p.y*.62+t*.75-p.x*.06+.8)+sk*.22*sin(2.*(p.y*.62+t*.75-p.x*.06+.8)));
  h+=.18*om*sin(p.x*.18+p.y*.08+t*.30+2.)+.08*om*sin(p.y*.50+t*.60+p.x*.09+1.3);
  if(lod<.8){h+=fb(p*1.8+vec2(-t*.08,t*.22))*.08*om*(1.-lod)+fb(p*3.5+vec2(t*.1,t*.18))*.035*om*(1.-lod);}
  if(lod<.5){float f=1.-lod*2.;h+=n2(p*8.+vec2(t*.15,t*.6))*.015*om*f+n2(p*16.+vec2(t*.3,t*1.))*.006*om*f;}
  return h;}

vec2 boatXZ(float t){return vec2(sin(t*.018)*6.,10.+sin(t*.011)*5.);}

// §CRR Flame: Ω=1/π (Z₂)
float crrFlame(vec2 p,float t){float OM_F=1./PI,y=p.y;
  if(y<0.||y>1.)return 0.;
  float w=.35*pow(max(0.,1.-y),1./PHI);
  float turb=sin(y*12.+t*8.)*.12*OM_F+sin(y*25.-t*13.)*.06*OM_F*OM_F+n2(vec2(y*8.,t*3.))*.08*OM_F;
  float B=exp(y*2.)*max(0.,1.-y);
  return max(0.,B*exp(-(p.x-turb)*(p.x-turb)/(2.*OM_F*w*w+.001))*(.85+.15*sin(t*2.*PI*OM_F*3.))*(.9+.1*sin(t*7.3)));}
vec3 flameCol(float I,float y){
  return mix(mix(vec3(.9,.35,.08),vec3(1.,.85,.45),smoothstep(0.,.4,I)),vec3(1.,.95,.75),smoothstep(.5,.9,clamp(y,0.,1.))*smoothstep(.3,.8,I))*I;}

// §CRR Water shading
vec3 shadeW(vec3 N,vec3 rd,vec3 hp,float dist,float t,float aom){
  float ci=max(0.,dot(N,-rd)),fr=R0+(1.-R0)*pow(1.-ci,5.);
  float depth=8./max(.05,ci),turbidity=.2+.8*WOM;
  vec3 trans=exp(-AL*turbidity*depth);
  vec3 aA=sky(vec3(0,.5,rd.z),t,aom);float pen=max(0.,N.y)*.22;
  vec3 sub=aA*pen*trans+aA*pen*exp(-AL*turbidity*depth*1.8)*.08*vec3(.1,.6,.5);
  // Lantern
  vec2 bpos=boatXZ(t);float dB=length(hp.xz-bpos);
  float lanR=14./(1.+dB*dB*.8);
  float flick=.86+.14*sin(t*6.)*(.88+.12*sin(t*7.3));
  vec3 lanSub=vec3(1.,.75,.35)*lanR*exp(-AL*turbidity*(3.+2./max(.05,ci)))*flick*.12;
  float caust=max(0.,n2(hp.xz*4.+vec2(-t*.3,t*.2))+n2(hp.xz*8.+vec2(t*.5,-t*.3))-.5)*2.;
  lanSub+=vec3(.8,.6,.25)*caust*lanR*.03*flick+vec3(.05,.3,.25)*exp(-dB*.3)*flick*.05*smoothstep(8.,0.,dB);
  // Torch
  float tOn=smoothstep(.45,.55,sin(t*.11+2.))*smoothstep(.3,.45,sin(t*.07+1.));
  float swA=sin(t*.25)*1.2+cos(t*.17)*.6;
  vec2 tSpot=bpos+vec2(cos(swA),sin(swA))*(5.+sin(t*.13)*2.);
  float dS=length(hp.xz-tSpot),tI=exp(-dS*dS/1.28)*tOn;
  float tFlick=.88+.12*sin(t*4.1)*sin(t*6.7);
  lanSub+=vec3(.85,.82,.7)*tI*exp(-AL*turbidity*4.)*tFlick*.18;
  // Fish
  vec3 fishC=vec3(0.);
  for(int fi=0;fi<16;fi++){float fid=float(fi);
    float fOm=fi<3?1.:fi<9?.5:.25;
    float oR=.8+fid*.28+sin(t*.12+fid)*.8,oA=t*(.3/fOm)*.2+fid*.53;
    vec2 fB=bpos+vec2(cos(oA),sin(oA))*oR;
    vec2 toS=tSpot-fB;fB+=toS*.25*smoothstep(5.,0.,length(toS));
    vec2 fd=hp.xz-fB;float hd=oA+PI*.5+sin(t*.35+fid)*.3;
    float ch2=cos(hd),sh2=sin(hd);
    vec2 fr2=vec2(fd.x*ch2+fd.y*sh2,-fd.x*sh2+fd.y*ch2);
    fr2.y+=fOm*.06*max(0.,fr2.x)*sin(fr2.x*4./fOm+t*4./fOm+fid*2.1);
    float fI=exp(-fr2.x*fr2.x*1.8/(fOm*fOm)-fr2.y*fr2.y*35./(fOm*fOm));
    float lit=max(smoothstep(6.,0.,dB),tI*smoothstep(3.,0.,length(fB-tSpot)));
    vec3 fc=mix(vec3(.7,.65,.45),vec3(.5,.55,.4),sin(fid*3.)*.5+.5);
    fc*=.8+.2*sin(t*1.4+fid*3.9)*sin(t*.9+fid*6.1);
    fishC+=fc*fI*lit*exp(-AL*turbidity*4.)*tFlick*.35;}
  // Splash
  float jPh=fract(t*.15),jAct=smoothstep(0.,.08,jPh)*smoothstep(.25,.12,jPh);
  if(jAct>.01){float jIdx=floor(mod(t*.15,16.)),jOm=jIdx<3.?1.:jIdx<9.?.5:.25;
    vec2 jP=bpos+vec2(cos(t*(.3/jOm)*.2+jIdx*.53),sin(t*(.3/jOm)*.2+jIdx*.53))*(.8+jIdx*.28);
    float sR=length(hp.xz-jP),sT=jPh<.12?jPh/.12:(jPh>.18?clamp((jPh-.18)/.07,0.,1.):0.);
    fishC+=vec3(.45,.55,.4)*(exp(-sR*sR*2.)*sT*.05+exp(-(sR-sT*1.5)*(sR-sT*1.5)*8.)*sT*.025)*smoothstep(6.,0.,length(jP-bpos));}
  // Compose
  vec3 deep=vec3(.001,.004,.006)+exp(-AL*.3)*vec3(.005,.03,.035)*min(1.,(1.-N.y)*(1.-N.y)*WOM*.6);
  vec3 refl=sky(reflect(rd,N),t,aom);
  refl+=vec3(1.,.8,.4)*(10./(1.+dB*dB*.6))*flick*.08*smoothstep(8.,0.,dB);
  refl+=vec3(.8,.78,.65)*tI*6.*tFlick*.06*smoothstep(4.,0.,dS);
  refl=mix(refl,refl*.55+vec3(.002,.005,.004),smoothstep(20.,140.,dist)*.35);
  return mix(deep+sub+lanSub,refl,fr)+fishC*(1.-fr*.5);}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;float t=T,aom=OMA;
  vec3 ro=vec3(0.,2.5,0.),fw=normalize(vec3(0.,.08,1.));
  vec3 ri=normalize(cross(fw,vec3(0,1,0))),up=cross(ri,fw);
  vec3 rd=normalize(fw+uv.x*ri*1.15+uv.y*up);
  vec3 col=sky(rd,t,aom);
  float az=atan(rd.x,rd.z),wl=min(fjord(az),.01);
  if(rd.y<wl){
    float tF=max(.1,-ro.y/min(-.0001,rd.y));
    vec3 dH=ro+rd*min(tF,200.),dW=shadeW(vec3(0,1,0),rd,dH,min(tF,300.),t,aom);
    float tc=.3;bool hit=false;vec3 hp;
    for(int i=0;i<100;i++){vec3 p=ro+rd*tc;float lod=smoothstep(8.,80.,tc);
      float h=sea(p.xz,t,lod),d=p.y-h;if(d<.02){hit=true;hp=p;break;}
      tc+=max(.03+lod*.15,d*.35);if(tc>160.)break;}
    if(hit){float dist=length(hp-ro),lod=smoothstep(8.,80.,dist),e=.05+lod*.12;
      vec3 N=normalize(vec3(sea(hp.xz-vec2(e,0),t,lod)-sea(hp.xz+vec2(e,0),t,lod),2.*e,
                            sea(hp.xz-vec2(0,e),t,lod)-sea(hp.xz+vec2(0,e),t,lod)));
      vec3 oc=shadeW(N,rd,hp,dist,t,aom);
      float wc=smoothstep(.8,1.2,max(0.,(sea(hp.xz+vec2(0,e),t,lod)-sea(hp.xz-vec2(0,e),t,lod))/(2.*e))*WOM)
              *smoothstep(-.1,.3,sea(hp.xz,t,lod));
      col=mix(mix(oc,vec3(.5,.55,.48),wc*.7*(.5+.3*n2(hp.xz*8.+vec2(t*.3,t*.2)))),dW,lod);
    }else col=dW;
    col=mix(col,sky(rd,t,aom),smoothstep(wl-.005,wl,rd.y));}
  // Torch beam in air
  {vec2 tb=boatXZ(t);float tOn=smoothstep(.45,.55,sin(t*.11+2.))*smoothstep(.3,.45,sin(t*.07+1.));
  float swA=sin(t*.25)*1.2+cos(t*.17)*.6,swR=5.+sin(t*.13)*2.;
  vec3 tO=vec3(tb.x,.4,tb.y),tA=normalize(vec3(tb.x+cos(swA)*swR,-.3,tb.y+sin(swA)*swR)-tO);
  vec3 cl=ro+rd*max(0.,dot(tO-ro,rd)),bp=tO+tA*max(0.,dot(cl-tO,tA));
  float bDt=length(cl-bp),aB=dot(bp-tO,tA),bC=.003+aB*.03;
  col+=vec3(.9,.85,.7)*exp(-bDt*bDt/(2.*bC*bC))*smoothstep(0.,.5,aB)*smoothstep(8.,2.,aB)
      *(.9+.1*sin(t*4.1)*sin(t*6.7))*.012*tOn*smoothstep(60.,8.,dot(vec3(tb.x,0.,tb.y)-ro,fw));}
  // Boat
  vec2 bpos=boatXZ(t);vec3 toB=vec3(bpos.x,0.,bpos.y)-ro;
  float bSX=dot(toB,ri)/dot(toB,fw),bSY=dot(toB,up)/dot(toB,fw),bDist=dot(toB,fw);
  if(bDist>2.&&bDist<100.){float bSc=.6/bDist;
    vec2 bUV=(uv-vec2(bSX,bSY))/bSc;float vis=smoothstep(100.,10.,bDist);
    float rock=sea(bpos,t,.5)*5.;float cr=cos(rock),sr=sin(rock);
    bUV=vec2(bUV.x*cr-bUV.y*sr,bUV.x*sr+bUV.y*cr);
    float hXn=bUV.x/1.6,ax=abs(hXn);
    if(ax<1.){float keel=-.32*(1.-ax*ax),gun=.06+.14*ax*ax+.04*hXn;
      float hull=step(keel,bUV.y)*step(bUV.y,gun);
      float thw=smoothstep(.01,0.,abs(bUV.y+.02))*step(-.6,hXn)*step(hXn,.6)
               +smoothstep(.01,0.,abs(bUV.y+.10))*step(-.8,hXn)*step(hXn,.8);
      float dX=bUV.x+.35,dY=bUV.y-gun;
      float dad=max(step(-.13,dX)*step(dX,.13)*step(0.,dY)*step(dY,.48),
                max(smoothstep(.20,.16,abs(dX))*step(.32,dY)*step(dY,.45),smoothstep(.10,.06,length(vec2(dX,dY-.58)))));
      float sW=sin(t*.4)*.4,sX=bUV.x-.1+sW,sY=bUV.y-gun;
      float tOnB=smoothstep(.45,.55,sin(t*.11+2.))*smoothstep(.3,.45,sin(t*.07+1.));
      float aAng=sin(t*.25)*.4;float ca3=cos(aAng),sa3=sin(aAng);
      vec2 aR=vec2((sX-.08)*ca3+(sY-.22)*sa3,-(sX-.08)*sa3+(sY-.22)*ca3);
      float arm=smoothstep(.015,0.,abs(aR.y))*step(0.,-aR.x)*step(-aR.x,.4)*tOnB;
      float tBody=smoothstep(.04,.01,length(vec2(aR.x+.4,aR.y)))*tOnB;
      float tGlow=exp(-length(vec2(aR.x+.4,aR.y))/.06)*.15*tOnB;
      float son=max(max(step(-.08,sX)*step(sX,.08)*step(0.,sY)*step(sY,.30),
                        smoothstep(.08,.04,length(vec2(sX,sY-.38)))),max(arm,tBody));
      float bite=step(.97,sin(t*.31+2.7));float rAng=-.18-.08*bite;
      float cra=cos(rAng),sra=sin(rAng);
      vec2 rr=vec2((bUV.x+.25)*cra+(bUV.y-gun-.30)*sra,-(bUV.x+.25)*sra+(bUV.y-gun-.30)*cra);
      float rod=smoothstep(.012,0.,abs(rr.y))*step(0.,-rr.x)*step(-rr.x,2.2);
      float lineX=bUV.x+.25+2.2*cos(PI+rAng),lineY=gun+.30+2.2*sin(PI+rAng);
      float fLine=smoothstep(.005,0.,abs(bUV.x-lineX))*step(bUV.y,lineY)*step(gun-.3,bUV.y);
      float caught=bite*smoothstep(.04,0.,length(vec2(bUV.x-lineX,bUV.y-(gun-.2))));
      float lx=bUV.x-.7,ly=bUV.y-gun;
      float post=smoothstep(.020,0.,abs(lx))*step(0.,ly)*step(ly,.55);
      float bArm=smoothstep(.016,0.,abs(ly-.55+lx*lx))*step(-.18,lx)*step(lx,.18)*step(.4,ly);
      float gBot=.55,gTop=.88,gW=.09;
      float inG=step(-gW,lx)*step(lx,gW)*step(gBot,ly)*step(ly,gTop);
      float pane=smoothstep(.006,0.,abs(lx))*step(gBot,ly)*step(ly,gTop);
      float pEdge=smoothstep(.006,0.,abs(abs(lx)-gW))*step(gBot,ly)*step(ly,gTop)
                 +smoothstep(.006,0.,abs(ly-gBot))*step(-gW,lx)*step(lx,gW)
                 +smoothstep(.006,0.,abs(ly-gTop))*step(-gW,lx)*step(lx,gW);
      float cap=step(-(gW+.02),lx)*step(lx,gW+.02)*step(gTop,ly)*step(ly,gTop+.04);
      float chim=smoothstep(.03,0.,abs(lx))*step(gTop+.04,ly)*step(ly,gTop+.12);
      float fin=smoothstep(.035,.01,length(vec2(lx,ly-gTop-.15)));
      float fI=crrFlame(vec2(lx/(gW*.8),(ly-gBot-.03)/(gTop-gBot-.06)),t);
      vec3 fCol=flameCol(fI,(ly-gBot-.03)/(gTop-gBot-.06));
      fCol+=vec3(1.,.95,.8)*exp(-dot(vec2(lx,ly-gBot-.08),vec2(lx,ly-gBot-.08))/.002)*.8;
      float gl=exp(-dot(vec2(lx,ly-(gBot+gTop)*.5),vec2(lx,ly-(gBot+gTop)*.5))/.18)*.65;
      gl*=.86+.14*sin(t*6.)*(.88+.12*sin(t*7.3));
      float bM=clamp(hull+dad+son+post+bArm+cap+chim+fin,0.,1.);
      vec3 bCol=vec3(.005,.006,.008)+vec3(.007,.006,.004)*thw+vec3(.12,.08,.03)*exp(-(lx+.3)*(lx+.3)/.3)*fI*.15;
      col=mix(col,bCol,bM*vis);
      col=mix(col,vec3(.008,.007,.006),clamp(rod+fLine*.4,0.,1.)*.6*vis);
      col+=vec3(.6,.5,.2)*caught*vis*.4;
      col=mix(col,vec3(.025,.03,.035),clamp(pEdge+pane*.3,0.,1.)*vis);
      col+=vec3(.9,.65,.25)*fI*.35*float(inG>0.)*bSc*16.*vis;
      col+=fCol*bSc*18.*vis+vec3(1.,.68,.28)*gl*bSc*12.*vis+vec3(.85,.8,.6)*tGlow*bSc*8.*vis;}}
  // Post
  vec2 v=gl_FragCoord.xy/R;
  col*=.5+.5*smoothstep(0.,.25,v.x)*smoothstep(1.,.75,v.x)*smoothstep(0.,.1,v.y)*smoothstep(1.,.9,v.y);
  col=col/(col+vec3(.20));col=pow(col,vec3(.93,.95,.98));
  gl_FragColor=vec4(col,1.);}`;

// ═══════════════════════════════════════════════════
// §WEBGL + CONTROLS
// ═══════════════════════════════════════════════════
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:false,alpha:false});
let W,H;function rz(){W=cv.width=innerWidth;H=cv.height=innerHeight;gl.viewport(0,0,W,H);}
rz();addEventListener('resize',rz);
function mk(s,tp){const sh=gl.createShader(tp);gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.error('GLSL:',gl.getShaderInfoLog(sh));return sh;}
const pg=gl.createProgram();
gl.attachShader(pg,mk(VS,gl.VERTEX_SHADER));gl.attachShader(pg,mk(FS,gl.FRAGMENT_SHADER));
gl.linkProgram(pg);if(!gl.getProgramParameter(pg,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pg));
gl.useProgram(pg);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pg,'R'),uT=gl.getUniformLocation(pg,'T'),uOMA=gl.getUniformLocation(pg,'OMA');

const slider=document.getElementById('os'),olabel=document.getElementById('ov');
slider.addEventListener('input',function(){omAurora=parseFloat(this.value);
  olabel.textContent='\u03A9 = '+(omAurora/PI).toFixed(2)+'/\u03C0  '
    +(omAurora<.3?'quiet':omAurora<.7?'gentle':omAurora<1.2?'active':omAurora<2.0?'substorm':'major storm');
  if(window._aG){window._aG.gain.value=.015+omAurora*.02;window._rOsc.gain.value=.008+omAurora*.012;}
  if(omAurora>2.8&&window._utter){
    setTimeout(()=>{if(window._son)window._utter(window._son,.5,1.2,true);},200);
    setTimeout(()=>{if(window._father)window._utter(window._father,.6,.95,true);},1200+Math.random()*800);}});

document.getElementById('singBtn').addEventListener('click',function(e){e.stopPropagation();
  if(!go)start();
  if(ac&&ac.state==='suspended')ac.resume();
  if(window._sing){const mels=[[1,1.125,1.25,1.125,1],[1,1.25,1.5,1.25,1.125,1],[1.5,1.25,1,1.125,1.25]];
    const mel=mels[Math.floor(rnd()*mels.length)];
    window._sing(window._son,mel,.35);
    setTimeout(()=>window._sing(window._father,mel,.45),mel.length*.38*500+rnd()*300);}});

let lt=0;
function frame(n){requestAnimationFrame(frame);
  const dt=min(.05,(n-lt)/1e3);lt=n;t+=dt*(go?.6:.12);
  gl.uniform2f(uR,W,H);gl.uniform1f(uT,t);gl.uniform1f(uOMA,omAurora);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  if(go&&window._voiceTick)window._voiceTick(t);}
function start(){if(go)return;go=true;document.getElementById('u').classList.add('d');audio();
  if(ac&&ac.state==='suspended')ac.resume();}
document.body.addEventListener('click',start);
document.body.addEventListener('touchstart',start);
requestAnimationFrame(frame);
</script>
