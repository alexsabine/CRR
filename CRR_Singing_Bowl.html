<!DOCTYPE html>
<html lang="en">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;overflow:hidden;height:100vh;height:100dvh;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  touch-action:none;-webkit-touch-callout:none}
canvas{position:absolute;top:0;left:0}
#cv{pointer-events:none}

  cursor:pointer;transition:all .3s}
.c button:hover,.c button.on{border-color:rgba(200,180,140,0.4);
  color:rgba(200,180,140,0.5)}

#cZ{bottom:14px;left:50%;transform:translateX(-50%)}

<script>
// ╔═══════════════════════════════════════════════════════════════════════╗
// ║                                                                     ║
// ║   S O N G   O F   T H E   B O W L                                  ║
// ║   A CRR Composition                                                 ║
// ║                                                                     ║
// ║   Coherence–Rupture–Regeneration (Sabine 2025)                      ║
// ║                                                                     ║
// ║   Three equations govern all dynamics in this composition:          ║
// ║                                                                     ║
// ║   1. COHERENCE — the past accumulates:                              ║
// ║      C(x,t) = ∫ L(x,τ) dτ                                         ║
// ║                                                                     ║
// ║   2. RUPTURE — the present is instantaneous:                        ║
// ║      δ(now)   when C·Ω = 1                                         ║
// ║                                                                     ║
// ║   3. REGENERATION — the future is built from weighted memory:       ║
// ║      R = ∫ φ(x,τ) · exp(C/Ω) · Θ(…) dτ                           ║
// ║                                                                     ║
// ║   Ω = σ² = system variance (boundary permeability)                  ║
// ║   B(C/Ω) = exp(C/Ω)·(1 − C/Ωπ)  beauty function, peaks π−1       ║
// ║                                                                     ║
// ║   Symmetry classes:                                                 ║
// ║     Z₂  (bistable):   Ω = 1/π      CV = 1/2π ≈ 0.159             ║
// ║     SO(2) (rotational): Ω = 1/2π     CV = 1/4π ≈ 0.080             ║
// ║                                                                     ║
// ║   A singing bowl is a Z₂ system. Each vibrational mode is a        ║
// ║   bistable doublet: two degenerate orientations split by the        ║
// ║   bowl's asymmetry. Coherence accumulates as the mode rings.        ║
// ║   The strike is δ(now). The decay is regeneration R.                ║
// ║                                                                     ║
// ║   Alexander Sabine · cohere.org.uk · temporalgrammar.ai             ║
// ╚═══════════════════════════════════════════════════════════════════════╝

const PI = Math.PI, TAU = 2 * PI, PHI = (1 + Math.sqrt(5)) / 2;
const {sin,cos,sqrt,pow,abs,min,max,exp,log,random:rnd,atan2,asin,acos,floor:flr} = Math;

// ═══════════════════════════════════════════════════════════════════════
// §1  CRR CONSTANTS
//
//   Ω_Z₂ = 1/π  — the Z₂ bistable boundary permeability.
//   At rupture, coherence × variance = 1:  C · Ω = 1  →  C = π
//
//   The beauty function B(C/Ω) = exp(C/Ω)·(1 − C/Ωπ) peaks at
//   C/Ω = π−1 ≈ 2.14, where amplification and remaining capacity
//   are optimally balanced. This governs droplet expressiveness.
// ═══════════════════════════════════════════════════════════════════════
const OmZ2 = 1 / PI;
function B(r) { return max(0, exp(min(10, r)) * (1 - r / PI)); }

// ═══════════════════════════════════════════════════════════════════════
// §2  FARADAY DROPLET SCALING
//
//   Each Faraday standing-wave cell on the water surface is a Z₂
//   micro-CRR system: two states (crest-up / crest-down) alternate
//   at f_F = f₀/2. When coherence saturates (C·Ω = 1), the surface
//   fractures (δ) and a droplet is the regenerated entity R.
//
//   SPATIAL:  λ_F ∝ f₀^(−2/3)  from capillary dispersion ω² = (σ/ρ)k³
//             droplet diameter d ∝ λ_F
//   TEMPORAL: T_bounce = 4/f₀   (Z₂ cascade: f₀ → f₀/2 → f₀/4)
//   HEIGHT:   h_ej ∝ 1/f₀²     (same acceleration, more displacement)
//
//   All scalings are relative to the G3 reference bowl (196 Hz):
// ═══════════════════════════════════════════════════════════════════════
const F_REF = 196;
function dropScale()   { return pow(F_REF / F0, 2/3); }
function heightScale() { return pow(F_REF / F0, 2);   }
function bouncePer()   { return 4 / F0; }
function faradayK()    { return 26 * pow(F0 / F_REF, 2/3); }

// ═══════════════════════════════════════════════════════════════════════
// §3  CRR CHROMATIC DISPERSION
//
//   A water droplet is a Z₂ optical system:
//     State A: ray inside (n_water)  |  State B: ray outside (n_air = 1)
//     Boundary: spherical air-water interface
//     Ω_optical = R₀ = ((n−1)/(n+1))² ≈ 0.020  (Fresnel reflectance)
//
//   Cauchy dispersion gives each wavelength its OWN refractive index:
//
//     n(λ) = 1.3199 + 6878/λ²     (λ in nm, Daimon & Masumura 2007)
//
//   So each wavelength is an independent Z₂ CRR system with:
//
//     Ω(λ) = 1 / (π · n(λ))
//
//     λ=680nm (red):    n=1.335  Ω=0.239  θ_c=48.5°
//     λ=530nm (green):  n=1.344  Ω=0.237  θ_c=48.1°
//     λ=400nm (violet): n=1.363  Ω=0.234  θ_c=47.2°
//
//   Because Ω(λ) differs, two observable effects emerge:
//
//   SPECTRAL CAUSTIC: The beauty peak B(C/Ω) focuses at different
//   positions per λ. From Descartes minimum deviation:
//     D(λ) = 2i* − 4·arcsin(sin(i*)/n(λ)) + π
//   Red focuses outward (lower n, less bending), violet inward.
//   Spatial offset: Δpos/R ≈ 2.84·Δn (amplified ×8 for pixel scale).
//
//   PRISMATIC FRESNEL RIM: Critical angle θ_c(λ) = arcsin(1/n(λ))
//   varies by 1.5° across the spectrum, creating a spectral fringe
//   at the droplet rim where red sits outside, violet inside.
//
//   COHERENCE MODULATES VISIBILITY: optical path C(λ) = 2R·n(λ).
//   More coherence (larger drop, more traversals) = more dispersion.
// ═══════════════════════════════════════════════════════════════════════
const N_WATER = 1.33;
const CAUCHY_A = 1.3199, CAUCHY_B = 6878;
function nW(lam) { return CAUCHY_A + CAUCHY_B / (lam * lam); }

// CIE-approximate spectral colour (Bruton 1996)
function specRGB(nm) {
  const t = (nm - 380) / 340;
  let cr, cg, cb;
  if      (t < .17) { const s = t/.17;       cr = .4*(1-s)+.05*s; cg = 0;       cb = .6*(1-s)+s; }
  else if (t < .33) { const s = (t-.17)/.16; cr = .05*(1-s);      cg = s*.9;    cb = 1; }
  else if (t < .45) { const s = (t-.33)/.12; cr = 0;              cg = .9+.1*s; cb = 1-s; }
  else if (t < .58) { const s = (t-.45)/.13; cr = s;              cg = 1;       cb = 0; }
  else if (t < .72) { const s = (t-.58)/.14; cr = 1;              cg = 1-.45*s; cb = 0; }
  else if (t < .88) { const s = (t-.72)/.16; cr = 1;              cg = .55*(1-s); cb = 0; }
  else              { const s = (t-.88)/.12; cr = 1-.2*s;         cg = 0;       cb = 0; }
  let iv = 1;
  if (nm < 420) iv = .3 + .7 * (nm - 380) / 40;
  if (nm > 680) iv = .3 + .7 * (720 - nm) / 40;
  return [cr * iv, cg * iv, cb * iv];
}

// Precomputed spectral bands for per-particle prismatic rendering.
// caustOff = caustic focus offset per Descartes geometry (×8 for visibility)
// rimOff = Fresnel rim offset from critical angle variation (×8)
const N_MID = nW(530);
const BANDS = [680, 570, 530, 470, 400].map(nm => {
  const n = nW(nm), dn = n - N_MID;
  const [cr, cg, cb] = specRGB(nm);
  return {
    nm, n,
    caustOff: -dn * 2.84 * 8,
    rimOff: (asin(1/n) - asin(1/N_MID)) * 0.66 * 8,
    r: cr, g: cg, b: cb
  };
});

// Light direction in screen space (matching shader L = normalize(0.7, 1.2, 0.4))
const LSX = 0.45, LSY = -0.55;

// ─── Per-particle prismatic rendering ───
// Draws spectral caustic spots and rim fringes directly at screen scale.
// drawR: particle screen radius. cohFrac: C/C₀ (0–1), controls visibility.
function drawPrismatic(sx, sy, drawR, alpha, cohFrac) {
  if (drawR < 1.5 || alpha < 0.03) return;
  const vis = min(1, cohFrac * (drawR / 4));
  const la = atan2(LSY, LSX);

  // Spectral caustic crescent — on shadow side, each λ offset by Δn
  const cdist = drawR * 0.38;
  const cbx = sx - LSX * cdist, cby = sy - LSY * cdist;
  for (const bd of BANDS) {
    const off = bd.caustOff * drawR;
    const bx = cbx - LSX * off, by = cby - LSY * off;
    const edge = .5 + .5 * pow(abs(bd.nm - 530) / 180, .6);
    const ba = vis * alpha * .7 * edge;
    if (ba < .02) continue;
    cx.globalAlpha = ba;
    cx.fillStyle = `rgb(${flr(bd.r*255)},${flr(bd.g*255)},${flr(bd.b*255)})`;
    cx.beginPath(); cx.arc(bx, by, max(.8, drawR * .22), 0, TAU); cx.fill();
  }

  // Prismatic rim — thin spectral arcs at Fresnel edge
  const rimB = drawR * .82;
  for (const bd of BANDS) {
    const ringR = rimB + bd.rimOff * drawR;
    if (ringR < 1) continue;
    const ra = vis * alpha * .5;
    if (ra < .02) continue;
    cx.globalAlpha = ra;
    cx.strokeStyle = `rgb(${flr(bd.r*255)},${flr(bd.g*255)},${flr(bd.b*255)})`;
    cx.lineWidth = max(.5, drawR * .08);
    cx.beginPath(); cx.arc(sx, sy, ringR, la - 1.2, la + 1.2); cx.stroke();
  }
  cx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// §4  BOWL PRESETS
//
//   Each bowl has a fundamental frequency F0 and 5 modes (m = 2..6).
//   Per mode:
//     fr — frequency ratio to F0 (shell theory: ≈ m² scaling)
//     sp — beat rate in Hz (Z₂ doublet splitting from asymmetry)
//     τ  — coherence lifetime in seconds (∝ thickness / m²)
//     wA — wave amplitude weight (higher modes radiate less)
//     m  — circumferential mode number (2m nodal lines on rim)
//
//   The doublet split sp makes the "singing" beat audible — this IS
//   the Z₂ bistability expressed as sound.
// ═══════════════════════════════════════════════════════════════════════
const BOWLS = [
  { name:'Small Thadobati', note:'C5', F0:523, modes:[
    {m:2,fr:1,   sp:1.8, τ:10,  wA:.7 },{m:3,fr:2.71,sp:3.8, τ:6,   wA:.35},
    {m:4,fr:4.95,sp:6.2, τ:3.5, wA:.18},{m:5,fr:7.7, sp:9,   τ:2,   wA:.08},
    {m:6,fr:11.1,sp:12,  τ:1.2, wA:.03}]},
  { name:'Thin Manipuri', note:'F4', F0:349, modes:[
    {m:2,fr:1,   sp:1.4, τ:16,  wA:.85},{m:3,fr:2.72,sp:2.8, τ:10,  wA:.42},
    {m:4,fr:5,   sp:4.5, τ:6,   wA:.24},{m:5,fr:7.8, sp:7,   τ:3.5, wA:.12},
    {m:6,fr:11.3,sp:9.5, τ:2,   wA:.05}]},
  { name:'Medium Jambati', note:'G3', F0:196, modes:[
    {m:2,fr:1,    sp:1.1, τ:25,  wA:1  },{m:3,fr:2.714,sp:2.4,τ:16,  wA:.5 },
    {m:4,fr:5.004,sp:3.8, τ:9,   wA:.28},{m:5,fr:7.832,sp:6.2,τ:5.5, wA:.14},
    {m:6,fr:11.34,sp:8.5, τ:3.2, wA:.06}]},
  { name:'Large Jambati', note:'C3', F0:131, modes:[
    {m:2,fr:1,   sp:.8,  τ:35,  wA:1.2},{m:3,fr:2.7, sp:1.8, τ:22,  wA:.6 },
    {m:4,fr:4.98,sp:3,   τ:13,  wA:.35},{m:5,fr:7.75,sp:5,   τ:7.5, wA:.18},
    {m:6,fr:11.2,sp:7.2, τ:4.5, wA:.08}]},
  { name:'Antique Naga', note:'D3', F0:147, modes:[
    {m:2,fr:1,   sp:1.5, τ:30,  wA:1.1},{m:3,fr:2.68,sp:3.2, τ:20,  wA:.55},
    {m:4,fr:4.9, sp:5.5, τ:12,  wA:.32},{m:5,fr:7.65,sp:8,   τ:7,   wA:.16},
    {m:6,fr:11,  sp:11,  τ:4,   wA:.07}]}
];

// Modal state: one CRR cycle per mode
// C = current coherence, C0 = initial at δ, amp = amplitude, bVal = B(C·Ω)
let curBowl = 2, F0 = BOWLS[2].F0, MODES = BOWLS[2].modes;
const MS = Array.from({length:5}, () => ({C:0,C0:1,amp:0,bPh:rnd()*TAU,bVal:0}));
let struck = false, stT = 0, stF = 0;
let rimOn = false, rimAng = 0, rimPrev = 0, rimSpd = 0;
let ac = null, mGain = null, oscP = null, pt = 0, lastT = 0, timeScale = 1;

function setBowl(bi) {
  curBowl = bi; F0 = BOWLS[bi].F0; MODES = BOWLS[bi].modes;
  struck = false; stF = 0;
  for (const st of MS) { st.C = 0; st.C0 = 1; st.amp = 0; }
  if (oscP) {
    const now = ac.currentTime;
    MODES.forEach((md, mi) => {
      const f = F0 * md.fr * timeScale, sp = md.sp * timeScale / 2;
      oscP[mi].oA.frequency.setValueAtTime(f - sp, now);
      oscP[mi].oC.frequency.setValueAtTime(f + sp, now);
      oscP[mi].gA.gain.setValueAtTime(0.0001, now);
      oscP[mi].gC.gain.setValueAtTime(0.0001, now);
    });
  }
  document.querySelectorAll('[id^=b]').forEach(e => {if(e.id.length===2) e.classList.remove('on')});
  document.getElementById('b' + bi).classList.add('on');
}

function setSpeed(sp) {
  timeScale = sp;
  if (oscP) {
    const now = ac.currentTime;
    MODES.forEach((md, mi) => {
      const f = F0 * md.fr * sp, h = md.sp * sp / 2;
      oscP[mi].oA.frequency.setTargetAtTime(f - h, now, 0.05);
      oscP[mi].oC.frequency.setTargetAtTime(f + h, now, 0.05);
    });
  }
  document.querySelectorAll('[id^=s]').forEach(e => {if(e.id.length===2) e.classList.remove('on')});
  document.getElementById('s' + {0.1:0, 0.25:1, 0.5:2, 1:3}[sp]).classList.add('on');
}

// ═══════════════════════════════════════════════════════════════════════
// §5  AUDIO ENGINE
//
//   Each mode is a Z₂ doublet: two sine oscillators at f ± sp/2.
//   Their superposition produces amplitude-modulated "beating" at
//   rate sp Hz — the Z₂ bistability made audible.
//
//   Reverb = regeneration memory: convolution with exp(−t/τ) kernel.
//   This IS R = ∫φ·exp(C/Ω)·Θ dτ realised as an impulse response.
//
//   Strike transient: band-limited noise burst (40ms) at 2×F0.
//   This IS δ(now) — concentrated energy deposited at rupture.
// ═══════════════════════════════════════════════════════════════════════
function mkRev(ctx, dur, decay) {
  const len = ctx.sampleRate * dur, buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (rnd()*2-1) * pow(1-i/len, decay);
  }
  const c = ctx.createConvolver(); c.buffer = buf; return c;
}

function initAudio() {
  if (ac) return;
  ac = new (AudioContext || webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 10; comp.ratio.value = 5;
  comp.connect(ac.destination);
  mGain = ac.createGain(); mGain.gain.value = 0.65;
  const rev = mkRev(ac, 4.5, 2.2);
  const wet = ac.createGain(), dry = ac.createGain();
  wet.gain.value = 0.35; dry.gain.value = 0.75;
  mGain.connect(dry); dry.connect(comp);
  mGain.connect(rev); rev.connect(wet); wet.connect(comp);

  oscP = MODES.map(md => {
    const f = F0 * md.fr * timeScale, h = md.sp * timeScale / 2;
    const gA = ac.createGain(), gC = ac.createGain();
    gA.gain.value = 0; gC.gain.value = 0;
    gA.connect(mGain); gC.connect(mGain);
    const oA = ac.createOscillator(), oC = ac.createOscillator();
    oA.type = 'sine'; oC.type = 'sine';
    oA.frequency.value = f - h; oC.frequency.value = f + h;
    oA.connect(gA); oC.connect(gC); oA.start(); oC.start();
    return {gA, gC, oA, oC};
  });
}

// δ(now): the strike deposits coherence C₀ = τ × force per mode
function doStrike(force) {
  if (!ac) initAudio();
  if (ac.state === 'suspended') ac.resume();
  struck = true; stT = pt; stF = force;
  const now = ac.currentTime;
  // Noise burst — the δ impulse made audible
  const dur = 0.04, nB = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const nd = nB.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (rnd()*2-1)*pow(1-i/nd.length,3)*force*.4;
  const ns = ac.createBufferSource(); ns.buffer = nB; ns.playbackRate.value = timeScale;
  const nf = ac.createBiquadFilter();
  nf.type = 'bandpass'; nf.frequency.value = F0*2*timeScale; nf.Q.value = 1.5;
  const ng = ac.createGain(); ng.gain.value = 0.5;
  ns.connect(nf); nf.connect(ng); ng.connect(mGain);
  ns.start(now); ns.stop(now + dur/timeScale + .01);

  MODES.forEach((md, mi) => {
    const st = MS[mi];
    st.C = md.τ * force; st.C0 = st.C;
    st.amp = min(1, force * (.25 + .75/md.m) * (1 + force*md.m*.06));
    const g = st.amp * .22 / sqrt(md.m);
    const f = F0*md.fr*timeScale, h = md.sp*timeScale/2;
    oscP[mi].oA.frequency.setValueAtTime(f-h, now);
    oscP[mi].oC.frequency.setValueAtTime(f+h, now);
    [oscP[mi].gA, oscP[mi].gC].forEach(gn => {
      gn.gain.cancelScheduledValues(now);
      gn.gain.setValueAtTime(max(0.0001, g), now);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// §6  GLSL SHADER — 3D raymarched bowl with CRR-driven water surface
//
//   The fragment shader renders a bronze singing bowl with water
//   filling to the rim. Five Bessel modes J_m (shell eigenmodes)
//   drive the surface waves, with Z₂ doublet beating per mode.

// ═══════════════════════════════════════════════════════════════════════
// §7  WEBGL + CAMERA
// ═══════════════════════════════════════════════════════════════════════
const glCv = document.getElementById('gl');
const gl = glCv.getContext('webgl', {alpha:false, antialias:false});
const cvEl = document.getElementById('cv');
const cx = cvEl.getContext('2d');
let W, H;

function mkS(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = (() => {
  const p = gl.createProgram();
  gl.attachShader(p, mkS(VS, gl.VERTEX_SHADER));
  gl.attachShader(p, mkS(FS, gl.FRAGMENT_SHADER));
  gl.linkProgram(p); return p;
})();
gl.useProgram(prog);
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = {};
['u_res','u_time','u_mallet','u_malletStr','u_kF'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
const uA=[],uS=[],uW=[],uV=[];
for (let i=0;i<5;i++) {
  uA.push(gl.getUniformLocation(prog,'u_amp['+i+']'));
  uS.push(gl.getUniformLocation(prog,'u_sp['+i+']'));
  uW.push(gl.getUniformLocation(prog,'u_wA['+i+']'));
  uV.push(gl.getUniformLocation(prog,'u_vib['+i+']'));

// Camera matching GLSL: eye=(0,0.85,1.85), target=(0,−0.12,0), fov=1.2
const EYE = [0,.85,1.85], TGT = [0,-.12,0], FOV = 1.2;
const cf = [TGT[0]-EYE[0],TGT[1]-EYE[1],TGT[2]-EYE[2]];
const cfl = sqrt(cf[0]*cf[0]+cf[1]*cf[1]+cf[2]*cf[2]);
const fwd = [cf[0]/cfl, cf[1]/cfl, cf[2]/cfl];
const rR = [fwd[1]*0-fwd[2]*1, fwd[2]*0-fwd[0]*0, fwd[0]*1-fwd[1]*0];
const rL = sqrt(rR[0]*rR[0]+rR[1]*rR[1]+rR[2]*rR[2]);
const right = [rR[0]/rL,rR[1]/rL,rR[2]/rL];
const up = [right[1]*fwd[2]-right[2]*fwd[1], right[2]*fwd[0]-right[0]*fwd[2], right[0]*fwd[1]-right[1]*fwd[0]];

function proj3D(wx,wy,wz) {
  const dx=wx-EYE[0],dy=wy-EYE[1],dz=wz-EYE[2];
  const px=right[0]*dx+right[1]*dy+right[2]*dz;
  const py=up[0]*dx+up[1]*dy+up[2]*dz;
  const pz=fwd[0]*dx+fwd[1]*dy+fwd[2]*dz;
  if (pz<.01) return null;
  return {x:W/2+(FOV*px/pz)*H, y:H/2-(FOV*py/pz)*H, z:pz};
}

function unproj(sx,sy) {
  const uvx=(sx-W/2)/H, uvy=(H/2-sy)/H;
  const rx=right[0]*uvx+up[0]*uvy+fwd[0]*FOV;
  const ry=right[1]*uvx+up[1]*uvy+fwd[1]*FOV;
  const rz=right[2]*uvx+up[2]*uvy+fwd[2]*FOV;
  if (abs(ry)<.0001) return null;
  const t=-EYE[1]/ry; if (t<0) return null;
  const wx=EYE[0]+t*rx, wz=EYE[2]+t*rz;
  return {wx,wz, wr:sqrt(wx*wx+wz*wz), ang:atan2(wz,wx)};
}

// ═══════════════════════════════════════════════════════════════════════
// §8  INTERACTION — strike (centre) and rim rub (edge)
//
//   Hit detection via world-space unprojection to the y=0 plane:
//     wr < 0.85  → strike zone (water surface)
//     wr < 1.25  → rim zone (mallet rub)
//   Rim rubbing injects coherence continuously via angular velocity.
// ═══════════════════════════════════════════════════════════════════════
let pDown = false;

function onDown(e) {
  if (e.target.closest && e.target.closest('.c')) return;
  e.preventDefault();
  const ex = e.clientX ?? e.touches?.[0]?.clientX;
  const ey = e.clientY ?? e.touches?.[0]?.clientY;
  if (ex == null) return;
  pDown = true;
  const hit = unproj(ex, ey);
  if (!hit) return;
  if (hit.wr < .85) {
    doStrike(.3 + .7 * max(0, 1 - hit.wr/.85));
    spawnDrops(stF, ex, ey);
    document.getElementById('ui').classList.add('dim');
    document.getElementById('modes').classList.add('show');
  } else if (hit.wr < 1.25) {
    rimOn = true; rimAng = hit.ang; rimPrev = hit.ang; rimSpd = 0;
    if (!ac) initAudio();
    if (ac.state === 'suspended') ac.resume();
    document.getElementById('ui').classList.add('dim');
    document.getElementById('modes').classList.add('show');
  }
}

function onMove(e) {
  if (!pDown) return;
  e.preventDefault();
  // Track for magnifier
  mouseX = e.clientX ?? e.touches?.[0]?.clientX ?? mouseX;
  mouseY = e.clientY ?? e.touches?.[0]?.clientY ?? mouseY;
  if (rimOn) {
    const hit = unproj(mouseX, mouseY);
    if (!hit) return;
    let da = hit.ang - rimPrev;
    if (da > PI) da -= TAU; if (da < -PI) da += TAU;
    rimSpd = rimSpd * .6 + abs(da) * .4;
    rimPrev = hit.ang; rimAng = hit.ang;
    if (rimSpd > .003 && oscP) {
      const now = ac.currentTime;
      MODES.forEach((md, mi) => {
        const st = MS[mi];
        const target = min(1, rimSpd*4) * (.25 + .75/md.m) * .55;
        st.amp += (target - st.amp) * .04;
        st.C += rimSpd * .3; st.C0 = max(st.C0, st.C);
        const g = max(.0001, st.amp * .18 / sqrt(md.m));
        oscP[mi].gA.gain.setTargetAtTime(g, now, .06);
        oscP[mi].gC.gain.setTargetAtTime(g, now, .06);
      });
    }
  }
}

function onUp() {
  pDown = false;
  if (rimOn) {
    rimOn = false;
    if (oscP) {
      struck = true; stT = pt; stF = 0;
      MODES.forEach((md, mi) => {
        const st = MS[mi];
        if (stF < st.amp) stF = st.amp;
        st.C = st.amp * md.τ; st.C0 = st.C;
      });
    }
  }
}

addEventListener('mousedown', onDown);
addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; onMove(e); });
addEventListener('mouseup', onUp);
addEventListener('touchstart', onDown, {passive:false});
addEventListener('touchmove', e => { onMove(e); }, {passive:false});
addEventListener('touchend', onUp);

function resize() {
  const dpr = min(devicePixelRatio||1, 1.5);
  W = innerWidth; H = innerHeight;
  glCv.width = W*dpr; glCv.height = H*dpr;
  glCv.style.width = W+'px'; glCv.style.height = H+'px';
  gl.viewport(0,0,W*dpr,H*dpr);
  cvEl.width = W; cvEl.height = H;
}
resize();
addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════════════
// §9  MAGNIFYING LENS
//
//   Composites both GL and 2D canvases into a 5× circular lens,
//   enabling inspection of CRR prismatic dispersion at pixel level.
// ═══════════════════════════════════════════════════════════════════════
let zoomOn = false, mouseX = 0, mouseY = 0;
function toggleZoom() {
  zoomOn = !zoomOn;
  document.getElementById('zB').classList.toggle('on', zoomOn);
  document.body.style.cursor = zoomOn ? 'crosshair' : 'pointer';
}

function drawMagnifier() {
  if (!zoomOn) return;
  const Z = 5, LR = 90, srcR = LR / Z;
  const lx = max(srcR+2, min(W-srcR-2, mouseX));
  const ly = max(srcR+2, min(H-srcR-2, mouseY));
  const offX = lx > W - LR*2.5 ? -LR-20 : LR+20;
  const dx = max(LR+4, min(W-LR-4, lx+offX));
  const dy = max(LR+4, min(H-LR-4, ly-LR-10));
  const dpr = min(devicePixelRatio||1, 1.5);

  cx.save();
  cx.beginPath(); cx.arc(dx, dy, LR, 0, TAU); cx.clip();
  cx.drawImage(glCv, (lx-srcR)*dpr,(ly-srcR)*dpr,srcR*2*dpr,srcR*2*dpr, dx-LR,dy-LR,LR*2,LR*2);
  cx.drawImage(cvEl, lx-srcR,ly-srcR,srcR*2,srcR*2, dx-LR,dy-LR,LR*2,LR*2);
  cx.restore();

  cx.strokeStyle = 'rgba(200,180,140,0.25)'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(dx, dy, LR, 0, TAU); cx.stroke();
  cx.strokeStyle = 'rgba(200,180,140,0.12)'; cx.lineWidth = .5;
  cx.beginPath(); cx.moveTo(lx-8,ly); cx.lineTo(lx+8,ly);
  cx.moveTo(lx,ly-8); cx.lineTo(lx,ly+8); cx.stroke();
  cx.font = '300 9px "Cormorant Garamond",serif';
  cx.fillStyle = 'rgba(200,180,140,0.3)'; cx.textAlign = 'center';
  cx.fillText(Z+'× prismatic detail', dx, dy + LR + 14);
}

// ═══════════════════════════════════════════════════════════════════════
// §10  DROPLET SPRITES — pre-rendered translucent water droplet
//
//   A spherical water droplet is a Z₂ optical system (§3):
//     Ω_optical = R₀ = ((n−1)/(n+1))² ≈ 0.020  (Fresnel reflectance)
//
//   Five layers, each a CRR phenomenon:
//     1. Fresnel rim — R(θ) = R₀ + (1−R₀)(1−cosθ)⁵ → C·Ω→1 at edge
//     2. Specular highlight — δ(now), single coherent reflection
//     3. Secondary specular — second-order internal bounce
//     4. Caustic focus — beauty peak B(C/Ω) on shadow side
//     5. Internal glow — R integral, scattered transmitted light
// ═══════════════════════════════════════════════════════════════════════
const DSZ = 64;
const DROP = document.createElement('canvas'); DROP.width = DSZ; DROP.height = DSZ;
const GLOW = document.createElement('canvas'); GLOW.width = DSZ; GLOW.height = DSZ;

(function() {
  const lx = 0.45, ly = -0.55, R = DSZ/2, c = R;
  const dc = DROP.getContext('2d');

  // Layer 1: Fresnel rim + translucent body
  const bg = dc.createRadialGradient(c+lx*R*.12,c+ly*R*.12,0, c,c,R);
  bg.addColorStop(0,   'rgba(50,42,25,0.06)');
  bg.addColorStop(.30, 'rgba(90,72,40,0.14)');
  bg.addColorStop(.55, 'rgba(140,112,60,0.22)');
  bg.addColorStop(.72, 'rgba(185,152,85,0.30)');
  bg.addColorStop(.85, 'rgba(220,190,115,0.34)');
  bg.addColorStop(.93, 'rgba(240,215,145,0.22)');
  bg.addColorStop(1,   'rgba(255,240,200,0.0)');
  dc.fillStyle = bg; dc.beginPath(); dc.arc(c,c,R,0,TAU); dc.fill();

  // Layer 2: Specular highlight (δ — coherent single reflection)
  const sx=c+lx*R*.28, sy=c+ly*R*.28, sr=R*.26;
  const sg = dc.createRadialGradient(sx,sy,0,sx,sy,sr);
  sg.addColorStop(0,   'rgba(255,252,245,0.92)');
  sg.addColorStop(.15, 'rgba(255,248,235,0.70)');
  sg.addColorStop(.40, 'rgba(255,242,215,0.30)');
  sg.addColorStop(.70, 'rgba(255,235,200,0.08)');
  sg.addColorStop(1,   'rgba(255,230,190,0.0)');
  dc.fillStyle = sg; dc.beginPath(); dc.arc(sx,sy,sr,0,TAU); dc.fill();

  // Layer 3: Secondary specular
  const s2x=c+lx*R*.15, s2y=c+ly*R*.15, s2r=R*.38;
  const sg2 = dc.createRadialGradient(s2x,s2y,0,s2x,s2y,s2r);
  sg2.addColorStop(0,  'rgba(255,245,225,0.15)');
  sg2.addColorStop(.5, 'rgba(255,238,205,0.06)');
  sg2.addColorStop(1,  'rgba(255,230,190,0.0)');
  dc.fillStyle = sg2; dc.beginPath(); dc.arc(s2x,s2y,s2r,0,TAU); dc.fill();

  // Layer 4: Caustic focus (beauty peak B(C/Ω) on shadow side)
  const cx_=c-lx*R*.38, cy_=c-ly*R*.38, cr_=R*.24;
  const cg = dc.createRadialGradient(cx_,cy_,0,cx_,cy_,cr_);
  cg.addColorStop(0,   'rgba(255,232,168,0.42)');
  cg.addColorStop(.30, 'rgba(255,225,150,0.20)');
  cg.addColorStop(.65, 'rgba(255,218,135,0.06)');
  cg.addColorStop(1,   'rgba(255,210,120,0.0)');
  dc.fillStyle = cg; dc.beginPath(); dc.arc(cx_,cy_,cr_,0,TAU); dc.fill();

  // Layer 5: Internal glow (R integral — transmitted light)
  const gx=c-lx*R*.15, gy=c-ly*R*.2, gr=R*.5;
  const ig = dc.createRadialGradient(gx,gy,0,gx,gy,gr);
  ig.addColorStop(0,   'rgba(200,170,100,0.10)');
  ig.addColorStop(.60, 'rgba(180,150,85,0.04)');
  ig.addColorStop(1,   'rgba(160,130,70,0.0)');
  dc.fillStyle = ig; dc.beginPath(); dc.arc(gx,gy,gr,0,TAU); dc.fill();

  // Glow sprite (beauty-peak halo for large drops)
  const gc = GLOW.getContext('2d');
  const gg = gc.createRadialGradient(c,c,0,c,c,R);
  gg.addColorStop(0,   'rgba(255,245,210,0.18)');
  gg.addColorStop(.25, 'rgba(255,240,195,0.10)');
  gg.addColorStop(.55, 'rgba(255,232,175,0.04)');
  gg.addColorStop(1,   'rgba(255,225,160,0.0)');
  gc.fillStyle = gg; gc.beginPath(); gc.arc(c,c,R,0,TAU); gc.fill();
})();

// ═══════════════════════════════════════════════════════════════════════
// §11  PARTICLE SYSTEM
//
//   Five particle types, three CRR droplet regimes:
//
//   DUST — ambient floating motes (atmosphere)
//
//   STRIKE DROPS — ejected by δ(now), ballistic arcs
//
//   FARADAY DROPLETS — three regimes with different effective Ω:
//
//     FOUNTAIN (small Ω, rigid):
//       Single explosive δ → ballistic arc → splash.
//       Highest C at rupture → exp(C/Ω) large → tall arc.
//       The jet (ligament before separation) is the nascent delta δ_ε.
//
//     BOUNCING (medium Ω):
//       Repeated C→δ→R at T_bounce = 4/f₀ (Z₂ subharmonic cascade).
//       Each bounce depletes coherence; √(C/C₀) controls arc height.
//
//     WALKER (large Ω, flexible):
//       Bounces at f₀/4 and drifts laterally on wave slope.
//       Coupled to Faraday wave-field memory = literally
//       R = ∫φ·exp(C/Ω)·Θ dτ with Θ selecting accessible waves.
//
//   All sizes scale as d ∝ f₀^(−2/3), heights as h ∝ 1/f₀² (§2).
// ═══════════════════════════════════════════════════════════════════════
const PARTS = [];

// Ambient dust
for (let i=0; i<20; i++)
  PARTS.push({x:rnd()*2e3,y:rnd()*2e3,vx:(rnd()-.5)*.1,vy:-.02-rnd()*.04,
    life:2,sz:.3+rnd()*.8,br:.05+rnd()*.08,type:'dust',ph:rnd()*TAU});

function spawnDrops(force, sx, sy) {
  const ds = dropScale(), hs = heightScale();
  for (let i = 0; i < flr(3+force*10*ds); i++) {
    const a = rnd()*TAU, sp = force*(.8+rnd()*1.5);
    PARTS.push({x:sx,y:sy,vx:cos(a)*sp*.4*ds,vy:-sp*.6*sqrt(hs)-rnd()*1.5*sqrt(hs),
      life:1+.3*(hs-1),sz:(.6+rnd()*2)*ds,br:.3+rnd()*.7,type:'drop'});
  }
}

// CPU Faraday height (for spawn sampling, separate from modal Bessel)
function cpuFaradayH(nx,nz,t) {
  const rr = sqrt(nx*nx+nz*nz);
  if (rr>.97||rr<.05) return 0;
  let totA=0; for (const st of MS) totA+=st.amp;
  if (totA<.04) return 0;
  const env = max(0,min(1,(rr-.05)/.25))*max(0,min(1,(.97-rr)/.22))
            *(.6+.6*max(0,min(1,(rr-.3)/.3))*max(0,min(1,(.9-rr)/.2)));
  const k = faradayK();
  const h1=sin(k*nx)*sin(k*nz);
  const r2x=(nx+nz)*.707,r2z=(nx-nz)*.707;
  const h2=sin(k*r2x*1.08)*sin(k*r2z*1.08);
  const h3=sin(k*(nx*.866+nz*.5)*.95)*sin(k*(-nx*.5+nz*.866)*.95);
  return (h1+h2*.7+h3*.4)*max(0,totA-.04)*.22*env*(.6+.4*sin(t*PI*1.8));
}

let fGP = 0;
function spawnFaraday(t) {
  if (PARTS.length > 500) return;
  let totA=0; for (const st of MS) totA+=st.amp;
  if (totA < .04) return;
  const ds=dropScale(), hs=heightScale(), Tb=bouncePer();
  const thr = .012 + .015*(1-min(1,totA*3));
  fGP += .31;
  const N=12, cc=cos(fGP), ss=sin(fGP);
  const bPx = min(W,H)*.28;

  for (let gi=0;gi<N;gi++) for (let gj=0;gj<N;gj++) {
    const gx=(gi/(N-1)-.5)*1.9, gz=(gj/(N-1)-.5)*1.9;
    const nx=gx*cc-gz*ss, nz=gx*ss+gz*cc;
    if (sqrt(nx*nx+nz*nz)>.96) continue;
    const fh = cpuFaradayH(nx,nz,t);
    if (abs(fh)<thr) continue;
    const excess = abs(fh)-thr;
    if (rnd() > min(.55, excess*25+.18)) continue;
    const pp = proj3D(nx*.99, 0, nz*.99);
    if (!pp || pp.z<.1) continue;

    const cRatio = min(PI, excess*12);
    const bW = B(cRatio*OmZ2);
    const regime = rnd();

    if (excess>.025 && regime < min(.35, excess*8)) {
      // FOUNTAIN — explosive δ, single ballistic arc
      const bN = bW / B(PI-1);
      const baseV = 2.5+bN*3+excess*35, ejV = baseV*sqrt(hs);
      const jetH = max(5, ejV*6)*.65;
      PARTS.push({type:'jet',x:pp.x,y:pp.y,baseY:pp.y,
        life:.035+excess*.06,maxLife:.035+excess*.06,
        height:jetH,sz:max(.3,.5*ds),br:.6+excess*3});
      const ea = -PI/2+(rnd()-.5)*.6;
      PARTS.push({type:'fountain',x:pp.x,y:pp.y,baseY:pp.y,
        vx:cos(ea)*baseV*.15*ds,vy:-ejV*(.6+rnd()*.15),
        sz:(.8+rnd()*1.5)*ds,startSz:(.8+rnd()*1.5)*ds,br:.5+rnd()*.4,
        life:1.2+.5*sqrt(hs),maxLife:1.2+.5*sqrt(hs),
        bounceC:excess*4,bounceC0:excess*4});
    } else if (totA>.25 && excess<.015 && regime>.92) {
      // WALKER — wave-memory coupled lateral drift
      const wd = atan2(nz,nx) + (rnd()>.5?1:-1)*PI/2;
      PARTS.push({type:'walker',x:pp.x,y:pp.y,baseY:pp.y,
        walkVx:cos(wd)*.3*totA*ds,walkVy:sin(wd)*.15*totA*ds,
        sz:(.6+rnd()*.8)*ds,startSz:(.6+rnd()*.8)*ds,br:.3+rnd()*.3,
        bouncePeriod:Tb*(.9+rnd()*.2),bouncePhase:rnd()*.1,bounceNum:0,
        maxBounces:6+flr(rnd()*10),bounceC:totA*2,bounceC0:totA*2,
        ejHeight:bPx*.015*hs});
    } else {
      // BOUNCING — standard Faraday subharmonic
      const bN = bW / B(PI-1);
      const ejH = bPx*(.02+bN*.12+excess*totA*.15)*hs;
      PARTS.push({x:pp.x,y:pp.y,baseY:pp.y,vx:(rnd()-.5)*.3*ds,
        sz:(.5+rnd())*ds,startSz:(.5+rnd())*ds,
        br:.25+rnd()*.35,type:'faraday',
        bounceC:excess*3,bounceC0:excess*3,
        bouncePeriod:Tb*(.85+rnd()*.3),bouncePhase:rnd()*.15,bounceNum:0,
        maxBounces:1+flr(rnd()*3),ejHeight:ejH});
    }
  }
}

// ─── Particle update ───
function updateParts(dt) {
  for (let i=PARTS.length-1; i>=0; i--) {
    const p = PARTS[i];
    if (p.type==='drop') {
      p.vy+=15*dt; p.x+=p.vx; p.y+=p.vy; p.life-=dt*.8;
      if (p.life<=0) PARTS.splice(i,1);
    } else if (p.type==='fountain') {
      p.vy+=15*dt; p.vy*=1-.5*dt; p.vx*=1-.3*dt;
      p.x+=p.vx; p.y+=p.vy; p.life-=dt*.6;
      p.bounceC=max(0,p.bounceC-dt*.8);
      const cf=sqrt(max(.1,p.bounceC/p.bounceC0));
      p.sz=p.startSz*(.6+.4*cf);
      p.br=.3+.6*min(1,max(0,p.baseY-p.y)/80);
      if (p.life<=0||p.y>p.baseY+5) PARTS.splice(i,1);
    } else if (p.type==='walker') {
      p.bouncePhase+=dt/p.bouncePeriod;
      p.x+=p.walkVx*dt*12; p.y+=p.walkVy*dt*6;
      if (p.bouncePhase>=1) {
        p.bouncePhase-=1; p.bounceNum++;
        p.bounceC-=p.bounceC0/p.maxBounces;
        p.walkVx+=(rnd()-.5)*.05; p.walkVy+=(rnd()-.5)*.025;
        if (p.bounceNum>=p.maxBounces||p.bounceC<=0) {PARTS.splice(i,1);continue;}
      }
      const arc=4*p.bouncePhase*(1-p.bouncePhase);
      const hF=sqrt(max(0,p.bounceC/p.bounceC0));
      p.y=p.baseY-p.ejHeight*arc*hF;
      p.sz=p.startSz*(.8+.2*(1-arc*.3));
      p.br=.2+arc*.4*hF;
      p.baseY+=p.walkVy*dt*6;
    } else if (p.type==='jet') {
      p.life-=dt; if (p.life<=0) PARTS.splice(i,1);
    } else if (p.type==='faraday') {
      p.bouncePhase+=dt/p.bouncePeriod; p.x+=p.vx*dt*.3;
      if (p.bouncePhase>=1) {
        p.bouncePhase-=1; p.bounceNum++;
        p.bounceC-=p.bounceC0/p.maxBounces;
        if (p.bounceNum>=p.maxBounces||p.bounceC<=0) {PARTS.splice(i,1);continue;}
      }
      const arc=4*p.bouncePhase*(1-p.bouncePhase);
      const hF=sqrt(max(0,p.bounceC/p.bounceC0));
      p.y=p.baseY-p.ejHeight*arc*hF;
      p.sz=p.startSz*(.5+.5*(1-arc*.4));
      p.br=.2+arc*.6*hF;
    } else {
      p.ph+=dt*.3;
      p.x+=p.vx+sin(p.ph)*.02; p.y+=p.vy+cos(p.ph*PHI)*.01;
      if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
      if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// §12  PARTICLE DRAW — sprites + CRR prismatic dispersion
//
//   Every water drop renders via DROP sprite (§10) for the base
//   translucent body, then drawPrismatic() (§3) for the spectral
//   caustic and Fresnel rim effects. Additive blending ('lighter')
//   makes high-coherence drops luminous, low-coherence drops ghostly.
//
//   globalAlpha ∝ √(C/C₀) — coherence directly modulates transparency.
//   Prismatic visibility ∝ cohFrac × dropSize — physically: longer
//   optical path through a larger drop produces more accumulated
//   dispersion between wavelengths.
// ═══════════════════════════════════════════════════════════════════════
function drawOverlay() {
  cx.clearRect(0,0,W,H);
  cx.save();
  cx.globalCompositeOperation = 'lighter';

  for (const p of PARTS) {
    if (p.type==='dust') {
      cx.fillStyle=`rgba(200,180,140,${p.br*.3})`;
      cx.beginPath();cx.arc(p.x,p.y,p.sz,0,TAU);cx.fill();

    } else if (p.type==='jet') {
      const prog=1-p.life/p.maxLife;
      const jH=p.height*(.3+.7*prog), alpha=min(.8,p.br*(1-prog*.5));
      const tw=p.sz*.4, bw=p.sz*1.2;
      cx.fillStyle=`rgba(255,250,235,${alpha*.6})`;
      cx.beginPath();
      cx.moveTo(p.x-bw,p.baseY);cx.lineTo(p.x+bw,p.baseY);
      cx.lineTo(p.x+tw,p.baseY-jH);cx.lineTo(p.x-tw,p.baseY-jH);cx.fill();
      const tipR=max(.4,p.sz*(.5+.5*prog));
      cx.globalAlpha=min(1,alpha*1.3);
      cx.drawImage(DROP,p.x-tipR*1.3,p.baseY-jH-tipR*1.3,tipR*2.6,tipR*2.6);
      drawPrismatic(p.x,p.baseY-jH,tipR*1.3,min(1,alpha*1.3),1-prog);
      cx.globalAlpha=1;

    } else if (p.type==='fountain') {
      const spd=sqrt(p.vx*p.vx+p.vy*p.vy);
      const lf=p.life/p.maxLife, cf=max(.1,p.bounceC/p.bounceC0);
      const alpha=min(1,lf*(.5+.5*sqrt(cf))*1.4);
      const stretch=min(1.6,1+spd*.06*cf), dR=max(.5,p.sz)*1.3;
      cx.save(); cx.translate(p.x,p.y);
      if(spd>.5) cx.rotate(atan2(p.vy,p.vx));
      cx.scale(stretch,1/stretch);
      if (cf>.3&&p.sz>.8) {
        const gR=dR*2.2; cx.globalAlpha=min(.6,alpha*.35*cf);
        cx.drawImage(GLOW,-gR,-gR,gR*2,gR*2);
      }
      cx.globalAlpha=alpha;
      cx.drawImage(DROP,-dR,-dR,dR*2,dR*2);
      drawPrismatic(0,0,dR,alpha,cf);
      cx.restore();

    } else if (p.type==='walker') {
      const arc=4*p.bouncePhase*(1-p.bouncePhase);
      const hF=sqrt(max(0,p.bounceC/p.bounceC0));
      const alpha=min(.8,p.br*(.3+arc*.5*hF)), dR=max(.5,p.sz)*1.3;
      // Trail — wave memory ghost
      const trA=alpha*.15;
      if (trA>.01) {
        const trR=dR*.6; cx.globalAlpha=trA;
        cx.drawImage(DROP,p.x-p.walkVx*10-trR,p.y-p.walkVy*5-trR,trR*2,trR*2);
      }
      cx.globalAlpha=alpha;
      cx.drawImage(DROP,p.x-dR,p.y-dR,dR*2,dR*2);
      drawPrismatic(p.x,p.y,dR,alpha,hF);

      if(arc<.3&&hF>.4) {
        const ringR=p.sz*3;
        cx.strokeStyle=`rgba(255,245,210,${alpha*.06})`;cx.lineWidth=.5;cx.globalAlpha=1;
        cx.beginPath();cx.arc(p.x,p.y,ringR,0,TAU);cx.stroke();
      }
      cx.globalAlpha=1;

    } else if (p.type==='faraday') {
      const arc=4*p.bouncePhase*(1-p.bouncePhase);
      const hF=sqrt(max(0,p.bounceC/p.bounceC0));
      const alpha=min(.9,p.br*(.2+arc*.8*hF));
      const aspectV=1+arc*hF*.45, aspectH=1/sqrt(aspectV);
      const dR=max(.5,p.sz)*1.3;
      cx.save(); cx.translate(p.x,p.y); cx.scale(aspectH,aspectV);
      if(arc>.5&&p.sz>.7&&hF>.3) {
        const gR=dR*2.2; cx.globalAlpha=min(.4,alpha*.2);
        cx.drawImage(GLOW,-gR,-gR,gR*2,gR*2);
      }
      cx.globalAlpha=alpha;
      cx.drawImage(DROP,-dR,-dR,dR*2,dR*2);
      drawPrismatic(0,0,dR,alpha,hF*arc);
      cx.restore();

    } else {
      // Strike drops
      const alpha=p.life*p.br*.7, dR=max(.4,p.sz*p.life)*1.3;
      cx.globalAlpha=min(1,alpha);
      cx.drawImage(DROP,p.x-dR,p.y-dR,dR*2,dR*2);
      drawPrismatic(p.x,p.y,dR,min(1,alpha),p.life);
      cx.globalAlpha=1;
    }
  }
  cx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// §13  RENDER LOOP — one CRR state drives audio + water + drops
//
//   Each frame:
//   1. Coherence depletion: dC/dt = −1 (linear drain)
//      Amplitude envelope = stF × (0.25 + 0.75/m) × √(C/C₀)
//      The √(C/C₀) gives the characteristic singing bowl decay.
//
//   2. Beauty function B(C·Ω_Z₂) computed per mode
//
//   3. Audio gains smoothed via setTargetAtTime (16ms τ)
//
//   4. GPU uniforms set → shader renders bowl + water + caustics
//
//   5. CPU particles spawned, updated, drawn with prismatic arcs
//
//   6. Magnifier composited on top (if active)
// ═══════════════════════════════════════════════════════════════════════
const modesEl = document.getElementById('modes');

function render(ts) {
  requestAnimationFrame(render);
  const rawDt = min(.05, (ts-lastT)/1e3); lastT = ts;
  const dt = rawDt * timeScale; pt += dt;
  let mTxt = '';
  const now = ac ? ac.currentTime : 0;

  // CRR coherence cycle per mode
  MODES.forEach((md,mi) => {
    const st = MS[mi];
    if (rimOn) { st.C += rimSpd*.3*dt; st.C0 = max(st.C0, st.C); }
    else if (struck) {
      st.C -= dt;
      if (st.C<=0) { st.C=0; st.amp=0; }
      else st.amp = stF*(.25+.75/md.m)*sqrt(st.C/st.C0);
    }
    st.bVal = B(min(PI, st.C * OmZ2));
    if (oscP) {
      if (st.amp<.0002) {
        oscP[mi].gA.gain.setTargetAtTime(.0001,now,.01);
        oscP[mi].gC.gain.setTargetAtTime(.0001,now,.01);
      } else {
        const g = st.amp*.22/sqrt(md.m);
        oscP[mi].gA.gain.setTargetAtTime(g,now,.016);
        oscP[mi].gC.gain.setTargetAtTime(g,now,.016);
      }
    }
    if (st.amp>.001)
      mTxt+=`m=${md.m} ${(F0*md.fr*timeScale).toFixed(0)}Hz C=${st.C.toFixed(1)} ${'▮'.repeat(min(15,flr(st.amp*15)))}\n`;
  });

  mTxt += `${BOWLS[curBowl].note} ${BOWLS[curBowl].name}`;
  const counts = ['faraday','fountain','walker','jet'].map(t => {
    const n=PARTS.filter(p=>p.type===t).length;
    return n?`${n} ${t==='faraday'?'bounce':t}`:'';
  }).filter(Boolean);
  if (counts.length) mTxt += ' · ' + counts.join(' ');
  if (timeScale<1) mTxt += ` · ${timeScale}×`;
  modesEl.textContent = mTxt;

  updateParts(dt);
  spawnFaraday(pt);

  const dpr = min(devicePixelRatio||1, 1.5);
  gl.uniform2f(U.u_res, W*dpr, H*dpr);
  gl.uniform1f(U.u_time, pt);
  gl.uniform1f(U.u_mallet, rimAng);
  gl.uniform1f(U.u_malletStr, rimOn ? min(.8,rimSpd*5) : 0);
  gl.uniform1f(U.u_kF, faradayK());
  for (let i=0;i<5;i++) {
    gl.uniform1f(uA[i], MS[i].amp);
    gl.uniform1f(uS[i], MODES[i].sp);
    gl.uniform1f(uW[i], MODES[i].wA);
    gl.uniform1f(uV[i], MS[i].amp * sin(pt*MODES[i].sp*TAU));
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawOverlay();
  drawMagnifier();
}

requestAnimationFrame(render);
</script>
</body>
