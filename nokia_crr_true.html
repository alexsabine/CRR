const Ω_Z2=1/Math.PI, Ω_SO2=1/(2*Math.PI);

class CRRProcess{
  constructor(name,omega,sym,p={}){
    this.name=name;this.omega=omega;this.sym=sym;
    this.C=p.initC||0;this.phase=0;this.δn=0;this.state='C';
    this.hist=[];this.maxH=p.maxH||100;
    this.Lrate=p.Lrate||1;this.Lbase=p.Lrate||1;
    this.thresh=p.thresh||1;this.φrate=p.φrate||0.8;
    this.out=0;this.cv=omega/2;this.coupled=[];
    this.enabled=p.enabled!==undefined?p.enabled:true;
    this.lastδt=0;this.t=0;this.mem=[];
    this.justRuptured=false;this.justRegenerated=false;
  }
  couple(o,s=0.1){this.coupled.push({p:o,s});}
  step(dt,ext=0){
    if(!this.enabled)return;
    this.t+=dt;this.justRuptured=false;this.justRegenerated=false;
    let coup=0;for(const c of this.coupled)coup+=c.p.out*c.s;
    if(this.state==='C'){
      this.C+=(this.Lrate+ext+coup)*dt;this.phase+=dt;
      if(this.C>=this.thresh){
        this.state='δ';this.δn++;this.lastδt=this.t;this.justRuptured=true;
        this.mem.push({c:this.C,w:Math.exp(Math.min(this.C/this.omega,20))});
        if(this.mem.length>30)this.mem.shift();
      }
    }else if(this.state==='δ'){
      this.out=this.C;this.state='R';
    }else if(this.state==='R'){
      const e=Math.exp(Math.min(this.C/this.omega,15));
      this.C*=Math.exp(-this.φrate*dt*(1+1/e));this.out*=0.92;
      if(this.C<0.03){this.C=0;this.phase=0;this.state='C';this.out=0;this.justRegenerated=true;}
    }
    this.hist.push({c:this.C,s:this.state,o:this.out});
    if(this.hist.length>this.maxH)this.hist.shift();
  }
  forceδ(){
    if(!this.enabled)return;
    this.C=this.thresh;this.state='δ';this.δn++;this.lastδt=this.t;this.justRuptured=true;
    this.mem.push({c:this.C,w:Math.exp(Math.min(this.C/this.omega,20))});
    if(this.mem.length>30)this.mem.shift();
    this.step(0);
  }
  expCΩ(){return Math.exp(Math.min(this.C/this.omega,15));}
  cyclePos(){return Math.min(1,this.C/this.thresh);}
  reset(){this.C=0;this.phase=0;this.state='C';this.out=0;}
}

// ═══ 9 HARDWARE PROCESSES ═══

let aCtx=null;
function initA(){if(!aCtx)try{aCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};if(aCtx?.state==='suspended')aCtx.resume();}
function tone(f,d,v=0.12){if(!aCtx)return;try{const o=aCtx.createOscillator(),g=aCtx.createGain();
o.type='square';o.frequency.value=f;const t=aCtx.currentTime;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*0.05);
g.gain.setValueAtTime(v,t+d*0.75);g.gain.exponentialRampToValueAtTime(0.001,t+d);
o.connect(g);g.connect(aCtx.destination);o.start(t);o.stop(t+d);}catch(e){}}
function dtmf(key){const m={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],
'6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};
const f=m[key];if(f){tone(f[0],0.1,0.08);tone(f[1],0.1,0.08);}}
const TUNE=[[659.25,125],[587.33,125],[369.99,250],[415.30,250],
[554.37,125],[493.88,125],[293.66,250],[329.63,250],
[493.88,125],[440.00,125],[277.18,250],[329.63,250],[440.00,500]];
let tuneOn=false;
function playTune(){initA();if(!aCtx||tuneOn)return;tuneOn=true;
let t=aCtx.currentTime+0.05;for(const[f,d]of TUNE){const s=d/1000;try{
const o=aCtx.createOscillator(),g=aCtx.createGain();o.type='square';o.frequency.value=f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+s*0.05);
g.gain.setValueAtTime(0.12,t+s*0.75);g.gain.exponentialRampToValueAtTime(0.001,t+s*0.98);
o.connect(g);g.connect(aCtx.destination);o.start(t);o.stop(t+s);P.audio.forceδ();}catch(e){}t+=s;}
const end=t;const ck=()=>{if(aCtx.currentTime>=end)tuneOn=false;else requestAnimationFrame(ck);};requestAnimationFrame(ck);}

function mkSnake(){return{body:[{x:42,y:26},{x:41,y:26},{x:40,y:26}],dir:{x:1,y:0},
nd:{x:1,y:0},food:{x:60,y:20},score:0,alive:true};}
function snakeStep(g){if(!g.alive)return g;g.dir={...g.nd};
const h={x:g.body[0].x+g.dir.x,y:g.body[0].y+g.dir.y};
if(h.x<1)h.x=SW-2;if(h.x>=SW-1)h.x=1;if(h.y<10)h.y=SH-2;if(h.y>=SH-1)h.y=10;

const nb=[h,...g.body];let ns=g.score,nf=g.food;

y:11+Math.floor(((seed*49297+9301)%233280)/233280*(SH-13))};
tone(880,0.04);P.audio.forceδ();}else nb.pop();
return{...g,body:nb,score:ns,food:nf};}

function commitT9(){if(t9K!==null){const c=T9[t9K];if(c)compTxt+=c[t9I%c.length];}t9K=null;t9I=0;t9Wait=false;}

// ╔═══════════════════════════════════════════════════════════════════════╗
// ║  KEY HANDLER — queues input, injects energy into CPU, that's ALL     ║
// ║  The key PHYSICALLY registers (keypad δ, DTMF tone) but nothing      ║
// ║  computes until the CPU's next rupture processes the queue.           ║
// ╚═══════════════════════════════════════════════════════════════════════╝

function handleKey(k){
  initA();

  // 1. PHYSICAL: Keypad hardware registers the press
  P.key.forceδ();

  // 2. PHYSICAL: DTMF tone — audio codec responds to keypad (hardware coupling)
  if(profile!==1&&((k>='0'&&k<='9')||k==='*'||k==='#'))dtmf(k);

  // 3. QUEUE: key goes into input register, awaiting CPU processing
  inputQ.push(k);
  queueDepth = inputQ.length;

  // 4. ENERGY: keypress injects coherence into CPU, accelerating next rupture
  //    This is the interrupt line going HIGH — it doesn't execute, it demands attention
  P.cpu.C += 0.8; // significant energy injection → CPU will rupture very soon
}

// ╔═══════════════════════════════════════════════════════════════════════╗
// ║  CPU EXECUTION — processes input queue at δ(now)                     ║
// ║  This is the ONLY place phone logic executes.                        ║
// ║  Calculator, screen transitions, snake, T9 — ALL computed here.      ║
// ║  Without CPU ruptures, the phone is dead silicon.                    ║
// ╚═══════════════════════════════════════════════════════════════════════╝

function cpuExecute(){
  // Process ALL queued inputs — this is the CPU's instruction cycle
  while(inputQ.length > 0){
    const k = inputQ.shift();
    processKey(k);
  }
  queueDepth = 0;

  // ─── BACKGROUND TASKS (executed every CPU cycle) ───

  // Snake step: CPU rupture IS the game clock
  if(scr==='snake'&&snake?.alive){
    snake=snakeStep(snake);
    // Snake speed modulates CPU Lrate — score = coherence, faster = lower Ω effective
    P.cpu.Lrate = P.cpu.Lbase * (1 + snake.score * 0.12);
  }

  // T9 timeout: if waiting, check if enough CPU cycles have passed since last key
  // The keypad's regeneration cycle acts as the timer
  if(t9Wait && P.key.state==='C' && P.key.C < 0.2){
    commitT9();P.key.Lrate=0.1;
  }

  // Sent screen auto-return: count power cycles
  if(scr==='sent'){sentTimer++;if(sentTimer>20)scr='home';}

  // Call timer: count via oscillator ruptures proxied through CPU cycles
  if(calling){callTicks++;}

  updateLabels();
}

function processKey(k){
  // ═══ ALL phone logic happens here, at CPU δ(now) ═══

  if(scr==='home'){
    if(k==='left-soft'||k==='center'||k==='up'||k==='down'){scr='menu';mIdx=0;}
    if(k==='right-soft'){scr='phonebook';cIdx=0;}
    if(k==='call'){scr='dialer';dialBuf='';}
    if(k>='0'&&k<='9'){scr='dialer';dialBuf=k;}
  }
  else if(scr==='dialer'){
    if(k>='0'&&k<='9')dialBuf+=k;
    if(k==='*')dialBuf+='+';if(k==='#')dialBuf+='#';
    if(k==='right-soft'||k==='end'){if(dialBuf.length>0)dialBuf=dialBuf.slice(0,-1);else scr='home';}
    if((k==='left-soft'||k==='call'||k==='center')&&dialBuf.length>0){
      callNum=dialBuf;calling=true;callTicks=0;scr='calling';}
  }
  else if(scr==='menu'){
    if(k==='up')mIdx=Math.max(0,mIdx-1);
    if(k==='down')mIdx=Math.min(MENU.length-1,mIdx+1);
    if(k==='left-soft'||k==='center'){
      const s=MENU[mIdx];
      if(s==='Messages'){scr='messages_menu';sIdx=0;}
      if(s==='Phone Book'){scr='phonebook';cIdx=0;}
      if(s==='Call Register')scr='callregister';
      if(s==='Profiles'){scr='profiles';pIdx=profile;}
      if(s==='Settings')scr='settings';
      if(s==='Games'){scr='games_menu';sIdx=0;}
      if(s==='Calculator'){scr='calculator';calc={d:'0',prev:null,op:null,fresh:true};}
      if(s==='Clock')scr='clock';
      if(s==='CRR Monitor'){scr='crr_monitor';procView='osc';}
    }
    if(k==='right-soft'||k==='end')scr='home';
  }
  else if(scr==='messages_menu'){
    if(k==='up')sIdx=Math.max(0,sIdx-1);if(k==='down')sIdx=Math.min(MSG_M.length-1,sIdx+1);
    if(k==='left-soft'||k==='center'){
      if(sIdx===0){scr='compose';compTxt='';t9K=null;}
      if(sIdx===1){scr='inbox';iIdx=0;}}
    if(k==='right-soft'||k==='end'){scr='menu';mIdx=0;}
  }
  else if(scr==='compose'){
    if(k>='0'&&k<='9'){const chars=T9[k];if(!chars)return;
      if(k===t9K){t9I++;}else{commitT9();t9K=k;t9I=0;}
      t9Wait=true;P.key.C=0;P.key.state='C';P.key.Lrate=1.2;}
    if(k==='right-soft'){t9K=null;t9Wait=false;scr='messages_menu';}
    if(k==='left-soft'){commitT9();if(compTxt.length>0){tone(1000,0.1);P.audio.forceδ();scr='sent';sentTimer=0;}}
    if(k==='end'){if(t9K!==null){t9K=null;t9I=0;t9Wait=false;}else compTxt=compTxt.slice(0,-1);}
  }
  else if(scr==='sent'){if(k==='right-soft'||k==='center')scr='home';}
  else if(scr==='inbox'){
    if(k==='up')iIdx=Math.max(0,iIdx-1);if(k==='down')iIdx=Math.min(INBOX.length-1,iIdx+1);
    if(k==='left-soft'||k==='center'){rIdx=iIdx;scr='read_message';}
    if(k==='right-soft'||k==='end')scr='messages_menu';
  }
  else if(scr==='read_message'){
    if(k==='left-soft'){scr='compose';compTxt='';}
    if(k==='right-soft'||k==='end')scr='inbox';
  }
  else if(scr==='phonebook'){
    if(k==='up')cIdx=Math.max(0,cIdx-1);if(k==='down')cIdx=Math.min(CONTACTS.length-1,cIdx+1);
    if(k==='left-soft'||k==='center'||k==='call'){callNum=CONTACTS[cIdx].num;calling=true;callTicks=0;scr='calling';}
    if(k==='right-soft'||k==='end')scr='home';
  }
  else if(scr==='callregister'){if(k==='right-soft'||k==='end'){scr='menu';mIdx=2;}}
  else if(scr==='profiles'){
    if(k==='up')pIdx=Math.max(0,pIdx-1);if(k==='down')pIdx=Math.min(PROFILES.length-1,pIdx+1);
    if(k==='left-soft'||k==='center'){profile=pIdx;if(pIdx!==1)tone(800,0.1);}
    if(k==='right-soft'||k==='end'){scr='menu';mIdx=3;}
  }
  else if(scr==='settings'){if(k==='right-soft'||k==='end'){scr='menu';mIdx=4;}}
  else if(scr==='games_menu'){
    if(k==='up')sIdx=Math.max(0,sIdx-1);if(k==='down')sIdx=Math.min(2,sIdx+1);
    if((k==='left-soft'||k==='center')&&sIdx===0){snake=mkSnake();scr='snake';P.cpu.Lrate=P.cpu.Lbase;}
    if(k==='right-soft'||k==='end'){scr='menu';mIdx=5;}
  }
  else if(scr==='snake'){
    if(!snake||!snake.alive){
      if(k==='center'||k==='left-soft'){snake=mkSnake();P.cpu.Lrate=P.cpu.Lbase;}
      if(k==='right-soft'||k==='end'){P.cpu.Lrate=P.cpu.Lbase;scr='home';}return;
    }
    if((k==='up'||k==='2')&&snake.dir.y===0)snake.nd={x:0,y:-1};
    if((k==='down'||k==='8')&&snake.dir.y===0)snake.nd={x:0,y:1};
    if((k==='left'||k==='4')&&snake.dir.x===0)snake.nd={x:-1,y:0};
    if((k==='right'||k==='6')&&snake.dir.x===0)snake.nd={x:1,y:0};
    if(k==='right-soft'||k==='end'){P.cpu.Lrate=P.cpu.Lbase;scr='home';}
  }
  // ═══ CALCULATOR — computed at CPU δ(now), not in key handler ═══
  else if(scr==='calculator'){
    if(k>='0'&&k<='9'){
      if(k==='0'&&calc.fresh&&!calc.op){calc={d:'0',prev:null,op:null,fresh:true};return;}
      if(calc.fresh){calc={...calc,d:k,fresh:false};}
      else if(calc.d.length<10){calc={...calc,d:calc.d+k};}
    }
    if(k==='*'){calc={...calc,prev:parseFloat(calc.d),op:'x',fresh:true};} // multiply
    if(k==='0'&&calc.d==='0'&&calc.fresh){calc={d:'0',prev:null,op:null,fresh:true};}
    if(k==='#'){ // EQUALS — computed HERE at CPU rupture
      if(calc.op&&calc.prev!==null){
        const b=parseFloat(calc.d);let r=0;
        if(calc.op==='+')r=calc.prev+b;
        if(calc.op==='-')r=calc.prev-b;
        if(calc.op==='x')r=calc.prev*b;
        if(calc.op==='/'&&b!==0)r=calc.prev/b;
        calc={d:String(parseFloat(r.toFixed(8))),prev:null,op:null,fresh:true};
      }
    }
    // Operator keys via soft/nav:
    if(k==='up'){calc={...calc,prev:parseFloat(calc.d),op:'+',fresh:true};} // + via up
    if(k==='down'){calc={...calc,prev:parseFloat(calc.d),op:'-',fresh:true};} // - via down
    if(k==='left'){calc={...calc,prev:parseFloat(calc.d),op:'/',fresh:true};} // / via left
    if(k==='right'){calc={...calc,prev:parseFloat(calc.d),op:'x',fresh:true};} // x via right
    if(k==='center'){ // = via center
      if(calc.op&&calc.prev!==null){
        const b=parseFloat(calc.d);let r=0;
        if(calc.op==='+')r=calc.prev+b;if(calc.op==='-')r=calc.prev-b;
        if(calc.op==='x')r=calc.prev*b;if(calc.op==='/'&&b!==0)r=calc.prev/b;
        calc={d:String(parseFloat(r.toFixed(8))),prev:null,op:null,fresh:true};
      }
    }
    if(k==='right-soft'||k==='end'){scr='menu';mIdx=6;}
  }
  else if(scr==='clock'){if(k==='right-soft'||k==='end'){scr='menu';mIdx=7;}}
  else if(scr==='crr_monitor'){
    const idx=PK.indexOf(procView);
    if(k==='up'||k==='left')procView=PK[Math.max(0,idx-1)];
    if(k==='down'||k==='right')procView=PK[Math.min(PK.length-1,idx+1)];
    if(k==='right-soft'||k==='end'){scr='menu';mIdx=8;}
  }
  else if(scr==='calling'){if(k==='right-soft'||k==='end'){calling=false;scr='home';}}
  else if(scr==='ringing'){
    if(k==='left-soft'||k==='call'||k==='center'){ringing=false;calling=true;callTicks=0;callNum='07700 900999';scr='calling';}
    if(k==='right-soft'||k==='end'){ringing=false;scr='home';}

}

  else if(scr==='settings'){dtc('Settings',0);hl(0,8,SW);
    dt('Phone settings',2,12);dt('Call settings',2,21);dt('Security',2,30);drawSK('','Back');}
  else if(scr==='games_menu'){dtc('Games',0);hl(0,8,SW);
    const g=['Snake','Pairs','Space Impact'];
    for(let i=0;i<g.length;i++){const y=10+i*9;
    if(i===sIdx){fillR(0,y-1,SW-2,9);dt(g[i],2,y,true);}else dt(g[i],2,y);}
    drawSK('Select','Back');}
  else if(scr==='snake'){if(!snake)return;drawRt(0,8,SW,SH-8);dt('Snake',2,0);dtr(String(snake.score),0);
    if(!snake.alive){dtc('RUPTURE!',18);dtc('C='+snake.score,28);}
    else{if(P.pwr.cyclePos()>0.3)fillR(snake.food.x,snake.food.y,2,2);
    for(const s of snake.body)px(s.x,s.y);}}
  else if(scr==='calculator'){
    dtc('Calculator',0);hl(0,8,SW);drawRt(2,10,SW-4,12);
    dtr(calc.d.substring(0,13),12);if(calc.op)dt(calc.op,4,12);
    dt('Num:0-9 #:= *:x',0,25);
    dt('U:+ D:- L:/ R:x',0,33);
    drawSK('[+- x/]','Back');}
  else if(scr==='clock'){drawSt();dtc(ts,14);
    const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    dtc(days[now.getDay()]+' '+now.getDate()+' '+months[now.getMonth()],26);drawSK('','Back');}
  else if(scr==='crr_monitor'){dt('CRR Monitor',0,0);hl(0,8,SW);
    const p=P[procView];if(p){dt(p.name.substring(0,14),0,10);
    dt(p.sym+' O='+p.omega.toFixed(3),0,18);
    dt(p.state+' d='+p.δn,0,26);
    drawRt(0,33,SW,14);const h=p.hist,mx=Math.max(...h.map(v=>v.c),0.1);
    for(let i=1;i<Math.min(h.length,SW-2);i++){const x=i+1,v=h[i]?.c||0,y=45-Math.floor((v/mx)*10);
    if(y>=34&&y<46)px(x,y);if(h[i]?.s==='δ'){px(x,34);px(x,35);}}}
    drawSK('','Back');}
  else if(scr==='calling'){dtc('Calling...',2);
    const ct=CONTACTS.find(c=>c.num===callNum);dtc(ct?ct.name:callNum.substring(0,13),14);
    const m=String(Math.floor(callTicks/30)).padStart(2,'0'),s=String(callTicks%60).padStart(2,'0');
    dtc(m+':'+s,26);
    const aH=P.audio.hist;for(let i=0;i<Math.min(aH.length,SW-4);i++){
    const x=2+i,v=aH[i]?.c||0,y=40-Math.floor(v*3);if(y>=35&&y<SH)px(x,y);}
    drawSK('','End');}
  else if(scr==='ringing'){dtc('Incoming call',2);dtc('07700 900999',14);
    if(P.pwr.cyclePos()>0.5){dt('*',20,26);dt('*',38,24);dt('*',56,26);}
    drawSK('Answer','Reject');}
  else if(scr==='dialer'){drawSt();if(dialBuf.length>0)dt(dialBuf.substring(Math.max(0,dialBuf.length-13)),2,14);
    dt('Type number',2,28);drawSK('Call','Back');}
  flush();
}

// ╔═══════════════════════════════════════════════════════════════════════╗
// ║  CRR PANEL                                                           ║
// ╚═══════════════════════════════════════════════════════════════════════╝

function sc(s){return s==='C'?'#4ade80':s==='δ'?'#f87171':'#60a5fa';}
let panelT=0;

function renderPanel(){
  const pnl=document.getElementById('pnl');
  let h='<div class="ph2"><span class="pt">CRR SUBSYSTEM DYNAMICS</span>';
  h+='<button class="tb" onclick="initA();playTune()">♪ Nokia Tune</button></div>';
  for(const key of PK){const p=P[key];const a=selProc===key;const c=sc(p.state);
    h+=`<div class="pc${a?' a':''}" onclick="selProc='${key}'">`;
    h+=`<div class="pch"><span class="pnm">${p.name}</span>`;
    h+=`<div class="pbd"><span class="sb ${p.sym==='Z₂'?'sz':'ss'}">${p.sym}</span>`;
    h+=`<span class="sd" style="background:${c};box-shadow:0 0 5px ${c}35"></span></div></div>`;
    h+=`<div class="ps"><span>Ω=${p.omega.toFixed(4)}</span><span>C=${p.C.toFixed(3)}</span>`;
    h+=`<span>δ=${p.δn}</span><span>CV=${p.cv.toFixed(4)}</span></div>`;
    const hi=p.hist;let pts='';
    if(hi.length>1){const mx=Math.max(...hi.map(v=>v.c),0.01);
    pts=hi.map((v,i)=>`${(i/(hi.length-1))*290},${20-(v.c/mx)*18}`).join(' ');}
    h+=`<svg width="290" height="20" style="display:block"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.85"/>`;
    hi.forEach((v,i)=>{if(v.s==='δ')h+=`<line x1="${(i/(hi.length-1))*290}" y1="0" x2="${(i/(hi.length-1))*290}" y2="20" stroke="#f87171" stroke-width="0.5" opacity="0.4"/>`;});
    h+=`</svg>`;
    const ev=Math.min(100,(Math.log(p.expCΩ())/5)*100);
    h+=`<div style="display:flex;justify-content:space-between;font-size:6px;color:#3a4558"><span>exp(C/Ω)</span><span>${p.expCΩ().toFixed(2)}</span></div>`;
    h+=`<div class="br"><div class="brf" style="width:${ev}%;background:${c}"></div></div></div>`;}

  h+=`<div class="lg"><span><i style="background:#4ade80"></i>C</span>`;
  h+=`<span><i style="background:#f87171"></i>δ</span>`;
  h+=`<span><i style="background:#60a5fa"></i>R</span></div>`;

  h+=`<div class="eq"><div class="el">GOVERNING EQUATIONS</div>`;
  h+=`<div>C(x,t) = ∫L(x,τ)dτ <span style="color:#4ade80">coherence</span></div>`;
  h+=`<div>δ(now) <span style="color:#f87171">rupture — scale-invariant choice-moment</span></div>`;
  h+=`<div>R = ∫φ·exp(C/Ω)·Θ dτ <span style="color:#60a5fa">regeneration with memory</span></div>`;
  h+=`<div style="margin-top:2px;color:#4a5568">Z₂: Ω=1/π≈0.3183 | SO(2): Ω=1/2π≈0.1592 | CV=Ω/2</div></div>`;

  h+=`<div class="em"><b>TRUE EMERGENT ARCHITECTURE</b><br>`;
  h+=`Key handler ONLY queues input + injects CPU energy. `;
  h+=`ALL computation — calculator, screen transitions, snake, T9 — executes at <b>CPU δ(now)</b>. `;
  h+=`Display renders at <b>LCD δ(now)</b>. `;
  h+=`The calculator works because the phone is built with CRR. `;
  h+=`<b>2+3=5 has no substrate to compute on without CRR.</b></div>`;

  h+=`<div class="hp">D-pad: navigate + calc ops (↑:+ ↓:- ←:÷ →:×) · Center = OK/equals<br>`;
  h+=`Numpad: digits · *:multiply · #:equals · Space = left soft<br>`;
  h+=`Input queue depth visible on home screen — watch keys wait for CPU δ</div>`;
  pnl.innerHTML=h;
}

// ╔═══════════════════════════════════════════════════════════════════════╗
// ║  MASTER LOOP — requestAnimationFrame steps CRR. Nothing else exists. ║
// ╚═══════════════════════════════════════════════════════════════════════╝

let lastT=0;

function master(ts){
  if(!lastT)lastT=ts;
  const dtMs=Math.min(ts-lastT,50);lastT=ts;const dt=dtMs/1000;

  // ═══ STEP ALL 9 CRR PROCESSES — the ONLY place time advances ═══
  for(const k of PK){
    if(k==='batt'){P.batt.C=Math.min(100,P.batt.C+0.0003*dt);continue;}
    P[k].step(dt);
  }

  // ═══ EMERGENT BEHAVIOURS — triggered ONLY by CRR events ═══

  // CPU δ: execute ALL queued computation
  if(P.cpu.justRuptured) cpuExecute();

  // LCD δ: render screen
  if(P.lcd.justRuptured) renderLCD();

  // Battery drain: oscillator counting
  if(P.osc.justRuptured && P.osc.δn%300===0) battPct=Math.max(3,battPct-0.1);

  // Incoming call: SIM threshold crossing
  if(P.sim.justRuptured && !calling && !ringing && scr==='home'){
    ringing=true;scr='ringing';updateLabels();if(profile!==1)playTune();}

  // Ring timeout: power cycles
  if(ringing && P.pwr.justRuptured && P.pwr.δn%20===0 && P.pwr.δn>0){
    ringing=false;scr='home';updateLabels();}

  // Panel: update at ~4fps (every 4th LCD rupture)
  if(P.lcd.justRuptured){panelT++;if(panelT%4===0)renderPanel();}

  requestAnimationFrame(master);
}

requestAnimationFrame(master);
</script>
