<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRR Family — Living Systems from First Principles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070c;overflow:hidden;font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;color:#c8b89a}
canvas{display:block;position:fixed;top:0;left:0}

#hud{position:fixed;top:16px;left:16px;z-index:10;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;max-width:320px}
.agent-card{background:rgba(7,7,12,0.92);border:1px solid rgba(200,184,154,0.12);border-radius:8px;
  padding:14px 16px;backdrop-filter:blur(10px);pointer-events:auto;cursor:pointer;
  transition:border-color 0.3s,max-height 0.4s ease;max-height:56px;overflow:hidden}
.agent-card.selected{border-color:rgba(212,165,116,0.5);max-height:400px}
.agent-card .name{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#e8d5b5;
  display:flex;justify-content:space-between;align-items:center}
.agent-card .name .role{font-size:9px;color:#a89880;letter-spacing:1px}
.agent-card .detail{margin-top:10px;border-top:1px solid rgba(200,184,154,0.08);padding-top:10px}
.agent-card .row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
.agent-card .row .label{color:#a89880}
.agent-card .row .val{color:#d4c4a8;font-family:'Courier New',monospace;font-size:10px}
.agent-card .bar-bg{height:3px;background:rgba(200,184,154,0.1);border-radius:2px;margin:3px 0}
.agent-card .bar{height:100%;border-radius:2px;transition:width 0.3s}
.agent-card .brain{margin-top:8px}
.agent-card .brain canvas{width:100%;height:40px;border-radius:4px;
  background:rgba(0,0,0,0.3);display:block}
.agent-card .state{font-size:10px;color:#d4a574;margin-top:6px;font-style:italic;
  letter-spacing:0.3px}
.agent-card .thought{font-size:10px;color:#c8b89a;margin-top:4px;opacity:0.7}

#env-info{position:fixed;bottom:16px;left:16px;right:16px;z-index:10;
  background:rgba(7,7,12,0.88);border:1px solid rgba(200,184,154,0.1);border-radius:8px;
  padding:14px 18px;backdrop-filter:blur(10px);display:flex;gap:20px;align-items:center}
#env-info .title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a89880;
  white-space:nowrap}
#env-info .stats{display:flex;gap:16px;flex-wrap:wrap}
#env-info .stat{font-size:10px;color:#d4c4a8;white-space:nowrap}
#env-info .stat span{font-family:'Courier New',monospace;color:#d4a574}

#controls{position:fixed;top:16px;right:16px;z-index:10;display:flex;gap:6px;flex-direction:column}
.ctrl{background:rgba(7,7,12,0.88);border:1px solid rgba(200,184,154,0.15);border-radius:6px;
  color:#a89880;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;
  cursor:pointer;font-family:inherit;transition:all 0.3s;text-align:left}
.ctrl:hover{color:#e8d5b5;border-color:rgba(200,184,154,0.35)}
.ctrl.active{color:#d4a574;border-color:rgba(212,165,116,0.4)}
.ctrl kbd{font-family:'Courier New',monospace;opacity:0.5;float:right;margin-left:8px}
</style>
</head>
<body>

<div id="hud"></div>

<div id="env-info">
  <div class="title">CRR World</div>
  <div class="stats" id="world-stats"></div>
</div>

<div id="controls">
  <button class="ctrl active" onclick="toggleCam('follow')" id="btn-follow">Follow Agent <kbd>1-4</kbd></button>
  <button class="ctrl" onclick="toggleCam('overview')" id="btn-overview">Overview <kbd>O</kbd></button>
  <button class="ctrl" onclick="toggleSpeed()" id="btn-speed">Speed: 1× <kbd>S</kbd></button>
  <button class="ctrl" onclick="toggleBrainViz()" id="btn-brain">Brain Waves <kbd>B</kbd></button>
  <button class="ctrl" onclick="toggleOmegaField()" id="btn-omega">Ω Field <kbd>F</kbd></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CRR CONSTANTS — THE UNIVERSAL GRAMMAR
// ═══════════════════════════════════════════════════════════════

const π = Math.PI;
const φ = (1 + Math.sqrt(5)) / 2;
const Ω_Z2 = 1 / π;
const f0 = 1 / (π * π); // breath frequency

const BRAIN_LEVELS = [
  { name: 'Breath',  freq: f0,          color: '#8b4513' },
  { name: 'Infra',   freq: f0*π,        color: '#a0522d' },
  { name: 'Delta',   freq: f0*π**2,     color: '#cd853f' },
  { name: 'Theta',   freq: f0*π**3,     color: '#daa520' },
  { name: 'Alpha',   freq: f0*π**4,     color: '#d4a574' },
  { name: 'Beta',    freq: f0*π**5,     color: '#e8c89a' },
  { name: 'Gamma',   freq: f0*π**6,     color: '#f0e0c8' },
];

// ═══════════════════════════════════════════════════════════════
// THREE.JS SCENE
// ═══════════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07070c, 0.04);
scene.background = new THREE.Color(0x07070c);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x8b7355, 0.5));
const sun = new THREE.DirectionalLight(0xffeedd, 0.9);
sun.position.set(8, 15, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 50;
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9ab4cc, 0.3);
fill.position.set(-5, 8, -3);
scene.add(fill);

// ═══════════════════════════════════════════════════════════════
// ENVIRONMENT — THE WORLD
// ═══════════════════════════════════════════════════════════════

// Ground
const groundGeo = new THREE.PlaneGeometry(60, 60, 30, 30);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a0e, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -π/2;
ground.receiveShadow = true;
scene.add(ground);

// Subtle grid
const grid = new THREE.GridHelper(60, 60, 0x1f1f15, 0x12120d);
grid.position.y = 0.01;
scene.add(grid);

// World objects that agents can interact with
const worldObjects = [];

function createWorldObject(type, x, z, data = {}) {
  const obj = { type, x, z, data, mesh: null, active: true, cooldown: 0 };
  
  const mats = {
    food:    new THREE.MeshStandardMaterial({ color: 0xcc6633, roughness: 0.6 }),
    water:   new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.2, metalness: 0.3 }),
    shelter: new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.8 }),
    puzzle:  new THREE.MeshStandardMaterial({ color: 0xaa8844, roughness: 0.5, metalness: 0.2 }),
    toy:     new THREE.MeshStandardMaterial({ color: 0xcc4466, roughness: 0.4 }),
    tool:    new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.3, metalness: 0.6 }),
    fire:    new THREE.MeshStandardMaterial({ color: 0xff6622, roughness: 0.5, emissive: 0xff4400, emissiveIntensity: 0.3 }),
  };

  const g = new THREE.Group();
  
  if(type === 'food') {
    // Berry bush
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.4, 6), mats.shelter);
    trunk.position.y = 0.2;
    g.add(trunk);
    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), 
      new THREE.MeshStandardMaterial({ color: 0x2d5a1e, roughness: 0.9 }));
    bush.position.y = 0.55;
    g.add(bush);
    for(let i = 0; i < 6; i++) {
      const berry = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), mats.food);
      berry.position.set(Math.cos(i*π/3)*0.3, 0.5+Math.random()*0.2, Math.sin(i*π/3)*0.3);
      g.add(berry);
    }
    obj.need = 'hunger';
    obj.value = 30;
  } else if(type === 'water') {
    const pool = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.08, 16), mats.water);
    pool.position.y = 0.04;
    g.add(pool);
    obj.need = 'thirst';
    obj.value = 25;
  } else if(type === 'shelter') {
    // Simple hut shape
    const walls = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.8), mats.shelter);
    walls.position.y = 0.6;
    g.add(walls);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.8, 4), mats.shelter);
    roof.position.y = 1.6;
    roof.rotation.y = π/4;
    g.add(roof);
    obj.need = 'rest';
    obj.value = 20;
  } else if(type === 'puzzle') {
    // Stack of stones
    for(let i = 0; i < 3; i++) {
      const stone = new THREE.Mesh(new THREE.SphereGeometry(0.2-i*0.05, 8, 6), mats.puzzle);
      stone.position.y = i * 0.3 + 0.15;
      stone.scale.y = 0.6;
      g.add(stone);
    }
    obj.need = 'curiosity';
    obj.value = 40;
    obj.difficulty = data.difficulty || 0.5;
  } else if(type === 'toy') {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 8), mats.toy);
    ball.position.y = 0.15;
    g.add(ball);
    obj.need = 'play';
    obj.value = 25;
  } else if(type === 'fire') {
    // Campfire
    for(let i = 0; i < 5; i++) {
      const log = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6), mats.shelter);
      log.rotation.z = π/2;
      log.rotation.y = i * π/5;
      log.position.y = 0.08;
      g.add(log);
    }
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 6), mats.fire);
    flame.position.y = 0.4;
    g.add(flame);
    obj.flameMesh = flame;
    obj.need = 'social';
    obj.value = 15;
    // Light
    const fireLight = new THREE.PointLight(0xff6622, 1.5, 6);
    fireLight.position.y = 0.6;
    g.add(fireLight);
    obj.light = fireLight;
  } else if(type === 'tool') {
    // Stick/tool
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.8, 6), mats.shelter);
    stick.position.y = 0.4;
    stick.rotation.z = 0.3;
    g.add(stick);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.04), mats.tool);
    head.position.set(-0.15, 0.7, 0);
    g.add(head);
    obj.need = 'curiosity';
    obj.value = 35;
    obj.isTool = true;
  }
  
  g.position.set(x, 0, z);
  g.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
  scene.add(g);
  obj.mesh = g;
  worldObjects.push(obj);
  return obj;
}

// Populate world
createWorldObject('fire', 0, 0);
createWorldObject('shelter', -6, -4);
createWorldObject('shelter', 5, 6);
createWorldObject('food', -8, 2);
createWorldObject('food', 7, -3);
createWorldObject('food', -3, 8);
createWorldObject('food', 4, -8);
createWorldObject('water', -4, -7);
createWorldObject('water', 6, 3);
createWorldObject('water', -2, 5);
createWorldObject('puzzle', 3, 2, { difficulty: 0.4 });
createWorldObject('puzzle', -5, 4, { difficulty: 0.7 });
createWorldObject('puzzle', 8, 7, { difficulty: 0.9 });
createWorldObject('toy', -1, -3);
createWorldObject('toy', 2, 5);
createWorldObject('tool', -7, -1);
createWorldObject('tool', 5, -5);

// Trees for atmosphere
for(let i = 0; i < 20; i++) {
  const angle = Math.random() * π * 2;
  const dist = 12 + Math.random() * 15;
  const tx = Math.cos(angle) * dist;
  const tz = Math.sin(angle) * dist;
  const treeG = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.15, 1.5+Math.random(), 6),
    new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 })
  );
  trunk.position.y = 0.75;
  treeG.add(trunk);
  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(0.6+Math.random()*0.5, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a3a10+Math.floor(Math.random()*0x101010), roughness: 0.95 })
  );
  canopy.position.y = 1.8 + Math.random() * 0.5;
  treeG.add(canopy);
  treeG.position.set(tx, 0, tz);
  treeG.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
  scene.add(treeG);
}

// ═══════════════════════════════════════════════════════════════
// CRR AGENT — THE LIVING SYSTEM
// ═══════════════════════════════════════════════════════════════

class CRRAgent {
  constructor(config) {
    this.name = config.name;
    this.role = config.role;
    this.color = config.color;
    this.skinColor = config.skinColor || 0xc8956b;
    this.height = config.height || 1.75;
    this.age = config.age; // developmental stage 0-100
    this.personalOmega = config.omega || Ω_Z2; // base Ω personality
    
    // CRR INTERNAL STATE
    this.coherence = 0.5;         // C: current coherence level
    this.coherenceHistory = [];    // C(τ) for memory weighting
    this.rupturing = false;        // δ active?
    this.ruptureTimer = 0;
    this.regenerating = false;
    this.regenPhase = 0;
    this.omega = this.personalOmega;  // current Ω (modulated by context)
    this.omegaSocial = 0;         // social Ω modifier
    
    // BRAIN WAVE STATE
    this.brainAmplitudes = BRAIN_LEVELS.map((l, i) => 
      i <= 4 ? 0.5 + Math.random() * 0.3 : 0.2
    );
    this.brainPhases = BRAIN_LEVELS.map(() => Math.random() * π * 2);
    this.dominantFreq = 4; // alpha default
    
    // NEEDS (drives that create coherence gradients)
    this.needs = {
      hunger:    40 + Math.random() * 20,
      thirst:    50 + Math.random() * 20,
      rest:      70 + Math.random() * 20,
      social:    60 + Math.random() * 20,
      curiosity: 30 + Math.random() * 30,
      play:      config.age < 50 ? 20 : 60, // children need more play
    };
    
    // BEHAVIOR STATE
    this.state = 'idle';
    this.stateDesc = 'Resting';
    this.thought = '';
    this.target = null;
    this.targetObj = null;
    this.actionTimer = 0;
    this.socialTarget = null;
    this.decisionCooldown = 0;
    this.hasTool = false;
    this.solvedPuzzles = 0;
    
    // POSITION & MOVEMENT
    this.x = config.x || 0;
    this.z = config.z || 0;
    this.angle = Math.random() * π * 2;
    this.speed = 0;
    this.maxSpeed = config.height < 1.2 ? 1.2 : 1.8;
    this.gaitPhase = Math.random() * π * 2;
    
    // MOTOR SYSTEM — joint angles
    this.joints = {
      hipL: 0, hipR: 0, kneeL: 0, kneeR: 0, ankleL: 0, ankleR: 0,
      shoulderL: 0, shoulderR: 0, elbowL: 0, elbowR: 0,
      spine: 0, spineY: 0, head: 0, headY: 0,
    };
    
    // MIRROR/SOCIAL STATE
    this.mirrorCalibration = this.age / 100; // M: how well-calibrated
    this.gazeTarget = null;
    this.expressionState = 'neutral';
    
    // BUILD 3D BODY
    this.group = new THREE.Group();
    this.buildBody();
    this.group.position.set(this.x, 0, this.z);
    scene.add(this.group);
    
    // Ω FIELD VISUALIZATION
    this.omegaRing = new THREE.Mesh(
      new THREE.RingGeometry(0.8, 1.0, 32),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(this.color), transparent: true, opacity: 0, side: THREE.DoubleSide })
    );
    this.omegaRing.rotation.x = -π/2;
    this.omegaRing.position.y = 0.02;
    this.group.add(this.omegaRing);
  }
  
  // ─── BODY BUILDER ───
  buildBody() {
    const S = this.height / 8;
    const skinMat = new THREE.MeshStandardMaterial({ color: this.skinColor, roughness: 0.65 });
    const clothMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.7 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1208, roughness: 0.5 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xf0ebe0, roughness: 0.3 });
    const irisMat = new THREE.MeshStandardMaterial({ color: 0x4a6741, roughness: 0.2 });
    
    // Skeleton groups
    this.bones = {};
    const mk = (name, parent) => {
      const g = new THREE.Group();
      g.name = name;
      (parent || this.group).add(g);
      this.bones[name] = g;
      return g;
    };
    
    const root = mk('root');
    const legLen = S * 3.8;
    root.position.y = legLen * 0.52 + S * 0.3;
    
    // ─ Pelvis ─
    const pelvis = new THREE.Mesh(new THREE.SphereGeometry(S*0.55, 10, 8), clothMat);
    pelvis.scale.set(1.4, 0.6, 0.9);
    root.add(pelvis);
    
    // ─ Spine ─
    const spine = mk('spine', root);
    spine.position.y = S * 0.2;
    
    // Torso
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(S*0.45, S*0.5, S*1.6, 10), clothMat);
    torso.position.y = S * 0.8;
    spine.add(torso);
    
    // ─ Chest ─
    const chest = mk('chest', spine);
    chest.position.y = S * 0.75;
    
    const chestMesh = new THREE.Mesh(new THREE.CylinderGeometry(S*0.55, S*0.45, S*1.0, 10), clothMat);
    chestMesh.position.y = S * 0.5;
    chest.add(chestMesh);
    
    // ─ Neck ─
    const neck = mk('neck', chest);
    neck.position.y = S * 1.05;
    const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(S*0.13, S*0.15, S*0.3, 8), skinMat);
    neckMesh.position.y = S * 0.15;
    neck.add(neckMesh);
    
    // ─ Head ─
    const head = mk('head', neck);
    head.position.y = S * 0.35;
    
    // Scale head larger for children (CRR: higher developmental Ω = larger head proportion)
    const headScale = this.age < 30 ? 1.3 : this.age < 60 ? 1.15 : 1.0;
    
    const skull = new THREE.Mesh(new THREE.SphereGeometry(S*0.45*headScale, 14, 10), skinMat);
    skull.position.y = S * 0.35;
    skull.scale.set(0.85, 1, 0.88);
    head.add(skull);
    
    // Hair
    const hairMat = new THREE.MeshStandardMaterial({ color: this.role === 'child-young' ? 0x604020 : 0x2a1a0e, roughness: 0.9 });
    const hair = new THREE.Mesh(new THREE.SphereGeometry(S*0.47*headScale, 10, 8, 0, π*2, 0, π*0.55), hairMat);
    hair.position.y = S * 0.37;
    hair.scale.set(0.86, 1, 0.9);
    head.add(hair);
    
    // Eyes
    [-1,1].forEach(side => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(S*0.06*headScale, 8, 6), eyeMat);
      eye.position.set(side*S*0.16*headScale, S*0.4, S*0.35*headScale);
      head.add(eye);
      const iris = new THREE.Mesh(new THREE.SphereGeometry(S*0.035*headScale, 6, 4), irisMat);
      iris.position.set(side*S*0.16*headScale, S*0.4, S*0.39*headScale);
      head.add(iris);
    });
    
    // Nose
    const nose = new THREE.Mesh(new THREE.SphereGeometry(S*0.045*headScale, 6, 4), skinMat);
    nose.position.set(0, S*0.3, S*0.4*headScale);
    head.add(nose);
    
    // Mouth indicator
    this.mouthMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(S*0.005, S*0.005, S*0.08*headScale, 4), 
      new THREE.MeshStandardMaterial({ color: 0x9b5040, roughness: 0.5 })
    );
    this.mouthMesh.rotation.z = π/2;
    this.mouthMesh.position.set(0, S*0.2, S*0.38*headScale);
    head.add(this.mouthMesh);
    
    // ─ Arms ─
    ['L','R'].forEach(side => {
      const sign = side === 'L' ? -1 : 1;
      const shoulder = mk('shoulder'+side, chest);
      shoulder.position.set(sign * S * 0.6, S * 0.85, 0);
      
      // Upper arm
      const ua = new THREE.Mesh(new THREE.CylinderGeometry(S*0.1, S*0.085, S*1.0, 8), 
        side === 'L' ? clothMat : skinMat);
      ua.position.y = -S * 0.5;
      shoulder.add(ua);
      
      const elbow = mk('elbow'+side, shoulder);
      elbow.position.y = -S * 1.0;
      
      // Forearm
      const fa = new THREE.Mesh(new THREE.CylinderGeometry(S*0.075, S*0.06, S*0.85, 8), skinMat);
      fa.position.y = -S * 0.42;
      elbow.add(fa);
      
      // Hand (high Ω - slightly larger for emphasis)
      const hand = new THREE.Mesh(new THREE.SphereGeometry(S*0.08, 8, 6), skinMat);
      hand.position.y = -S * 0.9;
      hand.scale.set(0.9, 1.2, 0.6);
      elbow.add(hand);
    });
    
    // ─ Legs ─
    const hipW = S * 0.4;
    ['L','R'].forEach(side => {
      const sign = side === 'L' ? -1 : 1;
      const hip = mk('hip'+side, root);
      hip.position.set(sign * hipW, -S * 0.15, 0);
      
      // Thigh
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(S*0.16, S*0.12, S*1.5, 8), clothMat);
      thigh.position.y = -S * 0.75;
      hip.add(thigh);
      
      const knee = mk('knee'+side, hip);
      knee.position.y = -S * 1.5;
      
      const kneeCap = new THREE.Mesh(new THREE.SphereGeometry(S*0.1, 6, 4), clothMat);
      knee.add(kneeCap);
      
      // Shin
      const shin = new THREE.Mesh(new THREE.CylinderGeometry(S*0.1, S*0.07, S*1.3, 8), clothMat);
      shin.position.y = -S * 0.65;
      knee.add(shin);
      
      const ankle = mk('ankle'+side, knee);
      ankle.position.y = -S * 1.3;
      
      // Foot
      const foot = new THREE.Mesh(new THREE.BoxGeometry(S*0.14, S*0.06, S*0.28), darkMat);
      foot.position.set(0, -S*0.03, S*0.06);
      ankle.add(foot);
    });
    
    // Shadow/expression indicator - ring above head showing CRR state
    this.stateRing = new THREE.Mesh(
      new THREE.TorusGeometry(S*0.35, S*0.02, 8, 24),
      new THREE.MeshBasicMaterial({ color: this.color, transparent: true, opacity: 0.5 })
    );
    this.stateRing.rotation.x = π/2;
    this.stateRing.position.y = this.height * 0.6 + S * 0.9;
    this.bones.head.add(this.stateRing);
    
    this.group.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
  }
  
  // ─── CRR BRAIN UPDATE ───
  updateBrain(dt) {
    // Advance brain oscillations
    for(let i = 0; i < BRAIN_LEVELS.length; i++) {
      this.brainPhases[i] += BRAIN_LEVELS[i].freq * π * 2 * dt;
      
      // Amplitude modulated by state
      let targetAmp = 0.3;
      if(this.state === 'moving' && i >= 3 && i <= 5) targetAmp = 0.8; // motor: theta-beta
      if(this.state === 'thinking' && i === 4) targetAmp = 0.9;       // alpha for attention
      if(this.state === 'interacting' && i === 3) targetAmp = 0.85;   // theta for social
      if(this.state === 'resting' && i <= 2) targetAmp = 0.7;         // delta/infra for rest
      if(this.rupturing && i >= 5) targetAmp = 1.0;                   // gamma burst at rupture
      if(i === 0) targetAmp = 0.6; // breath always present
      
      this.brainAmplitudes[i] += (targetAmp - this.brainAmplitudes[i]) * dt * 2;
    }
    
    // Determine dominant frequency
    let maxAmp = 0, maxIdx = 0;
    this.brainAmplitudes.forEach((a, i) => { if(a > maxAmp && i > 0) { maxAmp = a; maxIdx = i; }});
    this.dominantFreq = maxIdx;
  }
  
  // ─── CRR COHERENCE DYNAMICS ───
  updateCoherence(dt) {
    // Coherence accumulates based on current activity alignment
    let coherenceRate = 0;
    
    if(this.state === 'moving' && this.target) {
      // Moving toward goal: coherence builds proportional to need urgency
      const urgency = this.targetObj ? (100 - this.needs[this.targetObj.need]) / 100 : 0.3;
      coherenceRate = 0.15 * urgency;
    } else if(this.state === 'interacting') {
      coherenceRate = 0.25; // interaction builds coherence
    } else if(this.state === 'thinking') {
      coherenceRate = 0.1;
    } else if(this.state === 'social') {
      coherenceRate = 0.2 + this.omegaSocial * 0.3;
    } else {
      coherenceRate = -0.05; // idle: slight coherence decay
    }
    
    this.coherence += coherenceRate * dt;
    this.coherence = Math.max(0, Math.min(1, this.coherence));
    
    // Store history
    this.coherenceHistory.push(this.coherence);
    if(this.coherenceHistory.length > 200) this.coherenceHistory.shift();
    
    // ─── RUPTURE CHECK ───
    // Rupture occurs when coherence exceeds threshold (1/Ω normalized)
    // OR when a need becomes critical
    const ruptureThreshold = 0.7 + this.omega * 0.5;
    const criticalNeed = Object.values(this.needs).some(n => n < 15);
    
    if(!this.rupturing && !this.regenerating) {
      if(this.coherence > ruptureThreshold || criticalNeed) {
        this.triggerRupture(criticalNeed ? 'need' : 'coherence');
      }
    }
    
    // Rupture dynamics
    if(this.rupturing) {
      this.ruptureTimer -= dt;
      if(this.ruptureTimer <= 0) {
        this.rupturing = false;
        this.regenerating = true;
        this.regenPhase = 0;
        this.makeDecision();
      }
    }
    
    // Regeneration
    if(this.regenerating) {
      this.regenPhase += dt * 2;
      // Exponential memory weighting: exp(C/Ω)
      const memoryWeight = Math.exp(this.coherence / this.omega);
      this.coherence = 0.3 + 0.2 * (1 - Math.exp(-this.regenPhase));
      if(this.regenPhase > 1.5) {
        this.regenerating = false;
      }
    }
  }
  
  triggerRupture(reason) {
    this.rupturing = true;
    this.ruptureTimer = 0.15 + Math.random() * 0.1; // brief δ moment
    this.coherence *= 0.4; // coherence drops
    
    // Gamma burst
    this.brainAmplitudes[5] = 1.0;
    this.brainAmplitudes[6] = 0.9;
  }
  
  // ─── DECISION MAKING (post-rupture regeneration) ───
  makeDecision() {
    // R = ∫ φ(x,τ) exp(C(x,τ)/Ω) Θ(...) dτ
    // The regeneration integral selects action based on memory-weighted needs
    
    const needScores = {};
    for(const [need, val] of Object.entries(this.needs)) {
      // Lower need value = higher urgency
      const urgency = (100 - val) / 100;
      // Memory weighting: past success with this need type
      const memWeight = Math.exp(this.coherence / this.omega);
      needScores[need] = urgency * memWeight * (1 + Math.random() * 0.3);
    }
    
    // Children weight play and curiosity higher
    if(this.age < 50) {
      needScores.play *= 1.5;
      needScores.curiosity *= 1.4;
    }
    
    // Social bonus near others
    if(agents.some(a => a !== this && dist2d(a.x, a.z, this.x, this.z) < 4)) {
      needScores.social *= 1.3;
    }
    
    // Find highest priority need
    let topNeed = 'curiosity', topScore = 0;
    for(const [need, score] of Object.entries(needScores)) {
      if(score > topScore) { topScore = score; topNeed = need; }
    }
    
    // Find best object for this need
    let bestObj = null, bestDist = Infinity;
    worldObjects.forEach(obj => {
      if(!obj.active || obj.cooldown > 0) return;
      if(obj.need === topNeed || (topNeed === 'play' && obj.type === 'toy') ||
         (topNeed === 'social' && obj.type === 'fire')) {
        const d = dist2d(obj.x, obj.z, this.x, this.z);
        // Tool check for puzzles
        if(obj.type === 'puzzle' && obj.difficulty > 0.6 && !this.hasTool) {
          // Need tool first - redirect
          return;
        }
        if(d < bestDist) { bestDist = d; bestObj = obj; }
      }
    });
    
    // If need is social, target another agent
    if(topNeed === 'social' && (!bestObj || bestDist > 8)) {
      const nearestAgent = agents
        .filter(a => a !== this)
        .sort((a, b) => dist2d(a.x, a.z, this.x, this.z) - dist2d(b.x, b.z, this.x, this.z))[0];
      if(nearestAgent) {
        this.socialTarget = nearestAgent;
        this.target = { x: nearestAgent.x, z: nearestAgent.z };
        this.targetObj = null;
        this.state = 'moving';
        this.stateDesc = `Seeking ${nearestAgent.name}`;
        this.thought = `I want to be near ${nearestAgent.name}`;
        return;
      }
    }
    
    if(bestObj) {
      this.target = { x: bestObj.x, z: bestObj.z };
      this.targetObj = bestObj;
      this.state = 'moving';
      this.stateDesc = `Going to ${bestObj.type}`;
      this.thought = needThoughts[topNeed] || 'Exploring...';
    } else {
      // Wander
      const wanderAngle = this.angle + (Math.random() - 0.5) * π;
      const wanderDist = 3 + Math.random() * 5;
      this.target = {
        x: Math.max(-12, Math.min(12, this.x + Math.cos(wanderAngle) * wanderDist)),
        z: Math.max(-12, Math.min(12, this.z + Math.sin(wanderAngle) * wanderDist))
      };
      this.targetObj = null;
      this.state = 'moving';
      this.stateDesc = 'Exploring';
      this.thought = 'I wonder what\'s over there...';
    }
  }
  
  // ─── MOVEMENT & MOTOR SYSTEM ───
  updateMotor(dt) {
    // Deplete needs over time
    for(const need of Object.keys(this.needs)) {
      let rate = 0.8; // base depletion
      if(need === 'hunger') rate = 1.2;
      if(need === 'thirst') rate = 1.5;
      if(need === 'play' && this.age < 50) rate = 2.0;
      this.needs[need] = Math.max(0, this.needs[need] - rate * dt);
    }
    
    // Social need partially met by proximity
    agents.forEach(a => {
      if(a !== this && dist2d(a.x, a.z, this.x, this.z) < 3) {
        this.needs.social = Math.min(100, this.needs.social + 3 * dt);
        // Ω modulation: increase between family members
        this.omegaSocial = Math.min(0.5, this.omegaSocial + 0.1 * dt);
        this.omega = this.personalOmega + this.omegaSocial;
      }
    });
    this.omegaSocial *= (1 - 0.3 * dt); // decay when alone
    
    if(this.state === 'moving' && this.target) {
      const dx = this.target.x - this.x;
      const dz = this.target.z - this.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      
      if(dist < 0.8) {
        // Arrived
        this.speed = 0;
        if(this.targetObj) {
          this.startInteraction();
        } else if(this.socialTarget) {
          this.startSocial();
        } else {
          this.state = 'idle';
          this.stateDesc = 'Resting';
          this.decisionCooldown = 2 + Math.random() * 3;
        }
      } else {
        // Walk toward target
        const targetAngle = Math.atan2(dz, dx);
        // Smooth rotation
        let angleDiff = targetAngle - this.angle;
        while(angleDiff > π) angleDiff -= 2*π;
        while(angleDiff < -π) angleDiff += 2*π;
        this.angle += angleDiff * Math.min(1, dt * 4);
        
        this.speed = Math.min(this.maxSpeed, dist * 0.8);
        this.x += Math.cos(this.angle) * this.speed * dt;
        this.z += Math.sin(this.angle) * this.speed * dt;
        
        // Boundary
        this.x = Math.max(-14, Math.min(14, this.x));
        this.z = Math.max(-14, Math.min(14, this.z));
      }
    }
    
    // Gait phase
    const gaitFreq2 = f0 * π * π; // heart rate = gait
    this.gaitPhase += gaitFreq2 * π * 2 * dt * (this.speed / this.maxSpeed);
    
    // CRR asymmetric gait
    const stanceRatio = φ / (1 + φ);
    const phase = this.gaitPhase;
    const antiPhase = phase + π;
    const walkAmp = Math.min(1, this.speed / this.maxSpeed);
    
    // Hip flexion/extension
    this.joints.hipL = crrGaitFn(phase, stanceRatio) * walkAmp;
    this.joints.hipR = crrGaitFn(antiPhase, stanceRatio) * walkAmp;
    
    // Knees
    this.joints.kneeL = crrKneeFn(phase, stanceRatio) * walkAmp;
    this.joints.kneeR = crrKneeFn(antiPhase, stanceRatio) * walkAmp;
    
    // Arms counter-swing
    this.joints.shoulderL = -this.joints.hipL * 0.8;
    this.joints.shoulderR = -this.joints.hipR * 0.8;
    this.joints.elbowL = -0.15 - Math.max(0, this.joints.hipL) * 0.3 * walkAmp;
    this.joints.elbowR = -0.15 - Math.max(0, this.joints.hipR) * 0.3 * walkAmp;
    
    // Spine
    this.joints.spineY = Math.sin(phase) * 0.04 * walkAmp;
    
    // Breathing
    const breathPhase = globalTime * f0 * π * 2;
    this.joints.spine = Math.sin(breathPhase) * 0.01;
    
    // Head stabilization
    this.joints.headY = -this.joints.spineY * 0.5;
    
    // Apply to skeleton
    this.applyPose();
    
    // Update position
    this.group.position.set(this.x, 0, this.z);
    this.group.rotation.y = -this.angle + π/2;
    
    // Idle decision timer
    if(this.state === 'idle') {
      this.decisionCooldown -= dt;
      if(this.decisionCooldown <= 0) {
        this.triggerRupture('idle');
      }
    }
    
    // Update social target position
    if(this.socialTarget && this.state === 'moving') {
      this.target.x = this.socialTarget.x;
      this.target.z = this.socialTarget.z;
    }
  }
  
  applyPose() {
    const b = this.bones;
    if(b.hipL) { b.hipL.rotation.x = this.joints.hipL; }
    if(b.hipR) { b.hipR.rotation.x = this.joints.hipR; }
    if(b.kneeL) { b.kneeL.rotation.x = this.joints.kneeL; }
    if(b.kneeR) { b.kneeR.rotation.x = this.joints.kneeR; }
    if(b.shoulderL) { b.shoulderL.rotation.x = this.joints.shoulderL; }
    if(b.shoulderR) { b.shoulderR.rotation.x = this.joints.shoulderR; }
    if(b.elbowL) { b.elbowL.rotation.x = this.joints.elbowL; }
    if(b.elbowR) { b.elbowR.rotation.x = this.joints.elbowR; }
    if(b.spine) { 
      b.spine.rotation.y = this.joints.spineY; 
      b.spine.rotation.x = this.joints.spine;
    }
    if(b.head) { 
      b.head.rotation.y = this.joints.headY;
    }
    
    // Vertical bounce
    const bounce = Math.abs(Math.sin(this.gaitPhase)) * 0.02 * Math.min(1, this.speed / this.maxSpeed);
    if(b.root) b.root.position.y = this.height * 0.3 + bounce;
    
    // State ring visualization
    if(this.stateRing) {
      let col = new THREE.Color(this.color);
      let opacity = 0.3;
      if(this.rupturing) { col = new THREE.Color(0xff4400); opacity = 0.9; }
      else if(this.regenerating) { col = new THREE.Color(0x44ff88); opacity = 0.7; }
      else if(this.state === 'interacting') { col = new THREE.Color(0xffcc44); opacity = 0.6; }
      else if(this.state === 'social') { col = new THREE.Color(0xff88cc); opacity = 0.6; }
      this.stateRing.material.color = col;
      this.stateRing.material.opacity = opacity;
      this.stateRing.rotation.y += 0.02;
    }
    
    // Omega field ring
    if(this.omegaRing && showOmegaField) {
      this.omegaRing.material.opacity = 0.15 + this.omega * 0.3;
      this.omegaRing.scale.set(1 + this.omega * 2, 1, 1 + this.omega * 2);
    } else if(this.omegaRing) {
      this.omegaRing.material.opacity = 0;
    }
  }
  
  // ─── INTERACTIONS ───
  startInteraction() {
    this.state = 'interacting';
    this.actionTimer = 2 + Math.random() * 2;
    
    if(this.targetObj) {
      const obj = this.targetObj;
      this.stateDesc = `Using ${obj.type}`;
      
      if(obj.type === 'puzzle') {
        this.state = 'thinking';
        this.stateDesc = 'Solving puzzle';
        this.thought = 'Let me think about this...';
        this.actionTimer = 3 + obj.difficulty * 4;
        if(this.hasTool) this.actionTimer *= 0.5; // tool helps
        this.dominantFreq = 4; // alpha for concentration
      } else if(obj.type === 'tool') {
        this.thought = 'This could be useful!';
        this.hasTool = true;
        this.actionTimer = 1;
      } else if(obj.type === 'food') {
        this.thought = 'Mmm, berries!';
      } else if(obj.type === 'water') {
        this.thought = 'Refreshing...';
      } else if(obj.type === 'toy') {
        this.thought = 'Fun!';
        this.state = 'interacting';
      } else if(obj.type === 'fire') {
        this.thought = 'Warm and cozy...';
      }
    }
  }
  
  startSocial() {
    this.state = 'social';
    this.actionTimer = 3 + Math.random() * 4;
    this.stateDesc = `With ${this.socialTarget.name}`;
    
    // Dyadic mirroring: mirror calibration increases
    if(this.socialTarget) {
      const thoughts = [
        `Sharing a moment with ${this.socialTarget.name}`,
        `Looking at ${this.socialTarget.name}`,
        `Being together feels good`,
      ];
      this.thought = thoughts[Math.floor(Math.random() * thoughts.length)];
    }
  }
  
  updateInteraction(dt) {
    if(this.state !== 'interacting' && this.state !== 'thinking' && this.state !== 'social') return;
    
    this.actionTimer -= dt;
    
    if(this.state === 'social' && this.socialTarget) {
      // Face toward social target
      const dx = this.socialTarget.x - this.x;
      const dz = this.socialTarget.z - this.z;
      const targetAngle = Math.atan2(dz, dx);
      let angleDiff = targetAngle - this.angle;
      while(angleDiff > π) angleDiff -= 2*π;
      while(angleDiff < -π) angleDiff += 2*π;
      this.angle += angleDiff * dt * 3;
      this.group.rotation.y = -this.angle + π/2;
      
      // Mutual Ω boosting
      this.needs.social = Math.min(100, this.needs.social + 8 * dt);
      this.omegaSocial = Math.min(0.5, this.omegaSocial + 0.2 * dt);
      
      // Mirror calibration (children learn from adults)
      if(this.age < 70) {
        this.mirrorCalibration = Math.min(1, this.mirrorCalibration + 0.01 * dt);
      }
    }
    
    if(this.actionTimer <= 0) {
      // Complete interaction
      if(this.targetObj) {
        const obj = this.targetObj;
        if(obj.need && this.needs[obj.need] !== undefined) {
          this.needs[obj.need] = Math.min(100, this.needs[obj.need] + obj.value);
        }
        if(obj.type === 'puzzle') {
          this.solvedPuzzles++;
          this.needs.curiosity = Math.min(100, this.needs.curiosity + 40);
          this.thought = 'Solved it! That felt good.';
          obj.cooldown = 30 + Math.random() * 20;
        }
        if(obj.type === 'food' || obj.type === 'water') {
          obj.cooldown = 15 + Math.random() * 10;
        }
      }
      
      this.state = 'idle';
      this.stateDesc = 'Resting';
      this.targetObj = null;
      this.socialTarget = null;
      this.decisionCooldown = 1.5 + Math.random() * 3;
    }
  }
  
  // ─── MAIN UPDATE ───
  update(dt) {
    this.updateBrain(dt);
    this.updateCoherence(dt);
    this.updateMotor(dt);
    this.updateInteraction(dt);
    
    // Update world object cooldowns
    worldObjects.forEach(obj => {
      if(obj.cooldown > 0) obj.cooldown -= dt;
      if(obj.flameMesh) {
        obj.flameMesh.scale.y = 0.8 + Math.sin(globalTime * 8) * 0.3;
        obj.flameMesh.scale.x = 0.9 + Math.sin(globalTime * 6.3) * 0.15;
      }
      if(obj.light) {
        obj.light.intensity = 1.2 + Math.sin(globalTime * 7) * 0.5;
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// GAIT FUNCTIONS
// ═══════════════════════════════════════════════════════════════

function crrGaitFn(phase, stanceRatio) {
  const norm = ((phase % (2*π)) + 2*π) % (2*π);
  const stanceEnd = stanceRatio * 2 * π;
  if(norm < stanceEnd) {
    return -Math.sin(norm / stanceEnd * π) * 0.35;
  } else {
    return Math.sin((norm - stanceEnd) / (2*π - stanceEnd) * π) * 0.5;
  }
}

function crrKneeFn(phase, stanceRatio) {
  const norm = ((phase % (2*π)) + 2*π) % (2*π);
  const stanceEnd = stanceRatio * 2 * π;
  if(norm < stanceEnd * 0.3) {
    return Math.sin(norm / (stanceEnd * 0.3) * π) * 0.15;
  } else if(norm < stanceEnd) {
    return 0;
  } else {
    return Math.sin((norm - stanceEnd) / (2*π - stanceEnd) * π) * 1.0;
  }
}

function dist2d(x1, z1, x2, z2) {
  return Math.sqrt((x1-x2)**2 + (z1-z2)**2);
}

  play: 'I want to play!',

function updateHUD() {
  agents.forEach((agent, i) => {
    const card = document.getElementById('card-' + i);
    if(!card) return;
    
    card.className = 'agent-card' + (i === selectedAgent ? ' selected' : '');
    
    if(i !== selectedAgent) return; // Only update expanded card
    
    const stateEl = card.querySelector('.state');
    const thoughtEl = card.querySelector('.thought');
    if(stateEl) stateEl.textContent = agent.stateDesc;
    if(thoughtEl) thoughtEl.textContent = agent.thought;
    
    // Update bars
    const bars = card.querySelectorAll('.bar');
    const vals = card.querySelectorAll('.val');
    let bi = 0;
    Object.entries(agent.needs).forEach(([need, val], ni) => {
      if(bars[bi]) {
        bars[bi].style.width = val + '%';
        bars[bi].style.background = needColor(need, val);
      }
      if(vals[ni]) vals[ni].textContent = val.toFixed(0) + '%';
      bi++;
    });
    // Coherence bar
    if(bars[bi]) {
      bars[bi].style.width = (agent.coherence * 100) + '%';
    }
    
    // Brain canvas
    if(showBrainViz) {
      drawBrainWaves(agent, i);
    }
  });
  
  // World stats
  const ws = document.getElementById('world-stats');
  const totalCoherence = agents.reduce((s, a) => s + a.coherence, 0) / agents.length;
  const totalSocial = agents.reduce((s, a) => s + a.needs.social, 0) / agents.length;
  const totalPuzzles = agents.reduce((s, a) => s + a.solvedPuzzles, 0);
  ws.innerHTML = `
    <span class="stat">Avg C: <span>${totalCoherence.toFixed(2)}</span></span>
    <span class="stat">Social: <span>${totalSocial.toFixed(0)}%</span></span>
    <span class="stat">Puzzles: <span>${totalPuzzles}</span></span>
    <span class="stat">Time: <span>${formatTime(globalTime)}</span></span>
  `;
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function drawBrainWaves(agent, idx) {
  const canvas = document.getElementById('brain-' + idx);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  
  [0, 2, 3, 4, 5].forEach((li, vi) => {
    const level = BRAIN_LEVELS[li];
    const amp = agent.brainAmplitudes[li];
    const y0 = 4 + vi * (H - 8) / 4;
    
    ctx.beginPath();
    ctx.strokeStyle = level.color;
    ctx.lineWidth = li === agent.dominantFreq ? 2 : 0.8;
    ctx.globalAlpha = 0.4 + amp * 0.5;
    
    for(let x = 0; x < W; x++) {
      const t = globalTime - (W - x) * 0.008;
      const phase = t * level.freq * π * 2 + agent.brainPhases[li];
      const y = y0 + Math.sin(phase) * amp * 4;
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  
  // Rupture flash
  if(agent.rupturing) {
    ctx.fillStyle = 'rgba(255, 68, 0, 0.2)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ═══════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════

function toggleCam(mode) {
  camMode = mode;
  document.querySelectorAll('.ctrl').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
}

function toggleSpeed() {
  timeScale = timeScale === 1 ? 3 : timeScale === 3 ? 5 : 1;
  document.getElementById('btn-speed').textContent = `Speed: ${timeScale}× `;
}

function toggleBrainViz() {
  showBrainViz = !showBrainViz;
  document.getElementById('btn-brain').classList.toggle('active');
  buildHUD();
}

function toggleOmegaField() {
  showOmegaField = !showOmegaField;
  document.getElementById('btn-omega').classList.toggle('active');
}

document.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '4') { selectedAgent = parseInt(e.key) - 1; buildHUD(); }
  if(e.key === 'o') toggleCam('overview');
  if(e.key === 's') toggleSpeed();
  if(e.key === 'b') toggleBrainViz();
  if(e.key === 'f') toggleOmegaField();
});

// ═══════════════════════════════════════════════════════════════
// SOCIAL CONNECTION LINES
// ═══════════════════════════════════════════════════════════════

const lineMat = new THREE.LineBasicMaterial({ color: 0xd4a574, transparent: true, opacity: 0.2 });
const socialLines = [];
for(let i = 0; i < agents.length; i++) {
  for(let j = i+1; j < agents.length; j++) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0)
    ]);
    const line = new THREE.Line(geo, lineMat.clone());
    scene.add(line);
    socialLines.push({ line, i, j });
  }
}

function updateSocialLines() {
  socialLines.forEach(({ line, i, j }) => {
    const a = agents[i], b = agents[j];
    const d = dist2d(a.x, a.z, b.x, b.z);
    const visible = d < 5;
    line.visible = visible && showOmegaField;
    if(visible) {
      const positions = line.geometry.attributes.position.array;
      positions[0] = a.x; positions[1] = a.height * 0.5; positions[2] = a.z;
      positions[3] = b.x; positions[4] = b.height * 0.5; positions[5] = b.z;
      line.geometry.attributes.position.needsUpdate = true;
      
      const socialStrength = Math.min(a.omegaSocial, b.omegaSocial);
      line.material.opacity = (1 - d/5) * 0.3 * (1 + socialStrength * 3);
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════

let lastTime = 0;
let hudTimer = 0;

buildHUD();

function animate(timestamp) {
  requestAnimationFrame(animate);
  
  const rawDt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;
  const dt = rawDt * timeScale;
  globalTime += dt;
  
  // Update agents
  agents.forEach(agent => agent.update(dt));
  
  // Social connections
  updateSocialLines();
  
  // Camera
  if(camMode === 'follow') {
    const target = agents[selectedAgent];
    const camDist = 6;
    const camHeight = 3.5;
    const tx = target.x - Math.sin(target.angle) * camDist;
    const tz = target.z - Math.cos(target.angle) * camDist;
    camera.position.x += (tx - camera.position.x) * 0.03;
    camera.position.y += (camHeight - camera.position.y) * 0.03;
    camera.position.z += (tz - camera.position.z) * 0.03;
    camera.lookAt(target.x, target.height * 0.5, target.z);
  } else {
    // Overview
    const overviewAngle = globalTime * 0.05;
    camera.position.x = Math.sin(overviewAngle) * 18;
    camera.position.y = 12;
    camera.position.z = Math.cos(overviewAngle) * 18;
    camera.lookAt(0, 0, 0);
  }
  
  renderer.render(scene, camera);
  
  // Update HUD at lower rate
  hudTimer += rawDt;
  if(hudTimer > 0.2) {
    hudTimer = 0;
    updateHUD();
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate(0);
</script>
