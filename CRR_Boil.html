// ═══════════════════════════════════════════════════════════════════════
// §0  MATHEMATICS
// ═══════════════════════════════════════════════════════════════════════
const PI=Math.PI, TAU=2*PI, PHI=(1+Math.sqrt(5))/2;
const{sin,cos,sqrt,pow,abs,min,max,exp,log,random:rnd,atan2,floor:flr,ceil,round}=Math;

// ═══════════════════════════════════════════════════════════════════════
// §1  CRR CONSTANTS
//
//     C(x,t) = ∫ L(x,τ) dτ        coherence accumulates
//     δ(now)                        rupture is instantaneous
//     R = ∫ φ exp(C/Ω) Θ dτ        regeneration from weighted memory
//
//     Universal rupture condition:  C · Ω = 1
//     Beauty function:              B(r) = exp(r)·(1 − r/π)
//
//     CRR predictions:
//       Z₂ inter-rupture CV = 1/(2π) ≈ 0.1592
//       SO(2) period CV     = 1/(4π) ≈ 0.0796
// ═══════════════════════════════════════════════════════════════════════
const Om_Z2  = 1/PI;              // §CRR Z₂ variance
const Om_SO2 = 1/TAU;             // §CRR SO(2) variance
const CV_Z2_PRED  = 1/TAU;         // §CRR predicted Z₂ CV
const CV_SO2_PRED = 1/(4*PI);     // §CRR predicted SO(2) CV
const C_STAR_Z2  = PI;             // §CRR rupture coherence Z₂
const C_STAR_SO2 = TAU;            // §CRR rupture coherence SO(2)
const R_BEAUTY = PI - 1;           // §CRR beauty peak at dB/dr=0
const B_MAX = exp(R_BEAUTY)/PI;    // normalisation constant

function B(r)  { return max(0, exp(min(8,r)) * (1 - r/PI)) }        // §CRR
function Bn(r) { return max(0, min(1, B(r) / B_MAX)) }              // §CRR normalised

// §COMPATIBLE Fresnel reflectance — algebraic identity under Ω = 1/(π·n).
// The 1/π cancels in the ratio, so standard Fresnel gives the same result.
// CRR's form matches standard physics; no new physics added.
const R0_WATER = ((1.333-1)/(1.333+1))**2; // = 0.02037

// §EXT External physics
const MINNAERT_K = 3260;                       // Hz·mm (Minnaert 1933)
function minnaertF(rmm) { return MINNAERT_K / max(0.05, rmm) }
const D_FRITZ_MM = 2.08, R_FRITZ_MM = D_FRITZ_MM/2; // Fritz 1935

// ═══════════════════════════════════════════════════════════════════════
// §2  THERMODYNAMIC STATE — §EXT energy balance
// ═══════════════════════════════════════════════════════════════════════
const WATER_MASS = 1.0;
const CP_WATER   = 4186;
const Q_MAX      = 2200;
const H_LOSS     = 8;
const A_POT      = 0.06;
const T_AMB      = 20;
const T_SAT      = 100;
const H_FG       = 2.257e6;
let T_water = T_AMB;
let gasPower = 0;

function updateTemperature(dt) {
  const Q_loss = H_LOSS * A_POT * (T_water - T_AMB);
  let Q_evap = 0;
  if (T_water > 90) {
    const dT_s = max(0, T_water - T_SAT);
    Q_evap = ((T_water-90)/10*0.0001 + dT_s*0.0008) * H_FG;
  }
  T_water += (gasPower - Q_loss - Q_evap) / (WATER_MASS * CP_WATER) * dt;
  T_water = max(T_AMB-2, min(T_water, 103));
}

function Tnorm() { return max(0, min(1, (T_water-T_AMB) / (T_SAT+3-T_AMB))) }

// §MAPPING Temperature-to-coherence correspondence.
// Onset at Tnorm=0.78 (≈85°C) is the subcooled nucleation threshold.
// Upper bound Tnorm=1.0 (103°C) is the physical temperature cap.
// Beauty peak at r=π−1 lands at ~97°C by the mapping arithmetic.
// The mapping is stipulated for pacing; the beauty function itself is §CRR.

// §EXT Nucleation rate shape. Exponential ramp chosen for visual pacing.
// The π in exp(s·π) sets the curve steepness; prefactor 3 and cap 55
// are visual parameters, not derived from CRR.
function nucRate(){
  const t = Tnorm();
  if(t < 0.78) return 0;
  const s = (t - 0.78) / 0.22;
  return min(55, (exp(s * PI) - 1) * 3);
}
function beautyAtT(){
  // §CRR Beauty function value at current Tnorm, via §MAPPING.
  const t = Tnorm();
  if(t < 0.78) return 0;
  const s = (t - 0.78) / 0.22;
  return Bn(s * PI);
}
function steamRate(){
  const t = Tnorm();
  if(t < 0.93) return 0;
  // §EXT Evaporation ramp above 97°C; shape chosen for pacing.
  return pow((t - 0.93) / 0.07, 2) * 80;
}
function departR(){ const t=Tnorm(); return R_FRITZ_MM * (1 + t*t*3.5) } // §EXT

// ═══════════════════════════════════════════════════════════════════════
// §3  GLSL FRAGMENT SHADER
// ═══════════════════════════════════════════════════════════════════════
const VS = `attribute vec2 a; void main() { gl_Position = vec4(a,0,1); }`;
const FS = `precision highp float;
uniform vec2 u_res;
uniform float u_time, u_temp, u_beauty, u_nucRate, u_gas;

const float PI  = 3.14159265;
const float TAU = 6.28318530;
const float PHI = 1.6180339887;
const float Om  = 1./PI;
const float rP  = PI - 1.;
const float BM  = exp(PI-1.)/PI;
const float R0W = 0.02037;           // §COMPATIBLE Fresnel
const vec3  AW  = vec3(.45,.064,.005); // §EXT Pope & Fry 1997

const float PR = .82, PB = .12, PT = .66, WL = .025, RR = .022;
const float WY = .62, BR = .90;

float B(float r) { return max(0., exp(min(8.,r))*(1.-r/PI)/BM); } // §CRR

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

// §EXT Pot geometry (raymarched)
float sdTorus(vec3 p, float R, float r){
  vec2 q = vec2(length(p.xz)-R, p.y);
  return length(q)-r;
}
float potSDF(vec3 p){
  float rr = length(p.xz);
  float side = max(abs(rr-PR+WL*.5)-WL*.5, max(p.y-PT, PB-p.y));
  float bot  = max(abs(p.y-PB-WL*.3)-WL*.3, rr-(PR-WL*.5));
  float rim  = sdTorus(p-vec3(0,PT,0), PR-RR*.5, RR);
  vec3 h1 = p-vec3(PR+.04, PT*.65, 0);
  vec3 h2 = p-vec3(-PR-.04, PT*.65, 0);
  return min(min(min(side,bot),rim), min(sdTorus(h1.xzy,.06,.012), sdTorus(h2.xzy,.06,.012)));
}
vec3 potN(vec3 p){
  float e = .001;
  return normalize(vec3(potSDF(p+vec3(e,0,0))-potSDF(p-vec3(e,0,0)),
                        potSDF(p+vec3(0,e,0))-potSDF(p-vec3(0,e,0)),
                        potSDF(p+vec3(0,0,e))-potSDF(p-vec3(0,0,e))));
}
vec3 steel(vec3 p, vec3 n, vec3 L, vec3 V){
  float brush = sin(atan(p.z,p.x)*60.+p.y*160.)*.5+.5;
  vec3 base = vec3(.52,.50,.49)*(.85+.15*brush);
  base = mix(base, vec3(.65,.45,.28), smoothstep(PB+.12,PB,p.y)*u_temp*.3);
  float d = max(0.,dot(n,L))*.45;
  vec3 H = normalize(L+V);
  float s = pow(max(0.,dot(n,H)),100.)*1.8;
  return base*(.1+d) + vec3(1.,.98,.95)*s + vec3(.45)*pow(1.-max(0.,dot(n,V)),4.)*.1;
}

// §PARTIAL Turbulence (Kolmogorov -5/3 + CRR π-turnover → 2^(-1/3) per octave)
float flameTurb(vec3 p, float t){
  float v=0., a=1., f=1.;
  for(int g=0; g<5; g++){
    float s = f*p.x + t*(g==0?2.:g==1?-1.5:g==2?3.:g==3?-2.:1.7);
    float q = f*p.y + t*(g==0?-1.:g==1?2.5:g==2?-1.8:g==3?1.2:-2.3);
    float cs = cos(float(g)*1.047), sn = sin(float(g)*1.047);
    float u = s*cs-q*sn, w = s*sn+q*cs;
    v += a * (sin(u + sin(w*PHI)) * cos(w/PHI + sin(u/PHI)));
    a *= 0.794;
    f *= 2.0;
  }
  return v;
}

// §AESTHETIC Flame rendering. Form and colour tuned for photorealism.
// Radial envelope uses exp(-r²/2Ω) which is the CRR regeneration kernel shape,
// but applied here as a convenient smooth falloff rather than a physical claim.
vec4 flameAt(vec3 p, float t){
  float gas = u_gas;
  if(gas < .01) return vec4(0);

  float rr = length(p.xz), h = p.y;
  float flameH = .04 + gas*.06;
  if(h < 0. || h > flameH) return vec4(0);
  float ny = h / flameH;
  float angle = atan(p.z, p.x);

  float ringAtH = BR + (1.2 + gas*.4) * h;
  float dRing = rr - ringAtH;
  float radDist = dRing < 0. ? abs(dRing)*2.5 : dRing;

  float jetA = angle * 36./TAU;
  float jetFrac = fract(jetA + .5) - .5;
  float jetDist = abs(jetFrac) * 2.;

  // §PARTIAL Jet width — exponent 1/φ is suggestive, not derived.
  float w0 = .05 * pow(max(.001, 1.-min(.999, ny)), 1./PHI);
  float w = w0 * (1. + .08*sin(t*PI*1.5)*(ny*ny + .12));

  float innerW = w * .45 * (1. - ny*.6);
  float innerR = (radDist + jetDist*.04) / max(.002, innerW);
  float outerW = w * 1.2;
  float gapFade = smoothstep(0., .7, ny);
  float outerGap = jetDist * .055 * (1. - gapFade);
  float outerR = (radDist + outerGap) / max(.002, outerW);

  float tb = flameTurb(vec3(angle*3., h*30., rr*5.), t*6.) * .18 * (ny*ny + .08);
  float innerEr = max(0., innerR + tb*.15);
  float outerEr = max(0., outerR + tb);

  float innerI = B(rP*(1.-innerEr*.5)) * exp(-innerEr*innerEr/(1.5*Om));
  innerI *= max(0., 1.-pow(ny,2.)) * (1.-smoothstep(0.,.55,ny)*.6);

  float outerI = B(rP*(1.-outerEr*.6)) * B(rP*(.3+.7*pow(max(.01,sin(ny*PI*.75)),1.2)));
  outerI *= exp(-outerEr*outerEr/(2.*Om)) * max(0., 1.-pow(ny,2.5));

  vec3 innerCol = mix(vec3(.7,.8,1.), vec3(.85,.9,1.), smoothstep(0.,.1,ny));
  innerCol = mix(innerCol, vec3(.4,.55,1.), smoothstep(.15,.4,ny));

  vec3 outerCol = mix(vec3(.2,.35,1.), vec3(.3,.5,1.), smoothstep(0.,.25,ny));
  outerCol = mix(outerCol, vec3(.35,.5,.9), smoothstep(.25,.6,ny));
  outerCol = mix(outerCol, vec3(.3,.4,.75), smoothstep(.6,.95,ny));

  float rootFlash = exp(-ny*15.) * (1.-smoothstep(0.,.06,radDist));
  innerCol += vec3(.5,.5,.3) * rootFlash;

  vec3 col = outerCol*max(0.,outerI) + innerCol*max(0.,innerI)*1.8;
  float I = max(0., outerI + innerI*.9);
  I *= 1. - smoothstep(.5,.95,ny)*.6;

  float baseGlow = exp(-outerEr)*.15*(1.-ny)*exp(-ny*5.);
  I += baseGlow;
  col += vec3(.2,.3,.9) * baseGlow;

  float yellowNoise = flameTurb(vec3(angle*7.+t*1.3, h*50., rr*8.), t*2.5);
  float yellowProb = smoothstep(.72, .92, yellowNoise) * ny*ny;
  col = mix(col, vec3(.95,.6,.08)*max(0.,I)*2.5, yellowProb*.25);

  I *= gas*gas;
  col *= gas*gas * 2.5;
  return vec4(col, max(0.,I));
}

// §CRR + §AESTHETIC water surface composition
float boilH(vec2 p, float t){
  float temp = u_temp, r = length(p);
  if(r > .95) return 0.;
  float h = 0.;

  // §CRR SO(2) convection cells (hexagonal, slow)
  float kc = 5.5;
  float c1 = sin(kc*p.x + t*.5) * sin(kc*p.y + t*.35);
  float c2 = sin(kc*(p.x*.866+p.y*.5) - t*.4) * sin(kc*(-p.x*.5+p.y*.866) + t*.55);
  h += (c1 + c2*.7) * temp * .008;

  // §CRR Z₂ nucleation domes (visual — actual CV measured from particle system)
  for(int i=0; i<16; i++){
    float fi = float(i);
    vec2 site = vec2(sin(fi*2.37+t*.13)*(.15+fi*.035),
                     cos(fi*3.14+t*.11)*(.15+fi*.03));
    float d = length(p - site);
    float rate = .18 + fi*.028 + temp*.15;
    float phase = fract(t*rate + fi*.37);
    float amp;
    if     (phase < .60) amp = sin(phase/.6*PI*.5);
    else if(phase < .68) amp = cos((phase-.6)/.08*PI*.5);
    else if(phase < .78) amp = -sin((phase-.68)/.1*PI)*.2;
    else                 amp = 0.;
    h += amp * smoothstep(.06+fi*.006+temp*.015, 0., d) * max(0.,temp-.78) * .18;
  }

  float boil = max(0., temp-.94);
  h += sin(p.x*2.1+t*2.5)*sin(p.y*1.7-t*2.)*boil*.5;
  h += (noise(p*8.+t*2.5)-.5) * max(0.,temp-.96) * .8;
  h += sin(p.x*14.+t*6.)*sin(p.y*12.+t*5.) * temp*temp * .008;

  return h * smoothstep(.97,.82,r);
}

vec3 waterN(vec2 p, float t){
  float e=.003, hc=boilH(p,t);
  return normalize(vec3(-(boilH(p+vec2(e,0),t)-hc)/e*8., 1.,
                        -(boilH(p+vec2(0,e),t)-hc)/e*8.));
}

mat3 lookAt(vec3 e, vec3 t, vec3 u){
  vec3 f=normalize(t-e), r=normalize(cross(f,u));
  return mat3(r, cross(r,f), -f);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - .5*u_res) / u_res.y;
  vec3 ro = vec3(.7, 1.2, 2.1);
  mat3 cam = lookAt(ro, vec3(0,.32,0), vec3(0,1,0));
  vec3 rd = cam * normalize(vec3(uv, -1.15));
  vec3 L = normalize(vec3(.4,1.1,.5)), V = -rd;
  vec3 col = vec3(.02,.018,.015);

  float tFloor = -1e6;
  if(rd.y < -.001){
    tFloor = (-.01-ro.y)/rd.y;
    if(tFloor > 0.){
      vec3 fp = ro+rd*tFloor; float fd = length(fp.xz);
      float gg = sin(fp.x*2.5+sin(fp.z*2.)*.3)*.015+.015;
      col = vec3(.04+gg, .035+gg*.7, .028+gg*.4) / (1.+fd*fd*.2);
      col += vec3(.025)*(smoothstep(.006,0.,abs(fd-BR+.04))+smoothstep(.006,0.,abs(fd-BR-.04)));
    }
  }

  if(u_gas > .01){
    float flameH = .04 + u_gas*.06;
    for(int i=0; i<40; i++){
      float fh = float(i)*flameH/39. + .001;
      if(rd.y > -.0001 && fh > ro.y) continue;
      float tH = (fh-ro.y)/rd.y;
      if(tH < 0. || tH > 8.) continue;
      vec3 fp = ro+rd*tH;
      if(length(fp.xz) < PR-WL*2. && fp.y > PB+WL*2. && fp.y < PT-.05) continue;
      vec4 fi = flameAt(fp, u_time);
      if(fi.w > .001) col += fi.rgb * .18;
    }
    if(tFloor > 0.){
      float fd = length((ro+rd*tFloor).xz);
      float glowR = BR + .06;
      col += vec3(.06,.10,.30) * exp(-pow(fd-glowR,2.)*6.) * u_gas*.5;
    }
  }

  float tW = -1e6;
  if(rd.y < -.001) tW = (WY-ro.y)/rd.y;
  bool hitW = false;

  if(tW > 0.){
    vec3 wp = ro+rd*tW; float wr = length(wp.xz);
    if(wr < PR-WL*2.){
      hitW = true;
      vec2 wuv = wp.xz/(PR-WL*2.);
      vec3 wn = waterN(wuv, u_time);

      float NdV = max(.001, dot(wn,V));
      float fres = R0W + (1.-R0W)*pow(1.-NdV, 5.);
      fres += pow(wr/(PR-WL*2.), 10.)*.08;

      vec3 Hf = normalize(L+V);
      float spec  = pow(max(0.,dot(wn,Hf)), 400.)*5.;
      float spec2 = pow(max(0.,dot(wn,Hf)), 40.)*.15;
      float spec3 = pow(max(0.,dot(wn,normalize(vec3(.1,-1.,.1)+V))), 80.)*.08*u_temp;

      vec3 absorption = exp(-AW*.9);
      vec3 potBase = vec3(.14,.14,.16) * absorption;
      vec3 waterTint = vec3(.03,.05,.12);
      vec3 wb = potBase + waterTint;
      wb = mix(wb, vec3(.10,.10,.11), u_temp*.3);
      float fr = length(wuv);
      wb *= .85 + .15*(1.-fr);

      float eps=.004, hc=boilH(wuv,u_time);
      float lap = (boilH(wuv+vec2(eps,0),u_time)+boilH(wuv-vec2(eps,0),u_time)+
                   boilH(wuv+vec2(0,eps),u_time)+boilH(wuv-vec2(0,eps),u_time)-4.*hc)/(eps*eps);
      float caust = min(2.5, max(0., 1./max(.12,abs(1.-.1*lap*max(.1,u_temp+.15)))-1.));
      wb += vec3(.20,.18,.15) * caust * min(1.,u_temp+.25) * absorption;

      wb += vec3(.06,.03,.01) * u_gas * .08 * (1.-fr*.4);

      if(u_temp > .95){
        float foam = max(0., noise(wuv*6.+u_time*.5)-.3) * (u_temp-.95)*40.;
        wb += vec3(.18,.17,.16) * min(1.,foam);
      }

      vec3 env = vec3(.06,.06,.07);
      env += vec3(.04,.06,.12) * u_gas * max(0., 1.-abs(wr/(PR-WL*2.)-.85)*6.);
      env += vec3(.06,.04,.015) * u_temp * max(0., 1.-abs(wr/(PR-WL*2.)-.85)*8.);

      col = mix(wb, env, min(.35, fres));
      col += vec3(1,.97,.92)*spec + vec3(.6,.55,.48)*spec2 + vec3(.9,.5,.2)*spec3;

      float pr = wr/(PR-WL*2.);
      col += vec3(.1,.08,.05) * smoothstep(.93,.99,pr) * smoothstep(1.,.99,pr);
      col *= 1. - smoothstep(.93,1.,pr)*.12;
    }
  }

  float tPot = 1e6;
  vec3 potCol = col;
  bool hitP = false;
  {
    float t2=.01, tMax=min(tFloor>0.?tFloor:6., 6.);
    vec3 bp;
    for(int i=0; i<52; i++){
      bp = ro+rd*t2; float d = potSDF(bp);
      if(d < .001){ hitP=true; tPot=t2; break; }
      t2 += d*.7; if(t2>tMax) break;
    }
    if(hitP){
      vec3 bn = potN(bp);
      potCol = steel(bp, bn, L, V);
      if(u_gas>.01 && bp.y < PB+.18){
        float glow = exp(-(bp.y-PB)*5.) * u_gas*.3;
        potCol += vec3(.12,.15,.35)*glow + vec3(.05,.08,.25)*glow*.5;
      }
      if(u_temp>.88 && bp.y > PT-.08){
        float cond = (u_temp-.88)*6. * smoothstep(PT-.08,PT-.02,bp.y);
        potCol += vec3(.08,.07,.06) * max(0., sin(bp.x*80.+bp.z*60.)*.5+.1) * cond;
      }
    }
  }

  if(hitP && tPot < tW){
    col = potCol;
    hitW = false;
  } else if(hitW){
  } else if(hitP){
    col = potCol;
  }

  if(u_temp > .90){
    float fogD = (u_temp-.90)*8.;
    float tLow = (WY-ro.y)/rd.y, tHigh = (WY+.5-ro.y)/rd.y;
    if(tLow>0. && tHigh>0.){
      float tMn=min(tLow,tHigh), tMx=max(tLow,tHigh);
      for(int j=0; j<5; j++){
        float fT = tMn + (tMx-tMn)*(float(j)+.5)/5.;
        vec3 sp = ro+rd*fT; float sr = length(sp.xz);
        if(sr < PR+.08){
          float fog = fogD * smoothstep(PR*.05,PR*.5,sr) * smoothstep(PR+.05,PR*.7,sr);
          fog *= .5 + .5*noise(sp.xz*3.+u_time*.6);
          fog *= smoothstep(WY,WY+.08,sp.y) * smoothstep(WY+.55,WY+.15,sp.y);
          col = mix(col, vec3(.38,.37,.36), min(.5, fog*.25));
        }
      }
    }
  }

  col *= max(0., 1.-.22*length(uv*1.1));
  col = pow(col, vec3(.95, 1., 1.05));
  gl_FragColor = vec4(col, 1);
}`;

const glCv = document.getElementById('gl');
const gl = glCv.getContext('webgl', {alpha:false, antialias:false});
const cvEl = document.getElementById('cv');
const cx = cvEl.getContext('2d');
let W, H;

function mkShader(src, type){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = (() => {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(VS, gl.VERTEX_SHADER));
  gl.attachShader(p, mkShader(FS, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
})();
gl.useProgram(prog);
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = {};
['u_res','u_time','u_temp','u_beauty','u_nucRate','u_gas'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const EYE=[.7,1.2,2.1], TGT=[0,.32,0], FOV=1.15;
const cf=[TGT[0]-EYE[0],TGT[1]-EYE[1],TGT[2]-EYE[2]];
const cfl=sqrt(cf[0]*cf[0]+cf[1]*cf[1]+cf[2]*cf[2]);
const fwd=[cf[0]/cfl,cf[1]/cfl,cf[2]/cfl];
const rR=[fwd[1]*0-fwd[2]*1,fwd[2]*0-fwd[0]*0,fwd[0]*1-fwd[1]*0];
const rL=sqrt(rR[0]*rR[0]+rR[1]*rR[1]+rR[2]*rR[2]);
const right=[rR[0]/rL,rR[1]/rL,rR[2]/rL];
const up=[right[1]*fwd[2]-right[2]*fwd[1],right[2]*fwd[0]-right[0]*fwd[2],right[0]*fwd[1]-right[1]*fwd[0]];

function proj3D(wx,wy,wz){
  const dx=wx-EYE[0], dy=wy-EYE[1], dz=wz-EYE[2];
  const px=right[0]*dx+right[1]*dy+right[2]*dz;
  const py=up[0]*dx+up[1]*dy+up[2]*dz;
  const pz=fwd[0]*dx+fwd[1]*dy+fwd[2]*dz;
  if(pz<.01) return null;
  return { x: W/2+(FOV*px/pz)*H, y: H/2-(FOV*py/pz)*H, z: pz };
}

// §5  AUDIO — tags corrected
//
//  Gas hiss:     §PARTIAL Kolmogorov-shaped noise
//  Bubble pop:   §EXT Minnaert f = 3260/R_mm, amplitude × §CRR B(C/Ω)
//  Singing:      §EXT tonal band chosen by ear for kettle realism
//  Rumble:       §EXT broadband low shaped to track nucleation rate
//  Steam:        §EXT high-frequency hiss tracking evaporation
//  Convection:   §AESTHETIC 38 Hz sub-bass drone (not a convection timescale)
// ═══════════════════════════════════════════════════════════════════════
let ac=null, mGain=null;
let gasG=null, rumG=null, steamG=null, singG=null, convG=null;
let pt=0, lastT=0;

function mkNoise(dur){
  const len=ac.sampleRate*dur, buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=rnd()*2-1}
  return buf;
}

function initAudio(){
  if(ac) return;
  ac = new (AudioContext || webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=5;
  comp.connect(ac.destination);
  mGain = ac.createGain(); mGain.gain.value = 0.5;

  const rLen=ac.sampleRate*2.2, rBuf=ac.createBuffer(2,rLen,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=rBuf.getChannelData(ch);
    for(let i=0;i<rLen;i++) d[i]=(rnd()*2-1)*pow(1-i/rLen,3)}
  const rev=ac.createConvolver(); rev.buffer=rBuf;
  const wet=ac.createGain(), dry=ac.createGain();
  wet.gain.value=.18; dry.gain.value=.85;
  mGain.connect(dry); dry.connect(comp);
  mGain.connect(rev); rev.connect(wet); wet.connect(comp);
  const nb = mkNoise(2);

  const gSrc=ac.createBufferSource(); gSrc.buffer=nb; gSrc.loop=true;
  const gHP=ac.createBiquadFilter(); gHP.type='highpass'; gHP.frequency.value=2000; gHP.Q.value=.3;
  const gLP=ac.createBiquadFilter(); gLP.type='lowpass';  gLP.frequency.value=6000; gLP.Q.value=.4;
  gasG=ac.createGain(); gasG.gain.value=0;
  gSrc.connect(gHP); gHP.connect(gLP); gLP.connect(gasG); gasG.connect(mGain); gSrc.start();

  const rSrc=ac.createBufferSource(); rSrc.buffer=nb; rSrc.loop=true;
  const rLP2=ac.createBiquadFilter(); rLP2.type='lowpass'; rLP2.frequency.value=350; rLP2.Q.value=.7;
  rumG=ac.createGain(); rumG.gain.value=0;
  rSrc.connect(rLP2); rLP2.connect(rumG); rumG.connect(mGain); rSrc.start();

  const sSrc=ac.createBufferSource(); sSrc.buffer=nb; sSrc.loop=true;
  const sBP=ac.createBiquadFilter(); sBP.type='bandpass'; sBP.frequency.value=5000; sBP.Q.value=.8;
  steamG=ac.createGain(); steamG.gain.value=0;
  sSrc.connect(sBP); sBP.connect(steamG); steamG.connect(mGain); sSrc.start();

  const kSrc=ac.createBufferSource(); kSrc.buffer=nb; kSrc.loop=true;
  const kBP=ac.createBiquadFilter(); kBP.type='bandpass'; kBP.frequency.value=1100; kBP.Q.value=3;
  const kBP2=ac.createBiquadFilter(); kBP2.type='bandpass'; kBP2.frequency.value=1700; kBP2.Q.value=2.5;
  singG=ac.createGain(); singG.gain.value=0;
  kSrc.connect(kBP); kBP.connect(singG);
  const kSrc2=ac.createBufferSource(); kSrc2.buffer=nb; kSrc2.loop=true;
  kSrc2.connect(kBP2); kBP2.connect(singG);
  singG.connect(mGain); kSrc.start(); kSrc2.start();

  const cOsc=ac.createOscillator(); cOsc.type='sine'; cOsc.frequency.value=38;
  const cLP3=ac.createBiquadFilter(); cLP3.type='lowpass'; cLP3.frequency.value=65;
  convG=ac.createGain(); convG.gain.value=0;
  cOsc.connect(cLP3); cLP3.connect(convG); convG.connect(mGain); cOsc.start();
}

let lastPop = 0;
function popBubble(rmm){
  if(!ac || ac.currentTime - lastPop < .012) return;
  lastPop = ac.currentTime;
  const now = ac.currentTime;
  const freq = min(7000, minnaertF(rmm));
  const dur = .015 + rmm*.006;

  const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
  osc.frequency.setTargetAtTime(freq*.82, now, dur*.4);
  const gn = ac.createGain();
  const amp = min(.1, .015+rmm*.012) * (0.6 + beautyAtT()*.6);
  gn.gain.setValueAtTime(amp, now);
  gn.gain.exponentialRampToValueAtTime(.0001, now+dur);
  const flt = ac.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=freq; flt.Q.value=1.5+rmm;
  osc.connect(flt); flt.connect(gn); gn.connect(mGain);
  osc.start(now); osc.stop(now+dur+.01);

  const nD=.005, nB=ac.createBuffer(1, ceil(ac.sampleRate*nD), ac.sampleRate);
  const nd=nB.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(rnd()*2-1)*pow(1-i/nd.length,2)*.25;
  const ns=ac.createBufferSource(); ns.buffer=nB;
  const ng=ac.createGain(); ng.gain.setValueAtTime(amp*.3, now);
  ng.gain.exponentialRampToValueAtTime(.0001, now+nD);
  ns.connect(ng); ng.connect(mGain); ns.start(now); ns.stop(now+nD+.01);
}

// ═══════════════════════════════════════════════════════════════════════
// §6  PARTICLES — CRR nucleation sites with CLEAN regeneration
//
//  32 Z₂ nucleation sites on the pot bottom. Each accumulates
//  coherence C from local evidence; ruptures at C·Ω_Z₂ ≥ 1;
//  regenerates to C = 0 (clean reset — no CV injection).
//
//  4 SO(2) convection cells with independent phase accumulators;
//  each completes 2π then resets to 0.
//
//  The CV PROBES below measure what actually emerges.
// ═══════════════════════════════════════════════════════════════════════
const PARTS=[], MAX_P=2000;
const PB_Y=0.12+0.025, WY_=0.62;
const N_SITES=32;

// §CRR Jaynes-point threshold noise.
// At rupture, the "should the system fire now?" question sits at the
// maximum-entropy Bernoulli(1/2) distribution. Its standard deviation
// is σ = √(p(1-p)) = √(1/4) = 1/2. This is NOT a free parameter — it's
// fixed by the maximum-entropy axiom (Commitment 5).
//
// Consequence: effective threshold C*_eff = C* + N(0, 1/2) per cycle.
// CV of inter-rupture intervals = σ/C* = (1/2)/C* = Ω/2.
// This gives 1/(2π) for Z₂ and 1/(4π) for SO(2) with the SAME σ.
const SIGMA_JAYNES = 0.5;

// Gaussian sample via Box-Muller
function gaussN(){
  let u=0, v=0;
  while(!u) u = rnd();
  v = rnd();
  return sqrt(-2*log(u)) * cos(TAU*v);
}

// §CRR Z₂ nucleation sites — clean regeneration + Jaynes-point threshold noise
const sites = Array.from({length: N_SITES}, () => {
  const a = rnd()*TAU, r2 = .15+rnd()*.5;
  return {
    nx: cos(a)*r2, nz: sin(a)*r2,
    C: rnd()*C_STAR_Z2*0.4,
    Om: Om_Z2,
    C_star_eff: C_STAR_Z2 + gaussN()*SIGMA_JAYNES, // §CRR per-cycle threshold
    lastRupture: 0,
    intervals: []
  };
});

// §CRR SO(2) convection cells — same σ, larger capacity
const convCells = Array.from({length: 4}, () => ({
  C: rnd()*C_STAR_SO2,
  C_star_eff: C_STAR_SO2 + gaussN()*SIGMA_JAYNES,
  lastPeriod: 0,
  periods: []
}));

// §CRR CV PROBES — rolling-window measurement
const PROBE_WIN = 120;          // keep last 120 intervals per probe
const probes = {
  z2_intervals_all: [],          // pooled across sites
  so2_periods_all: [],           // pooled across cells
  diamCV: null,
  bubbleIntCV: null,
  convCV: null,
  // latest bubble sizes (for diameter CV)
  bubbleDiams: []
};

function pushBounded(arr, v, cap){
  arr.push(v);
  if(arr.length > cap) arr.shift();
}

function cvOf(arr){
  if(arr.length < 8) return null;
  let s=0, s2=0;
  for(const v of arr){ s += v; s2 += v*v; }
  const n = arr.length, m = s/n, v = s2/n - m*m;
  return (v > 0 && m > 0) ? sqrt(v)/m : null;
}

let totalSimTime = 0;

function updateConvection(dt){
  // §CRR SO(2) cells accumulate C at rate tied to thermal gradient (Tnorm)
  // Jaynes-point threshold noise (σ = 1/2) gives CV = σ/C* = 1/(4π).
  const tn = Tnorm();
  if(tn < 0.25) return;
  const rate = 0.3 + tn*0.4;
  for(const c of convCells){
    c.C += dt * rate * (1 + (rnd()-0.5)*0.4);
    if(c.C >= c.C_star_eff){
      const period = totalSimTime - c.lastPeriod;
      if(c.lastPeriod > 0) pushBounded(probes.so2_periods_all, period, PROBE_WIN);
      c.lastPeriod = totalSimTime;
      // §CRR Clean regeneration + new Jaynes threshold
      c.C = 0;
      c.C_star_eff = C_STAR_SO2 + gaussN()*SIGMA_JAYNES;
    }
  }
}

function spawnBubbles(dt){
  const tn = Tnorm();

  // §EXT Dissolved-gas bubbles in warming regime (Henry's law)
  if(tn > 0.24 && tn < 0.85 && PARTS.length < MAX_P){
    const gasRate = (tn - 0.24) * 3;
    if(rnd() < gasRate * dt){
      const a = rnd()*TAU, r2 = .1 + rnd()*.6;
      const bot = proj3D(cos(a)*r2*.72, PB_Y+.01, sin(a)*r2*.72);
      const surf = proj3D(cos(a)*r2*.72, WY_-.01, sin(a)*r2*.72);
      if(bot && surf){
        const rmm = 0.3 + rnd()*0.4;
        PARTS.push({ type:'bubble',
          x0:bot.x+(rnd()-.5)*4, y0:bot.y, x1:surf.x+(rnd()-.5)*4, y1:surf.y,
          prog:0, speed:.2+rnd()*.15, rmm,
          sz:rmm*3, startSz:rmm*.8,
          wobAmp:1+rmm*2, wobPh:rnd()*TAU, wobF:1.5+rnd()*2,
          opacity:.12+rmm*.08 });
      }
    }
  }

  // §CRR Z₂ nucleation boiling with CLEAN regeneration + Jaynes threshold noise
  if(PARTS.length > MAX_P || tn < 0.78) return;
  for(const s of sites){
    // §CRR Coherence accumulates at rate proportional to Tnorm + small noise
    s.C += dt * tn * (1.5 + rnd()*.6);
    // §CRR Rupture when C exceeds the Jaynes-perturbed effective threshold
    if(s.C >= s.C_star_eff){
      const interval = totalSimTime - s.lastRupture;
      if(s.lastRupture > 0){
        pushBounded(probes.z2_intervals_all, interval, PROBE_WIN);
      }
      s.lastRupture = totalSimTime;

      const rmm = departR() * (.5 + rnd());
      pushBounded(probes.bubbleDiams, rmm*2, PROBE_WIN);

      const bot = proj3D(s.nx*.72, PB_Y+.01, s.nz*.72);
      const surf = proj3D(s.nx*.72, WY_-.01, s.nz*.72);
      if(bot && surf){
        PARTS.push({ type:'bubble',
          x0:bot.x+(rnd()-.5)*6, y0:bot.y, x1:surf.x+(rnd()-.5)*6, y1:surf.y,
          prog:0, speed:.5+rmm*.2+tn*.35, rmm,
          sz:rmm*4.5, startSz:rmm*1.2,
          wobAmp:2+rmm*3, wobPh:rnd()*TAU, wobF:2+rnd()*3,
          opacity:.22+rmm*.1 });
      }
      // §CRR Clean regeneration + draw new Jaynes threshold for next cycle
      s.C = 0;
      s.C_star_eff = C_STAR_Z2 + gaussN()*SIGMA_JAYNES;
    }
  }
}

function spawnSteam(dt){
  if(PARTS.length > MAX_P) return;
  const rate = steamRate(); if(rate < .01) return;
  const tn = Tnorm();
  const count = rate * dt;
  for(let i=0; i < count; i++){
    const a = rnd()*TAU, r2 = rnd()*.7;
    const pp = proj3D(cos(a)*r2*.72, WY_, sin(a)*r2*.72);
    if(!pp) continue;
    const isL = rnd() < .45;
    PARTS.push({ type:'steam', x:pp.x+(rnd()-.5)*20, y:pp.y,
      vx:(rnd()-.5)*12,
      vy:-(12+rnd()*35+tn*25),
      sz: isL ? 14+rnd()*22+tn*12 : 5+rnd()*10+tn*6,
      opacity: isL ? .04+rnd()*.06*tn : .05+rnd()*.06*tn,
      life:1, maxLife:2.5+rnd()*3.0, turbPh:rnd()*TAU, large:isL });
  }
}

function doPop(bub){
  popBubble(bub.rmm);
  const n=flr(2+bub.rmm*2.5), tn=Tnorm();
  for(let i=0; i<n && PARTS.length<MAX_P; i++){
    const a=rnd()*TAU, sp=1.5+bub.rmm*3+rnd()*4;
    PARTS.push({ type:'drop', x:bub.x1, y:bub.y1,
      vx:cos(a)*sp, vy:-sp*(1.5+rnd()),
      sz:.5+rnd()*bub.rmm*.6, life:.4+rnd()*.35, opacity:.3+rnd()*.4 });
  }
  if(tn > .4){
    for(let i=0; i<2+flr(bub.rmm*1.5); i++){
      if(PARTS.length >= MAX_P) break;
      const isL = rnd() < .4;
      PARTS.push({ type:'steam', x:bub.x1+(rnd()-.5)*8, y:bub.y1,
        vx:(rnd()-.5)*5, vy:-(6+rnd()*18),
        sz: isL ? 5+rnd()*8+bub.rmm*3 : 2+rnd()*4+bub.rmm,
        opacity: isL ? .015+rnd()*.03 : .02+rnd()*.05,
        life:1, maxLife:.6+rnd(), turbPh:rnd()*TAU, large:isL });
    }
  }
}

function updateParts(dt){
  for(let i=PARTS.length-1; i>=0; i--){
    const p = PARTS[i];
    if(p.type === 'bubble'){
      p.prog += dt*p.speed; p.wobPh += dt*p.wobF*TAU;
      const t2 = min(1, p.prog);
      p.cx = p.x0+(p.x1-p.x0)*t2 + sin(p.wobPh)*p.wobAmp*(1-t2*.5);
      p.cy = p.y0+(p.y1-p.y0)*t2;
      p.curSz = p.startSz+(p.sz-p.startSz)*t2;
      p.curOp = min(.45, p.opacity*(.3+t2*.7));
      if(p.prog >= 1){ doPop(p); PARTS.splice(i,1); continue; }
    } else if(p.type === 'steam'){
      p.life -= dt/p.maxLife; p.y += p.vy*dt; p.vy *= 1-dt*.4;
      p.turbPh += dt*2.2; p.x += p.vx*dt + sin(p.turbPh)*4.*dt;
      p.vx += (rnd()-.5)*dt*12;
      p.sz += dt*(6+Tnorm()*12);
      p.opacity *= 1-dt*.22;
      if(p.life<=0 || p.opacity<.001){ PARTS.splice(i,1); continue; }
    } else if(p.type === 'drop'){
      p.vy += 55*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= dt; p.opacity *= 1-dt*1.2;
      if(p.life <= 0){ PARTS.splice(i,1); continue; }
    }
  }
}

const BSZ = 64;
const BUB_S = document.createElement('canvas'); BUB_S.width = BUB_S.height = BSZ;
const DRP_S = document.createElement('canvas'); DRP_S.width = DRP_S.height = BSZ;
const STM_S = document.createElement('canvas'); STM_S.width = STM_S.height = BSZ;
const STM_L = document.createElement('canvas'); STM_L.width = STM_L.height = 128;

(function(){
  const cr = BSZ/2, R = BSZ/2;

  const bc = BUB_S.getContext('2d');
  const bg = bc.createRadialGradient(cr,cr,0, cr,cr,R);
  bg.addColorStop(0,   'rgba(255,255,255,0)');
  bg.addColorStop(.65, 'rgba(240,245,255,0.02)');
  bg.addColorStop(.88, 'rgba(200,225,255,0.12)');
  bg.addColorStop(.94, 'rgba(220,240,255,0.25)');
  bg.addColorStop(1,   'rgba(255,255,255,0)');
  bc.fillStyle=bg; bc.beginPath(); bc.arc(cr,cr,R*.96,0,TAU); bc.fill();
  const sx=cr+R*.22, sy=cr-R*.28, sr=R*.14;
  const sg = bc.createRadialGradient(sx,sy,0, sx,sy,sr);
  sg.addColorStop(0,  'rgba(255,255,255,0.95)');
  sg.addColorStop(.5, 'rgba(255,255,255,0.25)');
  sg.addColorStop(1,  'rgba(255,255,255,0)');
  bc.fillStyle=sg; bc.beginPath(); bc.arc(sx,sy,sr,0,TAU); bc.fill();
  bc.strokeStyle='rgba(255,255,255,0.3)'; bc.lineWidth=1.5;
  bc.beginPath(); bc.arc(cr,cr,R*.9,-1.8,0.8); bc.stroke();

  const dc = DRP_S.getContext('2d');
  const dg = dc.createRadialGradient(cr,cr-R*.08,0, cr,cr,R);
  dg.addColorStop(0,  'rgba(255,252,248,0.7)');
  dg.addColorStop(.5, 'rgba(240,235,225,0.3)');
  dg.addColorStop(1,  'rgba(200,198,195,0)');
  dc.fillStyle=dg; dc.beginPath(); dc.arc(cr,cr,R,0,TAU); dc.fill();

  const sc = STM_S.getContext('2d');
  const stg = sc.createRadialGradient(cr,cr,0, cr,cr,R);
  stg.addColorStop(0,  'rgba(240,238,235,0.22)');
  stg.addColorStop(.4, 'rgba(225,223,220,0.12)');
  stg.addColorStop(.7, 'rgba(210,208,206,0.04)');
  stg.addColorStop(1,  'rgba(200,200,200,0)');
  sc.fillStyle=stg; sc.beginPath(); sc.arc(cr,cr,R,0,TAU); sc.fill();

  const lc = STM_L.getContext('2d'), lR = 64;
  const lg = lc.createRadialGradient(lR-8,lR+5,0, lR,lR,lR);
  lg.addColorStop(0,  'rgba(245,242,238,0.18)');
  lg.addColorStop(.3, 'rgba(230,228,225,0.10)');
  lg.addColorStop(.6, 'rgba(215,213,210,0.04)');
  lg.addColorStop(1,  'rgba(200,200,200,0)');
  lc.fillStyle=lg; lc.beginPath(); lc.arc(lR,lR,lR,0,TAU); lc.fill();
})();

function drawParts(){
  cx.clearRect(0,0,W,H);
  cx.save();

  cx.globalCompositeOperation = 'lighter';
  for(const p of PARTS){
    if(p.type === 'bubble'){
      const dR = max(1.5, p.curSz);
      const surfProx = max(0, min(1, (p.prog-.7)/.3));
      const strY = 1+surfProx*.4, sqX = 1/sqrt(strY);
      cx.save(); cx.translate(p.cx, p.cy); cx.scale(sqX, strY);
      cx.globalAlpha = min(.65, p.curOp);
      cx.drawImage(BUB_S, -dR,-dR, dR*2,dR*2);
      cx.restore();
      if(dR > 3){
        cx.globalAlpha = min(.25, p.curOp*.5);
        cx.strokeStyle = 'rgba(200,220,255,0.35)';
        cx.lineWidth = max(.5, dR*.06);
        cx.beginPath(); cx.ellipse(p.cx,p.cy, dR*.88*sqX,dR*.88*strY, 0,0,TAU); cx.stroke();
      }
    } else if(p.type === 'drop'){
      const dR = max(.5, p.sz);
      cx.globalAlpha = min(.8, p.opacity);
      cx.drawImage(DRP_S, p.x-dR, p.y-dR, dR*2, dR*2);
    }
  }

  cx.globalCompositeOperation = 'source-over';
  const stm = PARTS.filter(p => p.type==='steam').sort((a,b) => a.y-b.y);
  for(const p of stm){
    const dR = max(2, p.sz);
    cx.globalAlpha = min(.4, p.opacity);
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.turbPh*.15);
    cx.drawImage(p.large ? STM_L : STM_S, -dR,-dR, dR*2,dR*2);
    cx.restore();
  }
  cx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// §8  THERMOMETER (unchanged)
// ═══════════════════════════════════════════════════════════════════════
function drawThermometer(){
  const base = proj3D(.52, .67, .38);
  const tip  = proj3D(.58, 1.04, .42);
  if(!base || !tip) return;
  const thX = base.x, thBot = base.y, thTop = tip.y;
  const thH = thBot - thTop;
  if(thH < 30) return;

  cx.save();
  cx.strokeStyle = 'rgba(200,210,220,0.12)'; cx.lineWidth = 7; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(thX, thBot+4); cx.lineTo(thX, thTop); cx.stroke();
  cx.strokeStyle = 'rgba(180,190,200,0.35)'; cx.lineWidth = 5;
  cx.beginPath(); cx.moveTo(thX, thBot+4); cx.lineTo(thX, thTop); cx.stroke();

  const frac = max(0, min(1, (T_water-10)/100));
  cx.strokeStyle = 'rgba(200,30,20,0.85)'; cx.lineWidth = 3; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(thX, thBot+4); cx.lineTo(thX, thBot-thH*frac); cx.stroke();

  cx.fillStyle = 'rgba(200,30,20,0.9)';
  cx.beginPath(); cx.arc(thX, thBot+6, 5, 0, TAU); cx.fill();
  cx.strokeStyle = 'rgba(180,190,200,0.2)'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(thX, thBot+6, 6, 0, TAU); cx.stroke();

  cx.font = '300 9px Cormorant Garamond, Georgia, serif';
  cx.fillStyle = 'rgba(180,170,155,0.3)';
  cx.textAlign = 'left'; cx.textBaseline = 'middle';
  for(let deg=20; deg<=100; deg+=10){
    const yy = thBot - thH*(deg-10)/100;
    cx.strokeStyle = 'rgba(180,170,155,0.18)'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(thX+5, yy); cx.lineTo(thX+9, yy); cx.stroke();
    if(deg%20===0 || deg===100) cx.fillText(deg+'°', thX+11, yy);
  }

  cx.font = '300 11px Cormorant Garamond, Georgia, serif';
  cx.fillStyle = 'rgba(220,180,140,0.4)'; cx.textAlign = 'center';
  cx.fillText(round(T_water)+'°C', thX, thTop-12);
  cx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// §9  GAS SLIDER
// ═══════════════════════════════════════════════════════════════════════
const gasSlider = document.getElementById('gasSlider');
const markLabel = document.getElementById('markLabel');
let gasMark = 0;

gasSlider.addEventListener('input', e => {
  gasMark = parseFloat(e.target.value);
  gasPower = gasMark <= 0.05 ? 0 : Q_MAX * pow(gasMark/9, 0.8);
  markLabel.textContent = gasMark < 0.1 ? 'OFF' : round(gasMark).toString() || '½';
  const w = gasMark/9;
  markLabel.style.color = gasMark < 0.1 ? 'rgba(180,150,120,.3)' :
    `rgba(${180+flr(w*60)},${150-flr(w*60)},${120-flr(w*80)},${.3+w*.4})`;
  if(gasMark > 0.1 && !ac) initAudio();
  if(ac && ac.state === 'suspended') ac.resume();
  if(gasMark > 0.1){
    document.getElementById('stats').classList.add('show');
    document.getElementById('probes').classList.add('show');
  }
});

function resize(){
  const dpr = min(devicePixelRatio||1, 1.5);
  W = innerWidth; H = innerHeight;
  glCv.width = W*dpr; glCv.height = H*dpr;
  glCv.style.width = W+'px'; glCv.style.height = H+'px';
  gl.viewport(0, 0, W*dpr, H*dpr);
  cvEl.width = W; cvEl.height = H;
}
resize();
addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════════════
// §10  RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════
const statsEl = document.getElementById('stats');
const probesEl = document.getElementById('probes');

function fmtCVHtml(val, pred){
  if(val === null) return '<span class="val-mid">—</span>';
  const dev = (val - pred) / pred * 100;
  const absDev = abs(dev);
  const cls = absDev < 10 ? 'val-good' : absDev < 30 ? 'val-mid' : 'val-poor';
  const sign = dev >= 0 ? '+' : '';
  return '<span class="' + cls + '">' + val.toFixed(4) + '</span> '
       + '<span class="pred">(' + sign + dev.toFixed(0) + '%)</span>';
}

function fmtCV(val, pred){
  if(val === null) return '—';
  const dev = (val - pred) / pred * 100;
  const sign = dev >= 0 ? '+' : '';
  return val.toFixed(4) + '  (' + sign + dev.toFixed(0) + '%)';
}

function render(ts){
  requestAnimationFrame(render);
  const dt = min(.05, (ts-lastT)/1e3);
  lastT = ts; pt += dt; totalSimTime += dt;

  updateTemperature(dt);
  const tn = Tnorm();
  const nR = nucRate();
  const bV = beautyAtT();
  const stm = steamRate();

  const gasLevel = gasMark/9;
  if(ac){
    const now = ac.currentTime;
    gasG.gain.setTargetAtTime(min(.012, gasLevel*.012), now, .03);
    rumG.gain.setTargetAtTime(min(.10, nR*.003), now, .1);
    steamG.gain.setTargetAtTime(min(.05, stm*.003), now, .1);
    singG.gain.setTargetAtTime(bV*.035, now, .12);
    convG.gain.setTargetAtTime(min(.025, tn*tn*.025), now, .2);
  }

  // §CRR CV PROBES update
  updateConvection(dt);
  spawnBubbles(dt); spawnSteam(dt); updateParts(dt);

  // Recompute CVs every 30 frames
  if(flr(pt*60) % 30 === 0){
    probes.bubbleIntCV = cvOf(probes.z2_intervals_all);
    probes.convCV = cvOf(probes.so2_periods_all);
    probes.diamCV = cvOf(probes.bubbleDiams);
  }

  const dpr = min(devicePixelRatio||1, 1.5);
  gl.uniform2f(U.u_res, W*dpr, H*dpr);
  gl.uniform1f(U.u_time, pt);
  gl.uniform1f(U.u_temp, tn);
  gl.uniform1f(U.u_beauty, bV);
  gl.uniform1f(U.u_nucRate, nR);
  gl.uniform1f(U.u_gas, gasLevel);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawParts();
  drawThermometer();

  if(gasPower > 0 || T_water > T_AMB+1){
    const bC = PARTS.filter(p=>p.type==='bubble').length;
    const sC = PARTS.filter(p=>p.type==='steam').length;
    let txt = `${round(T_water)}°C  gas ${round(gasMark)} (${round(gasPower)}W)  Ω=${Om_Z2.toFixed(4)}\n`;
    txt += `λ=${nR.toFixed(1)}/s  B=${bV.toFixed(2)}\n`;
    if(bC) txt += `${bC} bubble${bC>1?'s':''}`;
    if(sC) txt += `  ${sC} steam`;
    txt += '\n';
    if(T_water < 50) txt += 'warming';
    else if(T_water < 80) txt += 'heating — convection';
    else if(T_water < 95) txt += 'first bubbles — subcooled nucleation';
    else if(T_water < 100) txt += 'singing kettle — B(C/Ω) peak';
    else if(T_water < 102) txt += 'rolling boil';
    else txt += 'vigorous boil';
    if(bV > .3) txt += ' ♫';
    statsEl.textContent = txt;

    // CV probes panel — bottom-left (styled HTML for readability)
    const nZ2 = probes.z2_intervals_all.length;
    const nSO2 = probes.so2_periods_all.length;
    const nDi = probes.bubbleDiams.length;
    let ptxt = '<span class="h">CV PROBES</span>  <span class="n">live · rolling ' + PROBE_WIN + '</span><br>';
    ptxt += '<span class="lbl">Z₂ bubble intervals</span>  <span class="pred">pred 0.1592</span><br>';
    ptxt += '&nbsp;&nbsp;' + fmtCVHtml(probes.bubbleIntCV, CV_Z2_PRED) + '  <span class="n">n=' + nZ2 + '</span><br>';
    ptxt += '<span class="lbl">Z₂ bubble diameters</span>  <span class="pred">pred 0.1592</span><br>';
    ptxt += '&nbsp;&nbsp;' + fmtCVHtml(probes.diamCV, CV_Z2_PRED) + '  <span class="n">n=' + nDi + '</span><br>';
    ptxt += '<span class="lbl">SO(2) convection</span>  <span class="pred">pred 0.0796</span><br>';
    ptxt += '&nbsp;&nbsp;' + fmtCVHtml(probes.convCV, CV_SO2_PRED) + '  <span class="n">n=' + nSO2 + '</span>';
    probesEl.innerHTML = ptxt;
  } else {
    statsEl.textContent = '';
    probesEl.innerHTML = '';
  }
}

requestAnimationFrame(render);
</script>
