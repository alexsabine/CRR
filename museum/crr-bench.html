<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Lines in Clay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed stage, quiet film-slate controls pinned to the corners */
  --studio:#0c0d10;
  --ink:#f3ecdf;
  --ink-soft:rgba(243,236,223,.72);
  --panel:rgba(14,15,19,.62);
  --line:rgba(243,236,223,.22);
  --accent:#ff7a3c;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--studio);color:var(--ink);overflow:hidden}
body{transition:opacity .35s}
body.leaving{opacity:0}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage.dragging{cursor:grabbing}
#stage:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.head{position:fixed;left:20px;top:16px;right:300px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.head h1{font:600 clamp(22px,3.2vw,34px)/1.05 var(--display);margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.head p{font:400 13px/1.45 var(--mono);margin:0;color:var(--ink-soft);max-width:54ch}
button{font:500 12.5px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ink-soft)}
button[aria-pressed="true"]{background:var(--ink);color:#15161a;border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,.sheet:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#back{position:fixed;right:20px;top:16px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:3}
.bar{position:fixed;left:16px;right:16px;bottom:16px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:400 12.5px/1 var(--mono)}
.card{margin:0 0 10px}
.card .k{font:600 19px/1.15 var(--display);margin:0 0 5px}
.card .k span{font:400 12px/1 var(--mono);color:var(--accent);margin-right:10px;letter-spacing:.02em}
.card p{font:400 12.5px/1.5 var(--mono);margin:0;color:var(--ink);max-width:150ch}
.card p em{font-style:normal;color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.steps{display:inline-flex;gap:4px}
.steps button{padding:8px 0;width:32px;text-align:center}
.steps button:last-child{width:auto;padding:8px 11px}
#play{min-width:74px}
#next{background:var(--accent);border-color:var(--accent);color:#1a0d05}
.sl{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);white-space:nowrap}
.sl input{width:104px;accent-color:var(--accent);height:22px;margin:0}
.sl output{color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2ch}
.read{position:fixed;right:20px;top:60px;margin:0;display:grid;grid-template-columns:auto auto;gap:5px 14px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font:400 12.5px/1.25 var(--mono);font-variant-numeric:tabular-nums;pointer-events:none;max-width:min(300px,calc(100vw - 32px))}
.read dt{color:var(--ink-soft);margin:0}.read dd{margin:0;text-align:right;white-space:nowrap}
.read dt small{display:block;font-size:10.5px;opacity:.75}
.read .big{font:600 22px/1 var(--display);grid-column:1/-1;text-align:left;margin-bottom:2px}
.read .sec{grid-column:1/-1;text-align:left;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.read .note{grid-column:1/-1;color:var(--accent);text-align:left;white-space:normal}
.sheet{position:fixed;background:rgba(14,15,19,.86);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:16px 18px;overflow:auto;font:400 12.5px/1.55 var(--mono);z-index:2}
.sheet h2{font:600 21px/1.15 var(--display);margin:0 0 8px}
.sheet h3{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px}
.sheet p{margin:0 0 8px}.sheet ul{margin:0 0 8px;padding-left:18px}.sheet li{margin:0 0 3px}
.sheet table{border-collapse:collapse;width:100%;margin:0 0 8px}
.sheet td,.sheet th{border-top:1px solid var(--line);padding:4px 8px 4px 0;text-align:left;vertical-align:top;font-weight:400}
.sheet th{color:var(--ink-soft)}
.sheet code{font:inherit;color:#ffd9a8}
#final{left:20px;top:84px;width:min(540px,calc(100vw - 40px));padding:14px 18px;line-height:1.45}
#final td,#final th{padding:2px 10px 2px 0}#final p,#final ul{margin-bottom:6px}#final li{margin-bottom:1px}
#about{right:20px;top:60px;width:min(560px,calc(100vw - 32px));z-index:4}
#about .x{float:right;margin:0 0 8px 12px}
@media (max-width:760px){.head p{display:none}.head{right:150px}.head h1{font-size:20px}
  .read{top:52px;left:12px;right:auto;font-size:11px;padding:8px 10px;gap:3px 10px}.read dt small{display:none}.read .big{font-size:17px}
  #back{right:12px;top:12px;padding:8px 10px;font-size:11.5px}
  .bar{left:8px;right:8px;bottom:8px;padding:9px 10px}.card .k{font-size:16px}.card p{font-size:11.5px;line-height:1.42}
  .sl input{width:84px}button{padding:8px 10px;font-size:11.5px}.steps button{width:27px}
  #final{left:8px;top:50px;width:calc(100vw - 16px)}#about{right:8px;top:50px;width:calc(100vw - 16px)}}
#fail{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:400 15px/1.5 var(--mono)}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="A clay ring with a yellow bead on it, on a wooden bench, animated in stop motion. Drag the bead round the ring, or use the left and right arrow keys to move it."></canvas>
<div class="head">
  <h1>Six Lines in Clay</h1>
  <p>Coherence, Rupture, Regeneration, worked by hand.</p>
</div>
<button id="back" type="button">Back to the museum</button>
<dl class="read" id="read"></dl>
<div class="sheet" id="final" role="region" aria-label="What is new in it, and what is not" tabindex="0" hidden></div>
<div class="sheet" id="about" role="dialog" aria-label="About this piece" tabindex="-1" hidden></div>
<div class="bar" id="bar">
  <div class="card" aria-live="polite"><div class="k" id="cardK"></div><p id="cardP"></p></div>
  <div class="row">
    <span class="steps" role="group" aria-label="Steps" id="steps"></span>
    <button id="next" type="button">Next</button>
    <button id="play" type="button">Pause</button>
    <label class="sl" id="lsigma">Ruler step &sigma; <input id="sigma" type="range" min="0.1" max="0.8" step="0.05" value="0.3"><output id="osigma"></output></label>
    <label class="sl" id="lq">Keep q <input id="q" type="range" min="0" max="0.95" step="0.05" value="0.6"><output id="oq"></output></label>
    <button id="motor" type="button" aria-pressed="false">Motor</button>
    <label class="sl" id="lhill">Hill A <input id="hill" type="range" min="0" max="1.5" step="0.05" value="1"><output id="ohill"></output></label>
    <label class="sl" id="ltau">Push &tau; <input id="tau" type="range" min="1.6" max="4" step="0.1" value="2"><output id="otau"></output></label>
    <button id="rep2" type="button">Replay at double speed</button>
    <button id="reph" type="button">Replay at half speed</button>
    <button id="again" type="button">Start again</button>
    <button id="aboutBtn" type="button" aria-expanded="false" aria-controls="about">About</button>
  </div>
</div>
<div id="fail">This piece needs WebGL 2, which this browser or device has not made available.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
const TEST = window.__TEST || null;
const canvas = document.getElementById('stage');
const HOME = { blake: 'index.html', jooles: 'jooles.html', park: 'park.html', site: '../index.html' };
const QS = new URLSearchParams(location.search);
const FROM = Object.prototype.hasOwnProperty.call(HOME, QS.get('from')) ? QS.get('from') : 'blake';
const STOP = /^[a-z0-9_:\-]{1,40}$/.test(QS.get('stop')||'') ? QS.get('stop') : 'sixlines';
const BACK = HOME[FROM] + '#' + STOP; if (FROM === 'site') { const bb = document.getElementById('back'); if (bb) bb.textContent = 'Back to the front page'; }
const LOW = QS.get('q')==='low';
const STILL = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function goBack(){ document.body.classList.add('leaving'); setTimeout(()=>{ location.href = BACK; }, 360); }
document.getElementById('back').onclick = goBack;

/* ───────────────────────── the model: six lines, nothing else ─────────────────────────
   Source: "A conditional mathematical core" (Phoenix_Egg/CORE/MATHEMATICS.md), sections I to VI.
   Carrier: unit-covariance Gaussians in the plane with mean (cos s, sin s). Fisher metric g = 1, so the Fisher arc s is the
   angle, the circumference is ell = 2 pi and a half-turn is a = pi. Distances are intrinsic to the circle.
   R1  Count      C  = (path travelled)/sigma                         ordinary name: information length
   R2  Cut        t[n+1] = first time s - s[n] = a                    ordinary name: first-passage time
   R3  Surplus    S  = C - C* = 2B/sigma, B = backward travel          ordinary name: path length minus chord
   R4  Physics    zeta ds/dt = tau - dU/ds,  U = A cos s  (no noise)   an added constitutive law: an overdamped driven rotor
   R5  Seed       m' = q m + (1-q) Phi, Phi = the occasion's Count     ordinary name: exponential (fixed-gain Kalman) filter
   R6  Cost       Q T >= zeta (a + 2B)^2, Q = integral zeta (ds/dt)^2  ordinary name: thermodynamic length (Cauchy-Schwarz)
   Parameters: sigma (ruler step), q (how much old seed is kept), tau (push), A (hill), zeta = 1 (friction).
   Left out: noise, inertia, friction that varies round the ring, any effect of the seed on the motion, curved content. */
const ELL = 2*Math.PI, HALF = Math.PI, DT = 1/12, SUB = 16;
function Machine(){ this.sigma=.3; this.q=.6; this.tau=2; this.A=0; this.zeta=1; this.cutting=true; this.reset(); }
Machine.prototype = {
  reset(){ this.s=0; this.sCut=0; this.t=0; this.tCut=0; this.L=0; this.P=0; this.B=0; this.Q=0; this.Qt=0; this.N=0; this.Ldone=0; this.occ=[]; this.pure=true; },
  setp(k,v){ if(k==='tau'||k==='A'||k==='zeta') this.pure=this.pure&&this.t===this.tCut; this[k]=v; },
  U(s){ return this.A*Math.cos(s); },
  f(s){ return (this.tau + this.A*Math.sin(s))/this.zeta; },                 // R4: ds/dt = (tau - dU/ds)/zeta
  seg(ds,dt){ const d=Math.abs(ds); this.s+=ds; this.t+=dt; if(ds>=0) this.P+=d; else this.B+=d; this.L+=d;
    if(d>0){ const h=this.zeta*ds*ds/dt; this.Q+=h; this.Qt+=h; } },          // heat lost to friction over this piece of path
  cut(target){ this.s=target;                                                // R2: the cut is a moment; nothing happens "during" it
    const o={ n:this.N, s0:this.sCut, s1:target, t0:this.tCut, t1:this.t, T:this.t-this.tCut, P:this.P, B:this.B, L:this.P+this.B, Q:this.Q,
      dU:this.U(target)-this.U(this.sCut), tau:this.tau, A:this.A, zeta:this.zeta, pure:this.pure };
    this.occ.push(o); if(this.occ.length>1000) this.occ.shift();
    this.N++; this.Ldone+=o.L; this.sCut=target; this.tCut=this.t; this.P=0; this.B=0; this.Q=0; this.pure=true; },
  /* a stretch of path given from outside (a hand, or a replay): ds over dt seconds at a steady pace */
  move(ds,dt){ this.pure=false;
    while(this.cutting && ds>0 && this.s+ds-this.sCut>=HALF){ const target=this.sCut+HALF, d1=target-this.s, dt1=dt*d1/ds;
      this.seg(d1,dt1); this.cut(target); this.pure=false; ds-=d1; dt-=dt1; }
    this.seg(ds,Math.max(dt,0)); },
  rk(s,h){ const k1=this.f(s), k2=this.f(s+h/2*k1), k3=this.f(s+h/2*k2), k4=this.f(s+h*k3); return s+h/6*(k1+2*k2+2*k3+k4); },
  /* the driven rotor for dt seconds: classical Runge-Kutta, SUB steps a picture; the first passage is located by Newton's method */
  rotor(dt){ const h=dt/SUB;
    for(let i=0;i<SUB;i++){ let rem=h;
      while(rem>0){ const s1=this.rk(this.s,rem);
        if(this.cutting && s1-this.sCut>=HALF){ const target=this.sCut+HALF; let hh=rem*(target-this.s)/(s1-this.s);
          for(let j=0;j<6;j++) hh-=(this.rk(this.s,hh)-target)/this.f(target);
          hh=Math.min(Math.max(hh,0),rem); this.seg(target-this.s,hh); this.cut(target); rem-=hh; if(rem<1e-14) rem=0; }
        else { this.seg(s1-this.s,rem); rem=0; } } } },
  chord(){ const r=((this.s-this.sCut)%ELL+ELL)%ELL; return Math.min(r,ELL-r); },   // shortest way round the circle itself
  now(){ const L=this.P+this.B, ch=this.chord(), T=this.t-this.tCut;
    return { C:L/this.sigma, Cstar:ch/this.sigma, S:(L-ch)/this.sigma, T, Q:this.Q, least:T>0?this.zeta*L*L/T:0 }; },
  Stotal(){ return this.cutting ? (this.Ldone-this.N*HALF)/this.sigma + this.now().S : this.now().S; },
  view(o){ const sg=this.sigma; return { n:o.n, s0:o.s0, s1:o.s1, t1:o.t1, T:o.T, B:o.B, C:o.L/sg, Cstar:HALF/sg, S:(o.L-HALF)/sg, twoB:2*o.B/sg,
    Q:o.Q, QT:o.Q*o.T, bound:o.zeta*o.L*o.L, work:o.tau*HALF-o.dU, pure:o.pure, tau:o.tau, A:o.A, zeta:o.zeta,
    Tmin:o.zeta*HALF/(o.tau+Math.abs(o.A)), Tmax:o.tau>Math.abs(o.A)?o.zeta*HALF/(o.tau-Math.abs(o.A)):Infinity }; },
  /* R5 on a flat scalar: the prior m0 is "the direct way, no wandering"; w is the share of the lump that came from surplus (its colour) */
  seeds(){ const m=[HALF/this.sigma], w=[0], phi=[], wp=[];
    for(const o of this.occ){ const p=o.L/this.sigma, wo=Math.max(0,(o.L-HALF)/o.L), m0=m[m.length-1], m1=this.q*m0+(1-this.q)*p;
      w.push(m1>0?(this.q*m0*w[w.length-1]+(1-this.q)*p*wo)/m1:0); m.push(m1); phi.push(p); wp.push(wo); }
    return {m,w,phi,wp}; },
  snapshot(){ const o={}; for(const k of ['sigma','q','tau','A','zeta','cutting','s','sCut','t','tCut','L','P','B','Q','Qt','N','Ldone','pure']) o[k]=this[k]; o.occ=this.occ.slice(); return o; },
  restore(o){ const keep={sigma:this.sigma,q:this.q,tau:this.tau,A:this.A,zeta:this.zeta}; Object.assign(this,o,keep); this.occ=o.occ.slice(); }
};
function seedRec(m0,phis,q){ let m=m0; for(const p of phis) m=q*m+(1-q)*p; return m; }
function seedClosed(m0,phis,q){ const n=phis.length; let m=Math.pow(q,n)*m0; for(let j=0;j<n;j++) m+=(1-q)*Math.pow(q,n-1-j)*phis[j]; return m; }
function summary(m){ return { t:m.t, s:m.s, C:m.L/m.sigma, S:m.Stotal(), N:m.N, Q:m.Qt, cuts:m.occ.map(o=>o.s1), occ:m.occ.map(o=>m.view(o)) }; }
const LAB = {
  rotor(p){ p=p||{}; const m=new Machine(); for(const k of ['tau','A','zeta','sigma','q']) if(p[k]!==undefined) m[k]=p[k];
    const n=p.halfTurns||2; let g=0; while(m.N<n && g++<200000) m.rotor(DT); return summary(m); },
  path(ds,dt,p){ p=p||{}; const m=new Machine(); for(const k of ['zeta','sigma','q','cutting']) if(p[k]!==undefined) m[k]=p[k];
    for(const d of ds) m.move(d,dt); const r=summary(m); r.seeds=m.seeds().m; return r; },
  seedRec, seedClosed
};
const M = new Machine();
if (!window.THREE || !canvas.getContext('webgl2')) { document.getElementById('fail').style.display='grid';
  window.PIECE={ name:'crr-bench', lab:LAB, state(){ return {frame:0, step:0, webgl:false, back:BACK}; } }; return; }

/* ───────────────────────── noise (CPU) ───────────────────────── */
function h3(x,y,z){ let n = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul(z|0,1440662683);
  n = Math.imul(n ^ (n>>>13), 1274126177); return ((n ^ (n>>>16))>>>0)/4294967296; }
function vn3(x,y,z){ const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  let fx=x-xi, fy=y-yi, fz=z-zi; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); fz=fz*fz*(3-2*fz);
  const a=h3(xi,yi,zi), b=h3(xi+1,yi,zi), c=h3(xi,yi+1,zi), d=h3(xi+1,yi+1,zi),
        e=h3(xi,yi,zi+1), f=h3(xi+1,yi,zi+1), g=h3(xi,yi+1,zi+1), h=h3(xi+1,yi+1,zi+1);
  const ab=a+(b-a)*fx, cd=c+(d-c)*fx, ef=e+(f-e)*fx, gh=g+(h-g)*fx;
  const p=ab+(cd-ab)*fy, q=ef+(gh-ef)*fy; return p+(q-p)*fz; }
function fbm3(x,y,z){ return vn3(x,y,z)*.55 + vn3(x*2.1+5,y*2.1+3,z*2.1+1)*.3 + vn3(x*4.3+9,y*4.3+7,z*4.3+2)*.15; }
const rnd=(i,j)=>h3(i,j,77);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ───────────────────────── renderer ───────────────────────── */
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
const HDR = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');

/* Contact-hardening soft shadows (PCSS) patched into three's shadow lookup. */
(function(){
  const pcss = `
  float ignoise(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }
  float pcssShadow(sampler2D sm, vec3 c, float K){
    float rot = ignoise(gl_FragCoord.xy)*6.2831853;
    float search = K*0.05, bsum=0., bn=0.;
    for(int i=0;i<14;i++){ float fi=float(i)+.5; float r=sqrt(fi/14.); float a=fi*2.39996323+rot;
      float d = unpackRGBAToDepth(texture2D(sm, c.xy+vec2(cos(a),sin(a))*r*search));
      if(d < c.z-0.0006){ bsum+=d; bn+=1.; } }
    if(bn<.5) return 1.;
    float pen = clamp((c.z-bsum/bn)*K, 0.0006, 0.02);
    float s=0.;
    for(int i=0;i<28;i++){ float fi=float(i)+.5; float r=sqrt(fi/28.); float a=fi*2.39996323+rot*1.7;
      s += step(c.z, unpackRGBAToDepth(texture2D(sm, c.xy+vec2(cos(a),sin(a))*r*pen))); }
    return s/28.;
  }`;
  let ch = THREE.ShaderChunk.shadowmap_pars_fragment;
  ch = ch.replace('#ifdef USE_SHADOWMAP', '#ifdef USE_SHADOWMAP\n'+pcss);
  ch = ch.replace('#if defined( SHADOWMAP_TYPE_PCF )', 'return pcssShadow(shadowMap, shadowCoord.xyz, shadowRadius);\n#if defined( SHADOWMAP_TYPE_PCF )');
  THREE.ShaderChunk.shadowmap_pars_fragment = ch;
})();

/* ───────────────────────── materials ───────────────────────── */
const shared = { uPolar:{value:0}, uSeed:{value:new THREE.Vector3()}, uShip:{value:new THREE.Vector4()}, uSeaT:{value:0} };
const GLSL_NOISE = `
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }`;
const CLAY_PARS = GLSL_NOISE + `
uniform mat3 normalMatrix;
uniform vec3 uSeed; uniform float uBoil, uBump, uSmear, uSpeck, uGlow, uPolar; uniform vec3 uCol2;
uniform vec4 uBandY; uniform vec3 uBandC[4];
uniform vec4 uShip; uniform float uSeaT; uniform vec3 uDeep, uMid, uLight, uFoam;
varying vec3 vObjPos; varying vec3 vObjN;
#ifdef SEA
varying vec2 vSea;
#endif
float clayH(vec3 p){
  vec3 q = p + uSeed*uBoil;

aboutEl.innerHTML='<button class="x" id="aboutX" type="button">Close</button><h2>About this bench</h2>'
 +'<p>Everything that moves here is computed from six lines, set out in the museum&rsquo;s paper &ldquo;A conditional mathematical core&rdquo; (sections I to VI). The clay is a picture of the numbers.</p>'
 +'<h3>The model</h3><table>'
 +'<tr><td>Loop</td><td>A state read as a phase s on a circle. Here the circle is a family of bell curves (Gaussians) of unit spread whose centre goes round a unit circle. Neighbours are equally hard to tell apart everywhere, so the distance s is simply the angle: all the way round is 2&pi;, a half-turn is a = &pi;.</td></tr>'
 +'<tr><td>R1 Count</td><td><code>C = (1/&sigma;) &int; |ds|</code>, the path travelled in steps of &sigma;. Ordinary name: information length.</td></tr>'
 +'<tr><td>R2 Cut</td><td><code>t<sub>n+1</sub> = first t with s(t) &minus; s(t<sub>n</sub>) = a</code>. N counts the cuts. Ordinary name: first-passage time.</td></tr>'
 +'<tr><td>R3 Surplus</td><td><code>S = C &minus; C* = 2B/&sigma; &ge; 0</code>, with C* = a/&sigma; and B the travel backwards. Ordinary name: path length minus chord.</td></tr>'
 +'<tr><td>R4 Physics</td><td><code>&zeta; ds/dt = &tau; &minus; dU/ds</code>, <code>U = A cos s</code>, no noise. Then <code>T = &int; &zeta;/(&tau; + A sin s) ds</code> over the half-turn, and <code>&zeta;a/(&tau;+A) &le; T &le; &zeta;a/(&tau;&minus;A)</code>. Replaying a path faster or slower changes only t. Ordinary name: an overdamped driven rotor.</td></tr>'
 +'<tr><td>R5 Seed</td><td><code>m&prime; = q m + (1 &minus; q) &Phi;</code>. On this bench &Phi; is the Count of the occasion just finished and the first seed is the direct way, a/&sigma;: both are this bench&rsquo;s choices. Ordinary name: exponential smoothing, the fixed-gain case of a Kalman filter.</td></tr>'
 +'<tr><td>R6 Cost</td><td><code>Q&middot;T &ge; &zeta; (a + 2B)&sup2;</code>, with <code>Q = &int; &zeta; (ds/dt)&sup2; dt</code>; for the motor alone <code>Q = &tau;a &minus; &Delta;U</code>. Ordinary name: thermodynamic length (the Cauchy&ndash;Schwarz inequality).</td></tr></table>'
 +'<h3>The values now</h3><table id="avals"></table>'
 +'<h3>How it is worked out</h3><p>The clay clock counts pictures: twelve a second, each a twelfth of a second of bench time. Your hand is read once a picture and taken to move at a steady pace in between. The motor is integrated by the classical Runge&ndash;Kutta method, sixteen steps a picture, and the moment of each cut is found by Newton&rsquo;s method. With &tau; = 2, A = 1, &zeta; = 1 the half-turns should take 2&pi;/(3&radic;3) = 1.209200 s and 4&pi;/(3&radic;3) = 2.418399 s.</p>'

 +'<li>Other rulers. Measured straight across the family of all bell curves, not round the ring, a half-turn is shorter than &pi;, and a straight run round the ring would then show a surplus. &ldquo;S = 0 if you never turn back&rdquo; holds only for distance measured along the loop itself.</li>'

  xy(s){ BOARD.updateWorldMatrix(true,false); const v=BOARD.localToWorld(onRing(s,RR,.12,new THREE.Vector3())).project(camera), b=canvas.getBoundingClientRect(); return {x:b.left+(v.x+1)/2*b.width, y:b.top+(1-v.y)/2*b.height}; }, tick(n){ for(let i=0;i<(n||1);i++) advance(); readout(); dirty=true; return this.state(); } };
if(TEST){ window.__clay={ shot(f,v){ if(v) Object.assign(view,v); if(typeof f==='number') frame=f; draw(); renderer.getContext().finish(); return true; } }; return; }
function tick(t){ requestAnimationFrame(tick);
  const dt=Math.min(t-last,250); last=t;
  if(playing){ acc+=dt; const per=1000*DT; if(acc>=per){ acc=acc%per; advance(); readout(); dirty=true; } }
  if(dirty){ dirty=false; const t0=performance.now(); draw(); renderer.getContext().finish(); const ms=performance.now()-t0;
    // if a picture takes longer than its slot, shoot at a lower resolution
    if(ms>1000*DT*.85){ if(++slow>5 && budget>5e5){ budget*=.72; slow=0; build(); dirty=true; } } else slow=Math.max(0,slow-1); }
}
requestAnimationFrame(tick);
})();
