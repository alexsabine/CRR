[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crr-cv-predictions"
version = "0.1.0"
description = "Machine-readable CRR coefficient-of-variation predictions: 132-system paper table + Z₂-on-SO(2) compositional + Lie-group extensions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CRR predictions package" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crr_cv_predictions = ["../data/*.csv", "../data/*.json"]
